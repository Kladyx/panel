<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordMaster v2.2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0d0d1f;--card:#15152a;--border:#222240;--cyan:#34d399;--purple:#a78bfa;--orange:#fb923c;--yellow:#facc15;--pink:#f472b6;--blue:#60a5fa;--red:#f87171;}
html,body{width:100%;height:100%;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:#f0f0f8;overflow-x:hidden;}
body{background:radial-gradient(circle at 20% 0%,rgba(52,211,153,0.08),transparent 40%),radial-gradient(circle at 80% 100%,rgba(167,139,250,0.06),transparent 40%),var(--bg);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#080d1c;border-bottom:1px solid rgba(52,211,153,0.2);gap:8px;flex-wrap:wrap;}
.logo{font-size:0.95rem;font-weight:800;background:linear-gradient(135deg,#34d399,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;}
.prog-wrap{flex:1;min-width:120px;max-width:200px;}
.prog-meta{display:flex;justify-content:space-between;font-size:0.62rem;color:#888;margin-bottom:3px;font-weight:700;}
.prog-track{height:5px;background:#1e1e38;border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa);transition:width 0.6s;box-shadow:0 0 12px rgba(52,211,153,0.5);}
.tab-group{display:flex;gap:3px;background:#1a1a2e;border-radius:10px;padding:3px;flex-wrap:wrap;}
.tab-btn{padding:6px 11px;border-radius:7px;border:none;cursor:pointer;font-family:inherit;font-size:0.72rem;font-weight:700;transition:all 0.2s;background:transparent;color:#888;}
.tab-btn.active{background:linear-gradient(135deg,#34d399,#60a5fa);color:#0d0d1f;}
.tab-btn:active{transform:scale(0.94);}
.cat-row{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;background:#080d1c;border-bottom:1px solid #111128;}
.cat-row::-webkit-scrollbar{display:none;}
.chip{white-space:nowrap;padding:5px 13px;border-radius:99px;border:1.5px solid #252548;background:transparent;color:#888;font-family:inherit;font-size:0.72rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
.chip:active{transform:scale(0.92);}
.chip.active{border-color:transparent;color:#0d0d1f;font-weight:800;}
.cards-wrap{padding:18px 14px 0;}
.card-outer{transition:opacity 0.2s,transform 0.2s;perspective:1000px;}
.card-outer.hide{opacity:0;transform:translateX(-30px);}
.card-outer.hide-r{opacity:0;transform:translateX(30px);}
.card-outer.flip-in{animation:flipIn 0.4s ease;}
@keyframes flipIn{0%{transform:rotateY(-90deg);opacity:0;}100%{transform:rotateY(0);opacity:1;}}
.card{background:linear-gradient(145deg,#15152a,#1a1a32);border:1px solid var(--border);border-radius:22px;padding:26px 22px 20px;position:relative;overflow:hidden;min-height:200px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,0.3);}
.card-top-bar{position:absolute;top:0;left:0;right:0;height:4px;border-radius:22px 22px 0 0;}
.card-glow{position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;opacity:0.1;filter:blur(40px);pointer-events:none;}
.cat-badge{display:inline-flex;align-items:center;padding:3px 11px;border-radius:99px;font-size:0.65rem;font-weight:800;width:fit-content;text-transform:uppercase;letter-spacing:0.5px;}
.en-word{font-size:1.85rem;font-weight:800;letter-spacing:-0.6px;color:#f0f0fa;line-height:1.2;}
.cs-word{font-size:1rem;font-weight:500;color:#9999bb;}
.card-actions{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:10px;}
.speak-btn{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.25rem;transition:all 0.2s;flex-shrink:0;}
.speak-btn:active{transform:scale(0.9);}
.speak-btn.pulse{animation:pulseBtn 0.8s ease infinite;}
@keyframes pulseBtn{0%{box-shadow:0 0 0 0 rgba(52,211,153,0.6);}100%{box-shadow:0 0 0 14px transparent;}}
.learned-btn{padding:9px 16px;border-radius:11px;border:1.5px solid;font-family:inherit;font-size:0.75rem;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.2s;}
.learned-btn:active{transform:scale(0.94);}
.learned-btn.no{border-color:#252548;background:transparent;color:#666688;}
.learned-btn.yes{border-color:#34d399;background:rgba(52,211,153,0.15);color:#34d399;box-shadow:0 0 12px rgba(52,211,153,0.2);}
.nav-row{display:flex;align-items:center;justify-content:space-between;padding:14px;}
.nav-btn{width:48px;height:48px;border-radius:50%;border:1.5px solid #252548;background:#15152a;color:#888;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.05rem;transition:all 0.2s;}
.nav-btn:hover{border-color:#34d399;color:#34d399;}
.nav-btn:active{transform:scale(0.92);}
.counter{font-size:0.82rem;color:#666688;font-weight:800;letter-spacing:0.5px;}
.shuffle-btn{padding:6px 12px;border-radius:99px;border:1.5px solid #252548;background:transparent;color:#888;font-family:inherit;font-size:0.7rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
.shuffle-btn:active{transform:scale(0.94);}
.shuffle-btn.on{border-color:#a78bfa;color:#a78bfa;background:rgba(167,139,250,0.1);}
/* EBOOK */
.ebook-wrap{padding:14px;}
.ebook-head{margin-bottom:14px;}
.ebook-title{font-size:1.05rem;font-weight:800;color:#e0e0f5;}
.ebook-sub{font-size:0.72rem;color:#666688;margin-top:3px;}
.search-box{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid #252548;background:#15152a;color:#e0e0f5;font-family:inherit;font-size:0.85rem;margin-top:10px;outline:none;transition:all 0.2s;}
.search-box:focus{border-color:#34d399;}
.sec-header{display:flex;align-items:center;gap:8px;font-size:0.82rem;font-weight:800;margin:18px 0 8px;}
.sec-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sec-count{color:#444466;font-weight:500;}
.eb-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:1px solid #222240;background:#15152a;margin-bottom:5px;transition:all 0.2s;}
.eb-row.learned{border-color:rgba(52,211,153,0.3);background:rgba(52,211,153,0.06);}
.eb-speak{width:34px;height:34px;border-radius:50%;border:none;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;}
.eb-speak:active{transform:scale(0.9);}
.eb-en{font-size:0.9rem;font-weight:700;color:#e0e0f5;}
.eb-cs{font-size:0.78rem;color:#777799;margin-top:1px;}
.eb-check{font-size:0.9rem;font-weight:700;color:#34d399;margin-left:auto;flex-shrink:0;}
/* TEST */
.test-wrap{padding:14px;}
.test-intro{background:linear-gradient(145deg,#15152a,#1a1a32);border:1px solid #252548;border-radius:18px;padding:22px 18px;text-align:center;}
.test-icon{font-size:3rem;margin-bottom:8px;}
.test-title{font-size:1.2rem;font-weight:800;color:#f0f0fa;margin-bottom:6px;}
.test-desc{font-size:0.82rem;color:#888;margin-bottom:18px;line-height:1.5;}
.test-options{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.test-opt-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:11px;border:1.5px solid #252548;background:#0d0d1f;}
.test-opt-row label{color:#aaa;font-size:0.78rem;font-weight:600;}
.test-opt-row select{background:#1a1a2e;color:#e0e0f5;border:1px solid #252548;border-radius:7px;padding:5px 10px;font-family:inherit;font-size:0.8rem;font-weight:700;outline:none;cursor:pointer;}
.start-btn{padding:13px 28px;border-radius:14px;border:none;font-family:inherit;font-size:0.95rem;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#34d399,#60a5fa);color:#0d0d1f;letter-spacing:0.5px;transition:all 0.2s;width:100%;box-shadow:0 6px 20px rgba(52,211,153,0.3);}
.start-btn:active{transform:scale(0.97);}
.start-btn:disabled{opacity:0.4;cursor:not-allowed;}
.q-card{background:linear-gradient(145deg,#15152a,#1a1a32);border:1px solid #252548;border-radius:18px;padding:20px 18px;margin-bottom:14px;}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.q-num{font-size:0.72rem;font-weight:800;color:#666688;letter-spacing:1px;}
.q-score{font-size:0.78rem;font-weight:800;color:#34d399;}
.q-prog{height:4px;background:#1e1e38;border-radius:99px;overflow:hidden;margin-bottom:16px;}
.q-prog-fill{height:100%;background:linear-gradient(90deg,#34d399,#60a5fa);transition:width 0.4s;}
.q-prompt{font-size:0.78rem;color:#888;margin-bottom:6px;font-weight:700;}
.q-word{font-size:1.7rem;font-weight:800;color:#f0f0fa;margin-bottom:18px;line-height:1.25;}
.q-answers{display:flex;flex-direction:column;gap:8px;}
.q-ans{padding:13px 16px;border-radius:12px;border:1.5px solid #252548;background:#0d0d1f;color:#e0e0f5;font-family:inherit;font-size:0.92rem;font-weight:600;cursor:pointer;text-align:left;transition:all 0.2s;}
.q-ans:active{transform:scale(0.98);}
.q-ans:hover{border-color:#34d399;}
.q-ans.correct{border-color:#34d399;background:rgba(52,211,153,0.12);color:#34d399;font-weight:800;animation:correctPulse 0.5s;}
.q-ans.wrong{border-color:#f87171;background:rgba(248,113,113,0.12);color:#f87171;font-weight:800;animation:wrongShake 0.4s;}
.q-ans.disabled{pointer-events:none;}
@keyframes correctPulse{0%{transform:scale(1);}50%{transform:scale(1.03);}100%{transform:scale(1);}}
@keyframes wrongShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.next-btn{margin-top:14px;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#34d399,#60a5fa);color:#0d0d1f;font-family:inherit;font-size:0.88rem;font-weight:800;cursor:pointer;width:100%;transition:all 0.2s;}
.next-btn:active{transform:scale(0.97);}
.result-card{text-align:center;padding:30px 20px;}
.result-emoji{font-size:4rem;margin-bottom:10px;animation:bounce 0.6s ease;}
@keyframes bounce{0%{transform:scale(0);}60%{transform:scale(1.2);}100%{transform:scale(1);}}
.result-score{font-size:2.5rem;font-weight:800;background:linear-gradient(135deg,#34d399,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.result-pct{font-size:1.1rem;color:#888;font-weight:700;margin-bottom:6px;}
.result-msg{font-size:0.9rem;color:#aaa;margin-bottom:20px;font-weight:600;}
.confetti{position:fixed;width:8px;height:8px;pointer-events:none;animation:confettiFall 2.5s linear forwards;}
@keyframes confettiFall{0%{transform:translateY(-20vh) rotate(0);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}
.empty-state{text-align:center;padding:30px 20px;color:#666;}
.empty-state .ic{font-size:3rem;margin-bottom:10px;}
.empty-state .ti{font-size:1rem;font-weight:700;color:#aaa;margin-bottom:6px;}
.empty-state .ds{font-size:0.82rem;}
/* MIC */
.mic-btn{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.25rem;transition:all 0.2s;flex-shrink:0;}
.mic-btn:active{transform:scale(0.9);}
.mic-btn.listening{animation:micPulse 1s ease infinite;background:rgba(239,68,68,0.25)!important;color:#ef4444!important;box-shadow:0 0 18px rgba(239,68,68,0.55);}
@keyframes micPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
.speech-feedback{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:0.85rem;font-weight:600;text-align:center;animation:fbIn 0.3s ease;display:none;}
@keyframes fbIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.speech-feedback.ok{background:rgba(52,211,153,0.18);color:#34d399;border:1.5px solid rgba(52,211,153,0.35);animation:fbIn 0.3s ease, correctPulse 0.6s ease;}
.speech-feedback.bad{background:rgba(239,68,68,0.15);color:#f87171;border:1.5px solid rgba(239,68,68,0.35);animation:fbIn 0.3s ease, wrongShake 0.4s ease;}
.speech-feedback.listening{background:rgba(239,68,68,0.12);color:#fca5a5;border:1.5px solid rgba(239,68,68,0.25);}
.speech-stats{display:flex;justify-content:center;gap:14px;margin-top:6px;font-size:0.72rem;color:#888;font-weight:600;}
.speech-stats .ok{color:#34d399;}
.speech-stats .bad{color:#f87171;}
.speech-feedback .heard{display:block;font-size:0.72rem;font-weight:500;color:#aaa;margin-top:4px;font-style:italic;}
.wm-sync{font-size:0.6rem;color:#444488;letter-spacing:0.05em;white-space:nowrap;padding:2px 7px;border-radius:99px;border:1px solid #222244;background:#0d0d1f;}
.wm-sync.ok{color:#34d399;border-color:rgba(52,211,153,0.3);}
.wm-sync.err{color:#f87171;border-color:rgba(248,113,113,0.3);}
.wm-sync.saving{color:#facc15;border-color:rgba(250,204,21,0.3);}
#wm-login-overlay{position:fixed;inset:0;background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:18px;}
#wm-login-overlay .wm-logo{font-size:2.5rem;}
#wm-login-overlay .wm-title{font-size:1.1rem;letter-spacing:3px;color:#34d399;font-family:'Courier New',monospace;}
#wm-login-overlay .wm-sub{font-size:.7rem;color:rgba(255,255,255,.3);letter-spacing:1px;}
#wm-login-btn{display:flex;align-items:center;gap:10px;background:#fff;color:#222;border:none;border-radius:8px;padding:12px 22px;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:8px;}
#wm-login-btn img{width:20px;height:20px;}
#wm-login-err{font-size:.7rem;color:#f87171;min-height:1.2rem;}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>
<div id="wm-login-overlay">
  <div class="wm-logo">🇬🇧</div>
  <div class="wm-title">WORDMASTER</div>
  <div class="wm-sub">KLADYXLAND · Přihlášení</div>
  <button id="wm-login-btn" onclick="wmGoogleLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
    Přihlásit přes Google
  </button>
  <div id="wm-login-err"></div>
</div>
<div class="topbar">
  <div class="logo">🇬🇧 WordMaster</div>
  <div class="prog-wrap">
    <div class="prog-meta"><span id="prog-text">0 / 0</span><span id="prog-pct">0%</span></div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div id="wm-sync" class="wm-sync">⏳ Sync...</div>
  <div class="tab-group">
    <button class="tab-btn active" id="tbtn-cards" onclick="setView('cards')">🃏 Karty</button>
    <button class="tab-btn" id="tbtn-ebook" onclick="setView('ebook')">📚 Seznam</button>
    <button class="tab-btn" id="tbtn-test" onclick="setView('test')">🎯 Test</button>
    <button class="tab-btn" id="tbtn-translate" onclick="setView('translate')">🌐 Přeložit</button>
  </div>
</div>
<div id="view-cards">
  <div class="cat-row" id="cat-row"></div>
  <div class="cards-wrap"><div class="card-outer" id="card-outer"><div class="card" id="the-card"></div></div></div>
  <div class="nav-row">
    <button class="nav-btn" onclick="go(-1)" title="Předchozí">◀</button>
    <span class="counter" id="nav-counter">1 / 1</span>
    <button class="nav-btn" onclick="go(1)" title="Další">▶</button>
  </div>
  <div style="display:flex;justify-content:center;padding:0 14px 14px;">
    <button class="shuffle-btn" id="shuffle-btn" onclick="toggleShuffle()">🔀 Náhodně</button>
    <button class="shuffle-btn on" id="hide-learned-btn" onclick="toggleHideLearned()">✓ Skrýt naučená</button>
  </div>
</div>
<div id="view-ebook" style="display:none;overflow-y:auto;height:calc(100vh - 60px);"><div class="ebook-wrap" id="ebook-inner"></div></div>
<div id="view-test" style="display:none;overflow-y:auto;height:calc(100vh - 60px);"><div class="test-wrap" id="test-inner"></div></div>
<div id="view-translate" style="display:none;overflow-y:auto;height:calc(100vh - 60px);padding:18px 14px;">
  <div style="background:linear-gradient(145deg,#15152a,#1a1a32);border:1px solid #252548;border-radius:18px;padding:20px 18px;margin-bottom:14px;">
    <div style="font-size:0.78rem;font-weight:800;color:#888;letter-spacing:1px;margin-bottom:10px;">ANGLICKY → ČESKY</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input id="tr-input" type="text" placeholder="Napiš anglické slovo..." style="flex:1;padding:12px 14px;border-radius:12px;border:1.5px solid #252548;background:#0d0d1f;color:#f0f0f8;font-family:inherit;font-size:1rem;font-weight:600;outline:none;transition:all 0.2s;" onfocus="this.style.borderColor='#34d399'" onblur="this.style.borderColor='#252548'" onkeydown="if(event.key==='Enter')trTranslate()"/>
      <button onclick="trTranslate()" style="padding:12px 18px;border-radius:12px;border:none;background:linear-gradient(135deg,#34d399,#60a5fa);color:#0d0d1f;font-family:inherit;font-size:0.95rem;font-weight:800;cursor:pointer;white-space:nowrap;transition:all 0.2s;">Přeložit</button>
    </div>
    <div id="tr-result" style="display:none;padding:16px;border-radius:12px;background:rgba(52,211,153,0.08);border:1.5px solid rgba(52,211,153,0.25);">
      <div style="font-size:0.65rem;color:#34d399;font-weight:800;letter-spacing:1px;margin-bottom:6px;">PŘEKLAD</div>
      <div id="tr-text" style="font-size:1.4rem;font-weight:800;color:#f0f0fa;"></div>
      <div id="tr-orig" style="font-size:0.78rem;color:#666688;margin-top:4px;"></div>
    </div>
    <div id="tr-error" style="display:none;padding:12px;border-radius:12px;background:rgba(248,113,113,0.1);border:1.5px solid rgba(248,113,113,0.3);color:#f87171;font-size:0.85rem;font-weight:600;"></div>
    <div id="tr-loading" style="display:none;text-align:center;padding:16px;color:#666688;font-size:0.85rem;">⏳ Překládám...</div>
  </div>
  <div style="background:linear-gradient(145deg,#15152a,#1a1a32);border:1px solid #252548;border-radius:18px;padding:16px 18px;">
    <div style="font-size:0.78rem;font-weight:800;color:#888;letter-spacing:1px;margin-bottom:10px;">ČESKY → ANGLICKY</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input id="tr-input2" type="text" placeholder="Napiš české slovo..." style="flex:1;padding:12px 14px;border-radius:12px;border:1.5px solid #252548;background:#0d0d1f;color:#f0f0f8;font-family:inherit;font-size:1rem;font-weight:600;outline:none;transition:all 0.2s;" onfocus="this.style.borderColor='#a78bfa'" onblur="this.style.borderColor='#252548'" onkeydown="if(event.key==='Enter')trTranslate2()"/>
      <button onclick="trTranslate2()" style="padding:12px 18px;border-radius:12px;border:none;background:linear-gradient(135deg,#a78bfa,#f472b6);color:#0d0d1f;font-family:inherit;font-size:0.95rem;font-weight:800;cursor:pointer;white-space:nowrap;transition:all 0.2s;">Přeložit</button>
    </div>
    <div id="tr-result2" style="display:none;padding:16px;border-radius:12px;background:rgba(167,139,250,0.08);border:1.5px solid rgba(167,139,250,0.25);">
      <div style="font-size:0.65rem;color:#a78bfa;font-weight:800;letter-spacing:1px;margin-bottom:6px;">PŘEKLAD</div>
      <div id="tr-text2" style="font-size:1.4rem;font-weight:800;color:#f0f0fa;"></div>
      <div id="tr-orig2" style="font-size:0.78rem;color:#666688;margin-top:4px;"></div>
    </div>
    <div id="tr-error2" style="display:none;padding:12px;border-radius:12px;background:rgba(248,113,113,0.1);border:1.5px solid rgba(248,113,113,0.3);color:#f87171;font-size:0.85rem;font-weight:600;"></div>
    <div id="tr-loading2" style="display:none;text-align:center;padding:16px;color:#666688;font-size:0.85rem;">⏳ Překládám...</div>
  </div>

function normalizeText(s){
  if(!s)return '';
  s=s.toLowerCase();
  // Build char sets via fromCharCode to avoid template literal escape issues
  var smartSingle=String.fromCharCode(0x2018,0x2019,0x201A,0x201B,0x2032,0x2035,0x0060,0x00B4);
  for(var i=0;i<smartSingle.length;i++){s=s.split(smartSingle[i]).join(String.fromCharCode(39));}
  var smartDouble=String.fromCharCode(0x201C,0x201D,0x201E,0x201F,0x2033,0x2036);
  for(var j=0;j<smartDouble.length;j++){s=s.split(smartDouble[j]).join(String.fromCharCode(34));}
  // Punctuation: . , ! ? ; : ' " ( ) - _ / \\
  var punctCodes=[46,44,33,63,59,58,39,34,40,41,45,95,47,92];
  for(var k=0;k<punctCodes.length;k++){s=s.split(String.fromCharCode(punctCodes[k])).join(' ');}
  return s.replace(/\s+/g,' ').trim();
}

function listen(en){
  if(!micSupported){
    showFb('bad','🚫 Mikrofon není podporován v tomto prohlížeči','');
    return;
  }
  if(listening){
    try{recognition&&recognition.stop();}catch(e){}
    return;
  }
  try{
    recognition=new SR();
    recognition.lang='en-US';
    recognition.interimResults=false;
    recognition.maxAlternatives=5;
    recognition.continuous=false;
    listening=true;
    renderCard();
    showFb('listening','🎤 Poslouchám... řekni: '+en,'');
    recognition.onresult=function(ev){
      var alts=[];
      try{
        for(var i=0;i<ev.results[0].length;i++){alts.push(ev.results[0][i].transcript);}
      }catch(e){}
      var heard=alts[0]||'';
      var target=normalizeText(en);
      var ok=false;
      for(var i=0;i<alts.length;i++){
        if(normalizeText(alts[i])===target){ok=true;break;}
      }
      if(!ok){
        // partial match: target words contained in heard
        var hn=normalizeText(heard);
        if(hn===target||(target.length>3&&hn.indexOf(target)>=0)){ok=true;}
      }
      speechStats[en]=speechStats[en]||{ok:0,fail:0};
      if(ok){
        speechStats[en].ok++;
        saveSpeechStats();
        showFb('ok','✅ Správně!','Slyšel jsem: "'+heard+'"');
        spawnConfetti();
      }else{
        speechStats[en].fail++;
        saveSpeechStats();
        showFb('bad','❌ Skoro... zkus znovu','Slyšel jsem: "'+heard+'"');
      }
    };
    recognition.onerror=function(ev){
      listening=false;renderCard();
      var msg='❌ Chyba mikrofonu';
      if(ev.error==='not-allowed')msg='🚫 Přístup k mikrofonu zamítnut';
      else if(ev.error==='no-speech')msg='🔇 Nic jsem neslyšel';
      else if(ev.error==='audio-capture')msg='🎤 Mikrofon nedostupný';
      else if(ev.error==='network')msg='📡 Chyba sítě';
      showFb('bad',msg,'');
    };
    recognition.onend=function(){listening=false;renderCard();};
    recognition.start();
  }catch(e){
    listening=false;renderCard();
    showFb('bad','❌ '+(e.message||'Chyba'),'');
  }
}

function showFb(type,msg,heard){
  var fb=document.getElementById('speech-feedback');
  if(!fb)return;
  fb.className='speech-feedback '+type;
  fb.innerHTML=msg+(heard?'<span class="heard">'+heard.replace(/</g,'&lt;')+'</span>':'');
  fb.style.display='block';
  if(type==='ok'||type==='bad'){
    setTimeout(function(){
      var f=document.getElementById('speech-feedback');
      if(f&&f.className.indexOf('listening')<0)f.style.display='none';
    },4000);
  }
}

function filtered(){
  var base=filterCat==='Vše'?VOCAB:VOCAB.filter(function(w){return w.cat===filterCat;});
  if(hideLearned){base=base.filter(function(w){return learned.indexOf(w.en)<0;});}
  if(shuffleMode&&shuffleOrder){
    var ordered=[];
    for(var i=0;i<shuffleOrder.length;i++){if(shuffleOrder[i]<base.length)ordered.push(base[shuffleOrder[i]]);}
    return ordered.length?ordered:base;
  }
  return base;
}

function buildShuffleOrder(){
  var len=(filterCat==='Vše'?VOCAB:VOCAB.filter(function(w){return w.cat===filterCat;})).length;
  var arr=[];for(var i=0;i<len;i++)arr.push(i);
  for(var j=arr.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=arr[j];arr[j]=arr[k];arr[k]=t;}
  shuffleOrder=arr;
}

var _vcLang=null;var _vcRec=null;var _vcLastTrans='';
function vcStart(lang){
  if(_vcRec){try{_vcRec.stop();}catch(e){}  _vcRec=null;}
  var SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    document.getElementById('vc-status').textContent='❌ Prohlížeč nepodporuje mikrofon. Použij Chrome.';
    return;
  }
  _vcLang=lang;
  var fromLang=lang==='cs'?'cs-CZ':'en-US';
  var btnId=lang==='cs'?'vc-btn-cs':'vc-btn-en';
  var otherBtn=lang==='cs'?'vc-btn-en':'vc-btn-cs';
  document.getElementById(btnId).style.animation='micPulse 1s ease infinite';
  document.getElementById(otherBtn).disabled=true;
  document.getElementById(otherBtn).style.opacity='0.4';
  document.getElementById('vc-status').textContent='🎙 Poslouchám... mluv!';
  document.getElementById('vc-result').style.display='none';
  _vcRec=new SpeechRecognition();
  _vcRec.lang=fromLang;
  _vcRec.interimResults=false;
  _vcRec.maxAlternatives=1;
  _vcRec.onresult=function(e){
    var text=e.results[0][0].transcript;
    vcDoTranslate(text,lang);
  };
  _vcRec.onerror=function(e){
    vcReset();
    document.getElementById('vc-status').textContent='❌ Chyba mikrofonu: '+e.error;
  };
  _vcRec.onend=function(){vcReset();};
  _vcRec.start();
}
function vcReset(){
  document.getElementById('vc-btn-cs').style.animation='';
  document.getElementById('vc-btn-en').style.animation='';
  document.getElementById('vc-btn-cs').disabled=false;
  document.getElementById('vc-btn-en').disabled=false;
  document.getElementById('vc-btn-cs').style.opacity='1';
  document.getElementById('vc-btn-en').style.opacity='1';
  if(document.getElementById('vc-status').textContent==='🎙 Poslouchám... mluv!')
    document.getElementById('vc-status').textContent='Stiskni tlačítko a mluv...';
}
function vcDoTranslate(text,lang){
  var fromLang=lang==='cs'?'cs':'en';
  var toLang=lang==='cs'?'en':'cs';
  document.getElementById('vc-status').textContent='⏳ Překládám...';
  document.getElementById('vc-flag-orig').textContent=lang==='cs'?'🇨🇿':'🇬🇧';
  document.getElementById('vc-flag-trans').textContent=lang==='cs'?'🇬🇧':'🇨🇿';
  document.getElementById('vc-orig-text').textContent=text;
  fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+fromLang+'|'+toLang)
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.responseStatus===200){
        var trans=d.responseData.translatedText;
        _vcLastTrans=trans;
        document.getElementById('vc-trans-text').textContent=trans;
        document.getElementById('vc-result').style.display='block';
        document.getElementById('vc-status').textContent='✅ Hotovo — 🔊 tlačítko přehraje';
        vcSpeakText(trans,toLang);
      } else {
        document.getElementById('vc-status').textContent='❌ Chyba překladu.';
      }
    })
    .catch(function(){
      document.getElementById('vc-status').textContent='❌ Chyba připojení.';
    });
}
var _cachedVoices=[];
function _loadVoices(){
  var v=window.speechSynthesis.getVoices();
  if(v&&v.length)_cachedVoices=v;
}
if(window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged=function(){_loadVoices();};
  _loadVoices();
}
function _getMaleVoice(lang){
  var voices=_cachedVoices.length?_cachedVoices:window.speechSynthesis.getVoices();
  var langCode=lang==='en'?'en':'cs';
  var male=voices.filter(function(v){return v.lang.indexOf(langCode)===0&&/male|man|david|mark|daniel|george|james|matthew|thomas|richard/i.test(v.name);});
  if(male.length)return male[0];
  var any=voices.filter(function(v){return v.lang.indexOf(langCode)===0;});
  return any.length?any[0]:null;
}
function vcSpeakText(text,lang){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang=lang==='en'?'en-GB':'cs-CZ';
  u.rate=0.85;u.pitch=0.85;
  var v=_getMaleVoice(lang);if(v)u.voice=v;
  window.speechSynthesis.speak(u);
}
function vcSpeak(){
  if(_vcLastTrans&&_vcLang){
    var toLang=_vcLang==='cs'?'en':'cs';
    vcSpeakText(_vcLastTrans,toLang);
  }
}

function speak(txt){
  if(!window.speechSynthesis)return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(txt);
    u.lang='en-US';u.rate=0.85;u.pitch=0.85;
    var v=_getMaleVoice('en');if(v)u.voice=v;
    u.onstart=function(){speaking=true;renderCard();};
    u.onend=u.onerror=function(){speaking=false;renderCard();};
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function toggleLearned(){
  var k=card().en;
  var wasLearned=learned.indexOf(k)>=0;
  if(wasLearned){
    learned=learned.filter(function(x){return x!==k;});
    save();renderCard();updateProg();
  } else {
    learned.push(k);spawnConfetti();save();updateProg();
    var outer=document.getElementById('card-outer');
    outer.className='card-outer hide';
    setTimeout(function(){
      renderCard();
      outer.className='card-outer';
    },180);
  }
}

function spawnConfetti(){
  var colors=['#34d399','#60a5fa','#a78bfa','#facc15','#fb923c','#f472b6'];
  for(var i=0;i<26;i++){
    var c=document.createElement('div');
    c.className='confetti';
    c.style.left=(Math.random()*100)+'%';
    c.style.top='-2vh';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay=(Math.random()*0.3)+'s';
    c.style.animationDuration=(2+Math.random()*1.2)+'s';
    if(Math.random()>0.5)c.style.borderRadius='50%';
    document.body.appendChild(c);
    setTimeout((function(el){return function(){if(el.parentNode)el.parentNode.removeChild(el);};})(c),3500);
  }
}

function go(dir){
  var f=filtered();
  if(!f.length)return;
  if(listening){try{recognition&&recognition.stop();}catch(e){}listening=false;}
  var outer=document.getElementById('card-outer');
  outer.className='card-outer '+(dir>0?'hide':'hide-r');
  setTimeout(function(){
    idx=(idx+dir+f.length)%f.length;
    renderCard();
    outer.className='card-outer';
  },180);
}

function buildCats(){
  var row=document.getElementById('cat-row');
  row.innerHTML='';
  var cats=['Vše'].concat(Object.keys(CATS));
  cats.forEach(function(c){
    var b=document.createElement('button');
    b.className='chip'+(c===filterCat?' active':'');
    b.textContent=c;
    if(c!=='Vše'&&CATS[c]){b.style.background=c===filterCat?CATS[c]:'transparent';}
    else if(c==='Vše'&&filterCat==='Vše'){b.style.background='#34d399';b.style.color='#0d0d1f';}
    b.onclick=function(){
      filterCat=c;idx=0;
      if(shuffleMode)buildShuffleOrder();
      buildCats();renderCard();
    };
    row.appendChild(b);
  });
}

function renderCard(){
  var w=card();if(!w){
    document.getElementById('the-card').innerHTML='<div class="empty-state"><div class="ic">🔍</div><div class="ti">Žádná slovíčka</div><div class="ds">V této kategorii nic není</div></div>';
    document.getElementById('nav-counter').textContent='0 / 0';
    return;
  }
  var color=CATS[w.cat]||'#34d399';
  var isL=learned.indexOf(w.en)>=0;
  var f=filtered();
  document.getElementById('nav-counter').textContent=(Math.min(idx,f.length-1)+1)+' / '+f.length;
  var enEsc=w.en.replace(/'/g,"\\'").replace(/"/g,'&quot;');
  var c=document.getElementById('the-card');
  var st=speechStats[w.en]||{ok:0,fail:0};
  var statsHtml=micSupported?'<div class="speech-stats"><span class="ok">🎤✓ '+st.ok+'</span><span class="bad">🎤✗ '+st.fail+'</span></div>':'';
  var micBtn=micSupported?'<button class="mic-btn'+(listening?' listening':'')+'" style="background:'+color+'22;color:'+color+'" onclick="listen(\\''+enEsc+'\\')" title="Vyslovit a vyhodnotit">🎤</button>':'';
  c.innerHTML='<div class="card-top-bar" style="background:'+color+'"></div>'+
    '<div class="card-glow" style="background:'+color+'"></div>'+
    '<div class="cat-badge" style="background:'+color+'22;color:'+color+'">'+w.cat+'</div>'+
    '<div class="en-word">'+w.en+'</div>'+
    '<div class="cs-word">'+w.cs+'</div>'+
    '<div class="card-actions">'+
    '<button class="speak-btn'+(speaking?' pulse':'')+'" style="background:'+color+'22;color:'+color+'" onclick="speak(\\''+enEsc+'\\')" title="Přehrát">🔊</button>'+
    micBtn+
    '<button class="learned-btn '+(isL?'yes':'no')+'" onclick="toggleLearned()">'+(isL?'✓ Naučeno':'+ Označit naučené')+'</button>'+
    '</div>'+
    statsHtml+
    '<div class="speech-feedback" id="speech-feedback"></div>';
  updateProg();
}

function updateProg(){
  var pct=VOCAB.length?Math.round(learned.length/VOCAB.length*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-text').textContent=learned.length+' / '+VOCAB.length;
  document.getElementById('prog-pct').textContent=pct+'%';
}

function renderEbook(){
  var inner=document.getElementById('ebook-inner');
  var search=(document.getElementById('eb-search')?document.getElementById('eb-search').value.toLowerCase():'');
  inner.innerHTML='<div class="ebook-head"><div class="ebook-title">📚 Všechna slovíčka & fráze</div><div class="ebook-sub">'+VOCAB.length+' výrazů · naučeno '+learned.length+'</div><input class="search-box" id="eb-search" placeholder="🔍 Hledat..." oninput="renderEbook()" value="'+search.replace(/"/g,'&quot;')+'" /></div>';
  Object.keys(CATS).forEach(function(cat){
    var words=VOCAB.filter(function(w){
      if(w.cat!==cat)return false;
      if(search&&w.en.toLowerCase().indexOf(search)<0&&w.cs.toLowerCase().indexOf(search)<0)return false;
      if(learned.indexOf(w.en)>=0)return false;
      return true;
    });
    if(!words.length)return;
    var color=CATS[cat];
    var sec=document.createElement('div');
    sec.innerHTML='<div class="sec-header" style="color:'+color+'"><div class="sec-dot" style="background:'+color+'"></div>'+cat+' <span class="sec-count">('+words.length+')</span></div>';
    words.forEach(function(w){
      var isL=learned.indexOf(w.en)>=0;
      var enEsc=w.en.replace(/'/g,"\\'");
      var row=document.createElement('div');
      row.className='eb-row'+(isL?' learned':'');
      row.innerHTML='<button class="eb-speak" style="background:'+color+'20;color:'+color+'" onclick="speak(\\''+enEsc+'\\')">🔊</button>'+
        '<div style="flex:1;min-width:0"><div class="eb-en">'+w.en+'</div><div class="eb-cs">'+w.cs+'</div></div>'+
        (isL?'<span class="eb-check">✓</span>':'');
      sec.appendChild(row);
    });
    inner.appendChild(sec);
  });
  // restore search focus
  var sb=document.getElementById('eb-search');
  if(sb&&search){sb.focus();sb.setSelectionRange(search.length,search.length);}
}

// ── TEST / KVÍZ ──
function renderTest(){
  var inner=document.getElementById('test-inner');
  if(!testState.running){
    var canTestLearned=learned.length>=4;
    var allCount=VOCAB.length;
    inner.innerHTML='<div class="test-intro">'+
      '<div class="test-icon">🎯</div>'+
      '<div class="test-title">Vyzkoušej se!</div>'+
      '<div class="test-desc">Otestuj, kolik slovíček znáš.<br>Zobrazí se české slovo a vybíráš ze 4 anglických možností.</div>'+
      '<div class="test-options">'+
        '<div class="test-opt-row"><label>Z čeho zkoušet?</label>'+
          '<select id="test-scope">'+
            '<option value="all">Všechna slovíčka ('+allCount+')</option>'+
            '<option value="learned"'+(canTestLearned?'':' disabled')+'>Pouze naučená ('+learned.length+')</option>'+
            '<option value="notlearned">Pouze nenaučená ('+(allCount-learned.length)+')</option>'+
          '</select>'+
        '</div>'+
        '<div class="test-opt-row"><label>Kolik otázek?</label>'+
          '<select id="test-count">'+
            '<option value="10">10 otázek</option>'+
            '<option value="20">20 otázek</option>'+
            '<option value="50">50 otázek</option>'+
          '</select>'+
        '</div>'+
        '<div class="test-opt-row"><label>Kategorie?</label>'+
          '<select id="test-cat">'+
            '<option value="Vše">Všechny kategorie</option>'+
            Object.keys(CATS).map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('')+
          '</select>'+
        '</div>'+
      '</div>'+
      '<button class="start-btn" onclick="startTest()">▶ Spustit test</button>'+
    '</div>';
    return;
  }
  // Test běží
  if(testState.current>=testState.questions.length){
    renderTestResult();return;
  }
  var q=testState.questions[testState.current];
  var pct=Math.round((testState.current/testState.questions.length)*100);
  var html='<div class="q-card">'+
    '<div class="q-meta"><span class="q-num">OTÁZKA '+(testState.current+1)+' / '+testState.questions.length+'</span>'+
    '<span class="q-score">Skóre: '+testState.score+'</span></div>'+
    '<div class="q-prog"><div class="q-prog-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="q-prompt">Co znamená anglicky:</div>'+
    '<div class="q-word">'+q.word.cs+'</div>'+
    '<div class="q-answers">';
  for(var i=0;i<q.options.length;i++){
    html+='<button class="q-ans" id="qa-'+i+'" onclick="answerTest('+i+')">'+q.options[i]+'</button>';
  }
  html+='</div></div>';
  if(testState.answered){
    html+='<button class="next-btn" onclick="nextTest()">'+(testState.current+1>=testState.questions.length?'✓ Vyhodnotit':'Další otázka ▶')+'</button>';
  }
  inner.innerHTML=html;
}

function startTest(){
  var scope=document.getElementById('test-scope').value;
  var count=parseInt(document.getElementById('test-count').value)||10;
  var cat=document.getElementById('test-cat').value;
  var pool=VOCAB.slice();
  if(cat!=='Vše')pool=pool.filter(function(w){return w.cat===cat;});
  if(scope==='learned')pool=pool.filter(function(w){return learned.indexOf(w.en)>=0;});
  else if(scope==='notlearned')pool=pool.filter(function(w){return learned.indexOf(w.en)<0;});
  if(pool.length<4){
    alert('Pro test je potřeba alespoň 4 slovíčka v zvolené sadě. Vyber víc kategorií nebo jiný rozsah.');
    return;
  }
  count=Math.min(count,pool.length);
  // Vyber otázky
  var qs=[];var used={};
  while(qs.length<count){
    var idx=Math.floor(Math.random()*pool.length);
    if(used[idx])continue;
    used[idx]=true;
    var w=pool[idx];
    // 3 falešné odpovědi z VOCAB (jiné než w)
    var distractors=[];var dused={};dused[w.en]=true;
    var allPool=VOCAB.slice();
    while(distractors.length<3){
      var di=Math.floor(Math.random()*allPool.length);
      var dw=allPool[di];
      if(dused[dw.en])continue;
      dused[dw.en]=true;
      distractors.push(dw.en);
    }
    var options=[w.en].concat(distractors);
    // shuffle
    for(var j=options.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=options[j];options[j]=options[k];options[k]=t;}
    qs.push({word:w,options:options,correct:w.en});
  }
  testState={running:true,questions:qs,current:0,score:0,wrong:0,answered:false,scope:scope,count:count};
  renderTest();
}

function answerTest(i){
  if(testState.answered)return;
  testState.answered=true;
  var q=testState.questions[testState.current];
  var sel=q.options[i];
  var btns=document.querySelectorAll('.q-ans');
  for(var b=0;b<btns.length;b++){btns[b].classList.add('disabled');}
  if(sel===q.correct){
    btns[i].classList.add('correct');
    testState.score++;
    try{var u=new SpeechSynthesisUtterance(q.correct);u.lang='en-US';u.rate=0.85;u.pitch=0.85;window.speechSynthesis.speak(u);}catch(e){}
  }else{
    btns[i].classList.add('wrong');
    testState.wrong++;
    // zvýraznit správnou
    for(var c=0;c<q.options.length;c++){
      if(q.options[c]===q.correct){btns[c].classList.add('correct');break;}
    }
  }
  renderTest();
}

function nextTest(){
  testState.current++;
  testState.answered=false;
  renderTest();
}

function renderTestResult(){
  var total=testState.questions.length;
  var sc=testState.score;
  var pct=Math.round(sc/total*100);
  var emoji='👍',msg='Dobrý výkon!';
  if(pct===100){emoji='🏆';msg='Dokonalé! Plný počet bodů!';spawnConfetti();spawnConfetti();}
  else if(pct>=80){emoji='🎉';msg='Skvělé! Skoro všechno správně.';spawnConfetti();}
  else if(pct>=60){emoji='💪';msg='Dobré, ale pořád je co zlepšovat.';}
  else if(pct>=40){emoji='📚';msg='Tohle chce ještě potrénovat.';}
  else{emoji='🎯';msg='Nevzdávej to, jen víc karet!';}
  var inner=document.getElementById('test-inner');
  inner.innerHTML='<div class="test-intro result-card">'+
    '<div class="result-emoji">'+emoji+'</div>'+
    '<div class="result-score">'+sc+' / '+total+'</div>'+
    '<div class="result-pct">'+pct+'% správně</div>'+
    '<div class="result-msg">'+msg+'</div>'+
    '<button class="start-btn" onclick="resetTest()">🔁 Zkusit znovu</button>'+
  '</div>';
}

function resetTest(){
  testState={running:false,questions:[],current:0,score:0,wrong:0,answered:false,scope:'all',count:10};
  renderTest();
}

// ── KEYBOARD & SWIPE ──
document.addEventListener('keydown',function(e){
  if(view!=='cards')return;
  if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='ArrowRight')go(1);
  else if(e.key===' '){e.preventDefault();var w=card();if(w)speak(w.en);}
  else if(e.key==='Enter')toggleLearned();
});

// touch swipe pro mobil
var touchX=0,touchY=0;
document.addEventListener('touchstart',function(e){
  if(view!=='cards')return;
  touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',function(e){
  if(view!=='cards')return;
  var dx=e.changedTouches[0].clientX-touchX;
  var dy=e.changedTouches[0].clientY-touchY;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){
    if(dx<0)go(1);else go(-1);
  }
},{passive:true});

buildCats();renderCard();updateProg();
</script>
