<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KladyxAmp v1.23Kl</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: #000;
    font-family: 'Times New Roman', Times, serif;
    color: #fff;
    user-select: none;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    background: radial-gradient(ellipse at top, #1a0a3a 0%, #050010 60%, #000 100%);
    position: relative;
    padding: 16px 0;
  }

  /* Animované pozadí - hvězdy */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 4px #fff;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.2; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* Hlavní container */
  .app {
    width: 100%;
    max-width: 480px;
    background: linear-gradient(180deg, rgba(30,15,60,0.95), rgba(10,5,30,0.95));
    border: 4px solid;
    border-image: linear-gradient(135deg, #ff00ff, #00ffff, #ffff00, #ff00ff) 1;
    animation: borderPulse 4s linear infinite;
    border-radius: 20px;
    padding: 24px;
    position: relative;
    z-index: 1;
    box-shadow:
      0 0 40px rgba(255,0,255,0.3),
      0 0 80px rgba(0,255,255,0.2),
      inset 0 0 30px rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
  }

  /* Logo s duhovým gradientem */
  .logo {
    text-align: center;
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #ff00ff, #ff8800, #ffff00, #00ff00, #00ffff, #4488ff, #ff00ff);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: rainbow 4s linear infinite;
    margin-bottom: 4px;
    text-shadow: 0 0 30px rgba(255,255,255,0.3);
  }
  @keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes borderPulse {
    0% { border-image-source: linear-gradient(0deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
    25% { border-image-source: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
    50% { border-image-source: linear-gradient(180deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
    75% { border-image-source: linear-gradient(270deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
    100% { border-image-source: linear-gradient(360deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
  }
  .version {
    text-align: center;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    margin-bottom: 18px;
  }

  /* Hodiny + status */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.75rem;
  }
  .clock {
    color: #00ff88;
    font-family: 'Consolas', monospace;
    text-shadow: 0 0 8px rgba(0,255,136,0.5);
    letter-spacing: 1px;
  }
  .status {
    color: rgba(255,255,255,0.6);
    font-family: 'Consolas', monospace;
  }
  .status.playing { color: #ff00ff; }

  /* Album art */
  .album-wrap {
    width: 100%;
    aspect-ratio: 1;
    max-width: 280px;
    margin: 0 auto 16px;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: linear-gradient(135deg, #1a0a3a, #3a0a6a);
  }
  .album-art {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.4s;
  }
  .album-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(255,0,255,0.25), transparent 60%),
      linear-gradient(135deg, #1a0a3a, #3a0a6a);
    animation: placeholderPulse 2.4s ease-in-out infinite;
  }
  @keyframes placeholderPulse {
    0%, 100% {
      text-shadow: 0 0 20px rgba(255,0,255,0.4), 0 0 40px rgba(0,255,255,0.2);
      transform: scale(1);
      filter: brightness(1);
    }
    50% {
      text-shadow: 0 0 35px rgba(255,0,255,0.8), 0 0 60px rgba(0,255,255,0.5);
      transform: scale(1.06);
      filter: brightness(1.2);
    }
  }
  .album-glow {
    position: absolute;
    inset: -2px;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff00ff, #00ffff);
    z-index: -1;
    filter: blur(8px);
    opacity: 0.6;
    animation: placeholderPulse 2.4s ease-in-out infinite;
  }

  /* Track info */
  .track-info {
    text-align: center;
    margin-bottom: 12px;
    min-height: 50px;
  }
  .track-title {
    font-size: 1.05rem;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-artist {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
  }

  /* Spectrum analyzer canvas */
  .spectrum-wrap {
    height: 60px;
    margin-bottom: 12px;
    background: rgba(0,0,0,0.4);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Progress bar */
  .progress-wrap {
    margin-bottom: 16px;
  }
  .progress-bar {
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff00ff, #ffff00, #00ffff);
    transition: width 0.1s linear;
    border-radius: 3px;
  }
  .progress-times {
    display: flex;
    justify-content: space-between;
    font-size: 0.65rem;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
    font-family: 'Consolas', monospace;
  }

  /* Tlačítka */
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    backdrop-filter: blur(5px);
  }
  .btn:hover {
    background: rgba(255,255,255,0.15);
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255,0,255,0.5);
  }
  .btn:active {
    transform: scale(0.95);
  }
  .btn.active {
    background: linear-gradient(135deg, rgba(255,0,255,0.3), rgba(0,255,255,0.3));
    border-color: #ff00ff;
    color: #fff;
    box-shadow: 0 0 12px rgba(255,0,255,0.5);
  }
  .btn-play {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #ff00ff, #00ffff);
    border: none;
    font-size: 1.5rem;
    box-shadow: 0 0 20px rgba(255,0,255,0.6);
  }
  .btn-play:hover {
    background: linear-gradient(135deg, #ff44ff, #44ffff);
    box-shadow: 0 0 30px rgba(255,0,255,0.8);
  }

  /* Playlist sekce */
  .playlist-wrap {
    margin-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 12px;
  }
  .playlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
  }
  .playlist-count {
    color: #00ffff;
    font-family: 'Consolas', monospace;
  }
  .upload-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .upload-row label {
    background: linear-gradient(135deg, #ff00ff, #00ffff);
    color: #000;
    font-size: 0.72rem;
    font-weight: bold;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: 1px;
  }
  .upload-row label:active {
    opacity: 0.8;
  }
  .upload-row input[type="file"] {
    display: none;
  }
  .upload-status {
    font-size: 0.68rem;
    color: rgba(255,255,255,0.6);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Podkres sekce */
  .podkres-wrap {
    margin-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 10px;
  }
  .podkres-toggle {
    width: 100%;
    background: rgba(255,0,255,0.08);
    border: 1px solid rgba(255,0,255,0.3);
    color: #ff66ff;
    font-size: 0.78rem;
    font-weight: bold;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .podkres-toggle:active { opacity: 0.8; }
  .podkres-list {
    margin-top: 8px;
    max-height: 160px;
    overflow-y: auto;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    padding: 4px;
    display: none;
  }
  .podkres-list.open { display: block; }
  .podkres-list::-webkit-scrollbar { width: 6px; }
  .podkres-list::-webkit-scrollbar-thumb { background: rgba(255,0,255,0.3); border-radius: 3px; }
  .pk-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    font-size: 0.78rem;
    color: #e0e8ff;
  }
  .pk-item:hover { background: rgba(255,255,255,0.08); }
  .pk-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #444;
    flex-shrink: 0;
  }
  .pk-item.active .pk-dot {
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
  }
  .pk-item.active {
    background: rgba(0,255,136,0.08);
  }
  .pk-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pk-empty {
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 0.72rem;
    padding: 12px;
  }
  /* Akce na podkresu (Play / Smazat) */
  .pk-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .pk-btn {
    width: 26px;
    height: 26px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    transition: background 0.15s, transform 0.1s;
    padding: 0;
    color: rgba(255,255,255,0.7);
  }
  .pk-btn:active { transform: scale(0.92); }
  .pk-btn.play { color: #4ade80; }
  .pk-btn.play:hover { background: rgba(74,222,128,0.18); }
  .pk-btn.del { color: #f87171; }
  .pk-btn.del:hover { background: rgba(248,113,113,0.18); }
  /* Upload tlačítko pro podkres */
  .pk-upload-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 6px 0 8px;
  }
  .pk-upload-row label {
    cursor: pointer;
    background: linear-gradient(135deg, #ff00ff 0%, #00ffff 100%);
    color: #000;
    padding: 7px 18px;
    border-radius: 99px;
    font-weight: 700;
    font-size: 0.72rem;
    user-select: none;
    transition: transform 0.1s;
  }
  .pk-upload-row label:active { transform: scale(0.96); }
  .pk-upload-row input { display: none; }
  .pk-upload-status {
    text-align: center;
    font-size: 0.65rem;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
    min-height: 14px;
  }
  .playlist {
    max-height: 180px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    padding: 4px;
  }
  .playlist::-webkit-scrollbar { width: 6px; }
  .playlist::-webkit-scrollbar-track { background: transparent; }
  .playlist::-webkit-scrollbar-thumb { background: rgba(255,0,255,0.3); border-radius: 3px; }
  .pl-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    font-size: 0.8rem;
  }
  .pl-item:hover {
    background: rgba(255,255,255,0.08);
  }
  .pl-item.active {
    background: linear-gradient(90deg, rgba(255,0,255,0.2), rgba(0,255,255,0.15));
    color: #fff;
  }
  .pl-item.active .pl-num { color: #ff00ff; }
  .pl-num {
    width: 22px;
    color: rgba(255,255,255,0.4);
    font-family: 'Consolas', monospace;
    font-size: 0.7rem;
    flex-shrink: 0;
  }
  .pl-title {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pl-empty {
    text-align: center;
    color: rgba(255,255,255,0.4);
    padding: 20px;
    font-size: 0.8rem;
  }
  /* === Akce na songu (Play / Smazat) === */
  .pl-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .pl-btn {
    width: 26px;
    height: 26px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    transition: background 0.15s, transform 0.1s;
    padding: 0;
    color: rgba(255,255,255,0.7);
  }
  .pl-btn:active { transform: scale(0.92); }
  .pl-btn.play { color: #4ade80; }
  .pl-btn.play:hover { background: rgba(74,222,128,0.18); }
  .pl-btn.del { color: #f87171; }
  .pl-btn.del:hover { background: rgba(248,113,113,0.18); }

  /* Loading */
  .loading {
    text-align: center;
    color: rgba(255,255,255,0.6);
    padding: 30px;
    font-size: 0.9rem;
  }
  .loading::after {
    content: '...';
    animation: dots 1.5s steps(4) infinite;
  }
  @keyframes dots {
    0% { content: '.'; }
    33% { content: '..'; }
    66% { content: '...'; }
  }

  /* Volume - jen aktivní stav */
  .vol-indicator {
    position: absolute;
    bottom: 12px;
    right: 16px;
    font-size: 0.65rem;
    color: rgba(255,255,255,0.4);
    font-family: 'Consolas', monospace;
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="app">
  <div class="logo">KLADYXAMP</div>
  <div class="version">v 1.23 Kl</div>

  <div class="topbar">
    <div class="clock" id="clock">--:--:--</div>
    <div class="status" id="status">▼ Načítám...</div>
  </div>

  <div class="album-wrap">
    <div class="album-glow"></div>
    <div class="album-placeholder" id="albumPlaceholder">🔊</div>
    <img class="album-art" id="albumArt" style="display:none;" alt=""/>
  </div>

  <div class="track-info">
    <div class="track-title" id="trackTitle">Vyber song z playlistu</div>
    <div class="track-artist" id="trackArtist">—</div>
  </div>

  <div class="spectrum-wrap">
    <canvas id="spectrum"></canvas>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-times">
      <span id="curTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="btnShuffle" title="Náhodně">🔀</button>
    <button class="btn" id="btnPrev" title="Předchozí">⏮</button>
    <button class="btn btn-play" id="btnPlay" title="Hraj/Pauza">▶</button>
    <button class="btn" id="btnNext" title="Další">⏭</button>
    <button class="btn" id="btnRepeat" title="Opakovat">🔁</button>
  </div>

  <div class="playlist-wrap">
    <div class="playlist-header">
      <span>PLAYLIST</span>
      <span class="playlist-count" id="playlistCount">0 songů</span>
    </div>
    <div class="upload-row">
      <label for="uploadInput">📤 Nahrát song</label>
      <input type="file" id="uploadInput" accept="audio/*">
      <span class="upload-status" id="uploadStatus"></span>
    </div>
    <div class="playlist" id="playlist">
      <div class="loading">Načítám písně z Firebase</div>
    </div>

    <div class="podkres-wrap">
      <button class="podkres-toggle" id="podkresToggle" type="button">
        <span>🎼 PODKRES PANELU</span>
        <span id="podkresArrow">▼</span>
      </button>
      <div class="podkres-list" id="podkresList">
        <div class="pk-upload-row">
          <label for="pkUploadInput">📤 Nahrát podkres</label>
          <input type="file" id="pkUploadInput" accept="audio/*">
        </div>
        <div class="pk-upload-status" id="pkUploadStatus"></div>
        <div id="podkresItems">
          <div class="pk-empty">Načítám...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<audio id="audio"></audio>
<audio id="pkPreview" style="display:none"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getStorage, ref as sref, listAll, getDownloadURL, getMetadata, uploadBytes, deleteObject }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
import { getDatabase, ref as dref, set as dset, get as dget }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// === Firebase config (stejný jako Panel) ===
const firebaseConfig = {
  apiKey: "AIzaSyDqLqLwYOPfRA0bLqOOyOA2g79NWQQwm60",
  authDomain: "kladyxland.firebaseapp.com",
  databaseURL: "https://kladyxland-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kladyxland",
  storageBucket: "kladyxland.firebasestorage.app",
  messagingSenderId: "888367307538",
  appId: "1:888367307538:web:abc"
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);
const db = getDatabase(app);

// === Globální stav ===
let tracks = [];        // { name, url, title, artist, art }
let currentIdx = -1;
let isPlaying = false;
let shuffleOn = false;
let repeatOn = false;
let audioCtx = null;
let analyser = null;
let dataArray = null;
let sourceNode = null;
let canvasRect = null;
let _justUploadedName = null; // jméno souboru nahraného přes upload - po loadTracks se nastaví jako aktuální
let _activePodkres = null; // jméno aktivně vybraného podkresu

const audio = document.getElementById('audio');
const canvas = document.getElementById('spectrum');
const ctx = canvas.getContext('2d');

// === Hvězdy v pozadí ===
function makeStars() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.animationDuration = (2 + Math.random() * 3) + 's';
    c.appendChild(s);
  }
}
makeStars();

// === Hodiny ===
function updateClock() {
  const d = new Date();
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  const s = String(d.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;
}
setInterval(updateClock, 1000);
updateClock();

// === Načti písně z Firebase Storage /kladyxamp/ ===
async function loadTracks() {
  try {
    const listRef = sref(storage, 'kladyxamp');
    const result = await listAll(listRef);
    const audioItems = result.items.filter(it =>
      /\.(mp3|wav|ogg|m4a|mp4|flac|aac|opus|weba|webm)$/i.test(it.name)
    );

    if (audioItems.length === 0) {
      document.getElementById('playlist').innerHTML =
        '<div class="pl-empty">📁 Nahraj MP3 do Firebase Storage<br/>do složky <b>kladyxamp/</b></div>';
      document.getElementById('status').textContent = '○ Prázdno';
      return;
    }

    document.getElementById('status').textContent = `▼ Načítám ${audioItems.length} songů`;

    // Načti URL pro všechny + zkus najít obrázky (stejný název .jpg/.png)
    const imgItems = result.items.filter(it =>
      /\.(jpg|jpeg|png|webp)$/i.test(it.name)
    );
    const imgMap = {};
    for (const img of imgItems) {
      const base = img.name.replace(/\.[^.]+$/, '');
      try {
        imgMap[base] = await getDownloadURL(img);
      } catch (e) {}
    }

    for (const item of audioItems) {
      try {
        const url = await getDownloadURL(item);
        const base = item.name.replace(/\.[^.]+$/, '');
        // Parse "Interpret - Název.mp3" formátu
        let title = base, artist = '—';
        const m = base.match(/^(.+?)\s*-\s*(.+)$/);
        if (m) { artist = m[1].trim(); title = m[2].trim(); }
        tracks.push({
          name: item.name, url, title, artist,
          art: imgMap[base] || null
        });
      } catch (e) {
        console.warn('Skip:', item.name, e);
      }
    }

    renderPlaylist();
    document.getElementById('status').textContent = `● Připraveno`;
    document.getElementById('playlistCount').textContent = `${tracks.length} songů`;

    // Pokud byl právě nahrán nový song, nastav ho jako vybraný (auto-select, ne autoplay)
    if (_justUploadedName) {
      const idx = tracks.findIndex(t => t.name === _justUploadedName);
      if (idx !== -1) {
        currentIdx = idx;
        const t = tracks[idx];
        audio.pause();
        audio.src = t.url;
        isPlaying = false;
        updateUI();
        document.getElementById('trackTitle').textContent = t.title;
        document.getElementById('trackArtist').textContent = t.artist;
        renderPlaylist();
      }
      _justUploadedName = null;
    }
  } catch (e) {
    console.error('Load error:', e);
    document.getElementById('playlist').innerHTML =
      `<div class="pl-empty">❌ Chyba načítání<br/>${e.code || e.message}</div>`;
    document.getElementById('status').textContent = '✕ Chyba';
  }
}

function renderPlaylist() {
  const pl = document.getElementById('playlist');
  pl.innerHTML = '';
  tracks.forEach((t, i) => {
    const item = document.createElement('div');
    item.className = 'pl-item' + (i === currentIdx ? ' active' : '');

    const num = document.createElement('span');
    num.className = 'pl-num';
    num.textContent = String(i+1).padStart(2,'0');

    const title = document.createElement('span');
    title.className = 'pl-title';
    title.textContent = (t.artist === '—' ? t.title : t.artist + ' — ' + t.title);

    // === Akční tlačítka ===
    const actions = document.createElement('div');
    actions.className = 'pl-actions';

    const playBtn = document.createElement('button');
    playBtn.type = 'button';
    playBtn.className = 'pl-btn play';
    playBtn.title = 'Přehrát';
    playBtn.textContent = '▶';

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'pl-btn del';
    delBtn.title = 'Smazat ze Storage';
    delBtn.textContent = '🗑';

    actions.appendChild(playBtn);
    actions.appendChild(delBtn);

    item.appendChild(num);
    item.appendChild(title);
    item.appendChild(actions);

    // Klik na celý řádek (mimo tlačítka) = spustí song (původní chování)
    item.onclick = (ev) => {
      // Pokud uživatel klikl na tlačítko, ignoruj kliknutí na řádek
      if (ev.target.closest('.pl-btn')) return;
      playTrack(i);
    };

    // Play tlačítko = spustí song
    playBtn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      playTrack(i);
    });

    // Smaž tlačítko = potvrzení + delete
    delBtn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const confirmMsg = 'Opravdu smazat "' + t.name + '" ze Storage?\n\nPo smazání zmizí ze SongUp i z KladyxAmp.';
      if (!confirm(confirmMsg)) return;
      try {
        delBtn.disabled = true;
        delBtn.textContent = '⏳';
        // Reference do Storage (kladyxamp/název)
        const fileRef = sref(storage, 'kladyxamp/' + t.name);
        await deleteObject(fileRef);
        // Pokud byl smazaný song zrovna přehráván, zastav přehrávání
        if (i === currentIdx) {
          audio.pause();
          audio.src = '';
          currentIdx = -1;
        }
        // Odebrat z pole tracks
        tracks.splice(i, 1);
        // Pokud byl smazaný před aktuálním, posuň index
        if (currentIdx > i) currentIdx--;
        // Update počítadla
        document.getElementById('playlistCount').textContent = tracks.length + ' songů';
        // Překreslit
        renderPlaylist();
        updateUI();
      } catch (e) {
        console.error('Delete error:', e);
        alert('Chyba při mazání: ' + e.message);
        delBtn.disabled = false;
        delBtn.textContent = '🗑';
      }
    });

    pl.appendChild(item);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

// === Web Audio setup (jen poprvé) ===
function setupAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    analyser.smoothingTimeConstant = 0.75;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    // Bez crossorigin se sourceNode nedá vytvořit z Firebase URL,
    // takže spectrum bude jen ozdoba (random hodnoty řízené isPlaying)
  } catch(e) {
    console.warn('Audio context error:', e);
  }
}

// === Spectrum analyzer kreslení ===
// Bez crossorigin nemůžeme číst frekvence z audio, takže
// generujeme animaci řízenou isPlaying (rytmické pruhy)
let fakeBars = new Array(16).fill(0);
let fakeTargets = new Array(16).fill(0);
let peakHolds = new Array(16).fill(0);
let peakDecay = new Array(16).fill(0);

function drawSpectrum() {
  if (!canvasRect) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.scale(dpr, dpr);
    canvasRect = { w: canvas.clientWidth, h: canvas.clientHeight };
  }

  ctx.clearRect(0, 0, canvasRect.w, canvasRect.h);

  const bars = 16;
  const barWidth = canvasRect.w / bars;
  const gap = 2;
  // LED segmenty - 12 kostiček na sloupec
  const segments = 12;
  const segGap = 1;
  const segHeight = (canvasRect.h - (segments + 1) * segGap) / segments;

  for (let i = 0; i < bars; i++) {
    if (isPlaying) {
      if (Math.abs(fakeBars[i] - fakeTargets[i]) < 0.05 || Math.random() < 0.05) {
        fakeTargets[i] = Math.random() * 0.9 + 0.1;
      }
      fakeBars[i] += (fakeTargets[i] - fakeBars[i]) * 0.3;
    } else {
      fakeBars[i] = 0.18 + 0.22 * Math.abs(Math.sin(Date.now() / 600 + i * 0.7));
    }

    const v = Math.max(0, Math.min(1, fakeBars[i]));
    const litSegments = Math.floor(v * segments);

    // Peak hold - "značka" co padá dolů pomalu
    if (litSegments > peakHolds[i]) {
      peakHolds[i] = litSegments;
      peakDecay[i] = 0;
    } else {
      peakDecay[i]++;
      if (peakDecay[i] > 20) {
        peakHolds[i] = Math.max(litSegments, peakHolds[i] - 0.3);
      }
    }

    const x = i * barWidth + gap/2;
    const w = barWidth - gap;

    // Kresli každý LED segment zdola nahoru
    for (let s = 0; s < segments; s++) {
      const segY = canvasRect.h - (s + 1) * (segHeight + segGap);
      const isLit = s < litSegments;
      const isPeak = Math.floor(peakHolds[i]) === s && s >= litSegments;

      // Určit barvu segmentu podle pozice (zdola: zelená -> žlutá)
      let color, dimColor;
      if (s < segments * 0.6) {
        // Spodních 60% = zelená
        color = '#00ff44';
        dimColor = 'rgba(0,80,20,0.5)';
      } else if (s < segments * 0.85) {
        // Středních 25% = žlutá
        color = '#ffdd00';
        dimColor = 'rgba(80,60,0,0.5)';
      } else {
        // Horních 15% = oranžovo-žlutá (lehký peak indicator)
        color = '#ffaa00';
        dimColor = 'rgba(80,40,0,0.5)';
      }

      if (isLit) {
        // Rozsvícený segment s glow efektem
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.fillStyle = color;
        ctx.fillRect(x, segY, w, segHeight);
        ctx.shadowBlur = 0;

        // Vnitřní lesk
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fillRect(x, segY, w, segHeight * 0.3);
      } else if (isPeak) {
        // Peak indicator - zářivá čárka
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = color;
        ctx.fillRect(x, segY, w, segHeight);
        ctx.shadowBlur = 0;
      } else {
        // Zhasnutý segment - tmavá kostka
        ctx.fillStyle = dimColor;
        ctx.fillRect(x, segY, w, segHeight);
      }
    }
  }

  requestAnimationFrame(drawSpectrum);
}
drawSpectrum();

// === Přehrávání ===
function playTrack(idx) {
  if (idx < 0 || idx >= tracks.length) return;
  currentIdx = idx;
  const t = tracks[idx];

  setupAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  audio.src = t.url;
  audio.play().then(() => {
    isPlaying = true;
    updateUI();
  }).catch(e => console.error('Play error:', e));

  document.getElementById('trackTitle').textContent = t.title;
  document.getElementById('trackArtist').textContent = t.artist;

  // Album art - nejdřív zkus externí obrázek, pak embedded ID3
  const img = document.getElementById('albumArt');
  const placeholder = document.getElementById('albumPlaceholder');
  if (t.art) {
    img.src = t.art;
    img.style.display = 'block';
    placeholder.style.display = 'none';
  } else {
    // Skry obrázek, ukaž placeholder, mezitím zkus načíst ID3
    img.style.display = 'none';
    placeholder.style.display = 'flex';
    loadEmbeddedArt(t, idx);
  }

  renderPlaylist();
}

// === Načtení embedded album art a metadat z ID3 tagu ===
function loadEmbeddedArt(track, idx) {
  if (typeof jsmediatags === 'undefined') return;
  // Cache - pokud jsme to už načítali, použij
  if (track._artLoaded) return;
  track._artLoaded = true;

  jsmediatags.read(track.url, {
    onSuccess: function(tag) {
      const tags = tag.tags;
      // Vytáhni title/artist z ID3 pokud jsou
      if (tags.title && currentIdx === idx) {
        track.title = tags.title;
        document.getElementById('trackTitle').textContent = tags.title;
      }
      if (tags.artist && currentIdx === idx) {
        track.artist = tags.artist;
        document.getElementById('trackArtist').textContent = tags.artist;
      }
      // Embedded album art
      if (tags.picture) {
        const pic = tags.picture;
        let base64 = '';
        for (let i = 0; i < pic.data.length; i++) {
          base64 += String.fromCharCode(pic.data[i]);
        }
        const dataUrl = `data:${pic.format};base64,${btoa(base64)}`;
        track.art = dataUrl;
        if (currentIdx === idx) {
          const img = document.getElementById('albumArt');
          const placeholder = document.getElementById('albumPlaceholder');
          img.src = dataUrl;
          img.style.display = 'block';
          placeholder.style.display = 'none';
        }
      }
      renderPlaylist();
    },
    onError: function(e) {
      console.warn('ID3 read fail:', track.name, e.type || e);
    }
  });
}

function togglePlay() {
  if (currentIdx < 0 && tracks.length > 0) {
    playTrack(0);
    return;
  }
  if (isPlaying) {
    audio.pause();
    isPlaying = false;
  } else {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    audio.play();
    isPlaying = true;
  }
  updateUI();
}

function nextTrack() {
  if (tracks.length === 0) return;
  if (shuffleOn) {
    // Náhodný index různý od aktuálního
    let next;
    if (tracks.length === 1) next = 0;
    else {
      do { next = Math.floor(Math.random() * tracks.length); }
      while (next === currentIdx);
    }
    playTrack(next);
  } else {
    playTrack((currentIdx + 1) % tracks.length);
  }
}

function prevTrack() {
  if (tracks.length === 0) return;
  if (shuffleOn) {
    let prev;
    if (tracks.length === 1) prev = 0;
    else {
      do { prev = Math.floor(Math.random() * tracks.length); }
      while (prev === currentIdx);
    }
    playTrack(prev);
  } else {
    playTrack((currentIdx - 1 + tracks.length) % tracks.length);
  }
}

function updateUI() {
  const btn = document.getElementById('btnPlay');
  btn.textContent = isPlaying ? '⏸' : '▶';
  const status = document.getElementById('status');
  if (isPlaying) {
    status.textContent = '● Hraje';
    status.classList.add('playing');
  } else {
    status.textContent = '○ Pauza';
    status.classList.remove('playing');
  }
}

// === Progress bar ===
function formatTime(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${String(sec).padStart(2,'0')}`;
}

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('curTime').textContent = formatTime(audio.currentTime);
  document.getElementById('totalTime').textContent = formatTime(audio.duration);
});

audio.addEventListener('ended', () => {
  if (repeatOn) {
    // Opakuj aktuální skladbu
    audio.currentTime = 0;
    audio.play();
  } else {
    nextTrack();
  }
});

document.getElementById('progressBar').addEventListener('click', (e) => {
  if (!audio.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - r.left) / r.width;
  audio.currentTime = pct * audio.duration;
});

// === Tlačítka ===
document.getElementById('btnPlay').onclick = togglePlay;
document.getElementById('btnNext').onclick = nextTrack;
document.getElementById('btnPrev').onclick = prevTrack;
document.getElementById('btnShuffle').onclick = () => {
  shuffleOn = !shuffleOn;
  document.getElementById('btnShuffle').classList.toggle('active', shuffleOn);
};
document.getElementById('btnRepeat').onclick = () => {
  repeatOn = !repeatOn;
  document.getElementById('btnRepeat').classList.toggle('active', repeatOn);
};

// === Klávesnice ===
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowRight') nextTrack();
  else if (e.code === 'ArrowLeft') prevTrack();
});

// === Resize canvas ===
window.addEventListener('resize', () => { canvasRect = null; });

// === Upload nového songu do Firebase Storage /kladyxamp/ ===
document.getElementById('uploadInput').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const statusEl = document.getElementById('uploadStatus');

  const maxSize = 50 * 1024 * 1024; // 50 MB
  if (f.size > maxSize) {
    statusEl.textContent = '⚠️ Soubor je příliš velký (max 50 MB)';
    e.target.value = '';
    return;
  }

  statusEl.textContent = `📤 Nahrávám: ${f.name}...`;

  const fileRef = sref(storage, 'kladyxamp/' + f.name);
  uploadBytes(fileRef, f).then(() => {
    statusEl.textContent = `✅ Nahráno: ${f.name}`;
    _justUploadedName = f.name;
    tracks = [];
    document.getElementById('playlist').innerHTML = '<div class="loading">Načítám písně z Firebase</div>';
    loadTracks().then(() => {
      setTimeout(() => { statusEl.textContent = ''; }, 4000);
    });
  }).catch((err) => {
    statusEl.textContent = `❌ Chyba nahrávání: ${err.code || err.message}`;
    console.error('Upload error:', err);
  });

  e.target.value = '';
});

// === Upload nového podkresu do Storage /podkres/ ===
document.getElementById('pkUploadInput').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const statusEl = document.getElementById('pkUploadStatus');

  const maxSize = 50 * 1024 * 1024; // 50 MB
  if (f.size > maxSize) {
    statusEl.textContent = '⚠️ Soubor je příliš velký (max 50 MB)';
    e.target.value = '';
    return;
  }

  statusEl.textContent = `📤 Nahrávám: ${f.name}...`;

  const fileRef = sref(storage, 'podkres/' + f.name);
  uploadBytes(fileRef, f).then(() => {
    statusEl.textContent = `✅ Nahráno: ${f.name}`;
    // Reload seznam podkresů
    loadPodkres();
    setTimeout(() => { statusEl.textContent = ''; }, 4000);
  }).catch((err) => {
    statusEl.textContent = `❌ Chyba nahrávání: ${err.code || err.message}`;
    console.error('Podkres upload error:', err);
  });

  e.target.value = '';
});

// === Podkres Panelu - načtení seznamu z Storage /podkres/ ===
async function loadPodkres() {
  const listEl = document.getElementById('podkresItems');
  try {
    // Načti aktivní podkres z RTDB
    try {
      const snap = await dget(dref(db, 'kladyxPodkres/active'));
      if (snap.exists()) _activePodkres = snap.val();
    } catch(e) { console.warn('Podkres active load fail:', e); }

    // Načti seznam souborů ze Storage
    const listRef = sref(storage, 'podkres');
    const result = await listAll(listRef);
    const items = result.items.filter(it =>
      /\.(mp3|wav|ogg|m4a|mp4|flac|aac|opus|weba|webm)$/i.test(it.name)
    );

    if (items.length === 0) {
      listEl.innerHTML = '<div class="pk-empty">📁 Žádné podkresy ve složce <b>podkres/</b></div>';
      return;
    }

    listEl.innerHTML = '';
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'pk-item' + (item.name === _activePodkres ? ' active' : '');

      const dot = document.createElement('span');
      dot.className = 'pk-dot';

      const name = document.createElement('span');
      name.className = 'pk-name';
      name.textContent = item.name;

      // Akce: play + smaz
      const actions = document.createElement('div');
      actions.className = 'pk-actions';

      const playBtn = document.createElement('button');
      playBtn.type = 'button';
      playBtn.className = 'pk-btn play';
      playBtn.title = 'Přehrát podkres';
      playBtn.textContent = '▶';

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'pk-btn del';
      delBtn.title = 'Smazat ze Storage';
      delBtn.textContent = '🗑';

      actions.appendChild(playBtn);
      actions.appendChild(delBtn);

      row.appendChild(dot);
      row.appendChild(name);
      row.appendChild(actions);

      // Klik na řádek (mimo tlačítka) = vyber jako aktivní (stará logika)
      row.onclick = (ev) => {
        if (ev.target.closest('.pk-btn')) return;
        selectPodkres(item.name);
      };

      // Play tlačítko = přehrát podkres ve skrytém pkPreview audio
      playBtn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        try {
          const url = await getDownloadURL(item);
          const pkAudio = document.getElementById('pkPreview');
          // Pauznout hlavní KladyxAmp audio (ať nehraje současně)
          const mainAudio = document.getElementById('audio');
          if (mainAudio && !mainAudio.paused) {
            mainAudio.pause();
          }
          // Pauznout ostatní preview
          pkAudio.pause();
          pkAudio.src = url;
          pkAudio.style.display = 'block';
          pkAudio.controls = true;
          // Vložit přehrávač pod tento řádek
          row.parentNode.insertBefore(pkAudio, row.nextSibling);
          pkAudio.load();
          pkAudio.play().catch(err => console.warn('Podkres play:', err));
        } catch (e) {
          console.error('Podkres play error:', e);
          alert('Chyba přehrávání: ' + (e.code || e.message));
        }
      });

      // Smaz tlačítko = potvrzení + delete
      delBtn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        const confirmMsg = 'Opravdu smazat podkres "' + item.name + '" ze Storage?\n\nPo smazání Panel přestane tento podkres přehrávat.';
        if (!confirm(confirmMsg)) return;
        try {
          delBtn.disabled = true;
          delBtn.textContent = '⏳';
          await deleteObject(item);
          // Pokud byl aktivní, vymazat z RTDB
          if (item.name === _activePodkres) {
            try {
              await dset(dref(db, 'kladyxPodkres/active'), null);
              _activePodkres = null;
            } catch(e) { console.warn('Clear active failed:', e); }
          }
          // Pokud preview hraje, stop
          const pkAudio = document.getElementById('pkPreview');
          if (pkAudio && !pkAudio.paused) {
            pkAudio.pause();
            pkAudio.src = '';
            pkAudio.style.display = 'none';
          }
          // Reload celý seznam
          loadPodkres();
        } catch (e) {
          console.error('Podkres delete error:', e);
          alert('Chyba mazání: ' + (e.code || e.message));
          delBtn.disabled = false;
          delBtn.textContent = '🗑';
        }
      });

      listEl.appendChild(row);
    });
  } catch (e) {
    console.error('Podkres load error:', e);
    listEl.innerHTML = `<div class="pk-empty">❌ Chyba: ${e.code || e.message}</div>`;
  }
}

async function selectPodkres(name) {
  try {
    await dset(dref(db, 'kladyxPodkres/active'), name);
    _activePodkres = name;
    // Aktualizuj UI - zelená tečka u nového
    const items = document.querySelectorAll('#podkresList .pk-item');
    items.forEach(el => {
      const itemName = el.querySelector('.pk-name').textContent;
      el.classList.toggle('active', itemName === name);
    });
  } catch (e) {
    console.error('Podkres save error:', e);
    alert('Chyba ukládání podkresu: ' + (e.code || e.message));
  }
}

// Toggle rozbalení seznamu
document.getElementById('podkresToggle').addEventListener('click', () => {
  const list = document.getElementById('podkresList');
  const arrow = document.getElementById('podkresArrow');
  const open = list.classList.toggle('open');
  arrow.textContent = open ? '▲' : '▼';
});

loadPodkres();

// === Start ===
loadTracks();
</script>
