name: Auto-update version.json

on:
  push:
    paths:
      - 'Panel.html'

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract version from Panel.html
        id: extract
        run: |
          VERSION=$(grep
