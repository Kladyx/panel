<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SpeakUp v6.2Kl</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background:#0a0e18; color:#e8f0ff;
  font-family:'Segoe UI',system-ui,sans-serif;
  padding:14px; min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}

/* HEADER */
.hdr { display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
h1 { font-size:1.1rem; color:#00d4ff; letter-spacing:2px; }
.ver { font-size:.7rem; color:rgba(255,255,255,.3); }
.subhdr { font-size:.72rem; color:rgba(255,255,255,.35); margin-bottom:18px; }

/* SCORE BAR */
.scorebar {
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px; padding:10px 14px;
  margin-bottom:14px;
}
.score-num { font-size:1.4rem; font-weight:700; color:#00ff88; min-width:30px; }
.score-lbl { font-size:.72rem; color:rgba(255,255,255,.4); line-height:1.3; }
.lvl-badge {
  margin-left:auto;
  background:rgba(0,212,255,.15);
  border:1px solid rgba(0,212,255,.4);
  border-radius:20px; padding:4px 12px;
  font-size:.72rem; color:#00d4ff; font-weight:700;
}
.prog-wrap {
  background:rgba(255,255,255,.08);
  border-radius:4px; height:4px; margin-top:6px; width:100%;
}
.prog-bar {
  height:4px; border-radius:4px;
  background:linear-gradient(90deg,#00d4ff,#00ff88);
  transition:width .4s ease;
  width:0%;
}
.mastery-bar {
  display:flex; gap:6px; margin-top:6px; align-items:center;
  font-size:.68rem;
}
.mastery-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.mastery-dot.ok  { background:#00ff88; }
.mastery-dot.mid { background:#ffcc00; }
.mastery-dot.bad { background:#ff4466; }
.mastery-dot.new { background:rgba(255,255,255,.25); }

/* MAIN CARD */
.card {
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px; padding:18px;
  margin-bottom:14px;
}
.card-label {
  font-size:.68rem; color:#00d4ff; letter-spacing:1.5px;
  text-transform:uppercase; margin-bottom:8px;
}
.question-en {
  font-size:1.15rem; font-weight:700; color:#e8f0ff;
  line-height:1.4; margin-bottom:6px;
}
.question-cz {
  font-size:.85rem; color:rgba(255,255,255,.45);
  line-height:1.5; margin-bottom:0;
  display:none;
}
.question-cz.show { display:block; }

/* PLAY BUTTON */
.btn-play {
  width:100%; padding:16px;
  border-radius:12px; border:1.5px solid #00d4ff;
  background:rgba(0,212,255,.12); color:#00d4ff;
  font-size:1rem; font-weight:700; font-family:inherit;
  cursor:pointer; margin-bottom:14px;
  transition:background .15s;
}
.btn-play:active { background:rgba(0,212,255,.3); }
.btn-play:disabled { opacity:.4; cursor:not-allowed; }

/* OPTIONS */
.options { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
.opt {
  width:100%; padding:16px 14px;
  border-radius:12px; border:1.5px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.05); color:#e8f0ff;
  font-size:.92rem; font-family:inherit;
  cursor:pointer; text-align:left; line-height:1.4;
  transition:border-color .15s, background .15s;
}
.opt:active { background:rgba(255,255,255,.1); }
.opt.correct { border-color:#00ff88; background:rgba(0,255,136,.12); color:#00ff88; }
.opt.wrong   { border-color:#ff4466; background:rgba(255,68,102,.12); color:#ff6688; }
.opt:disabled { cursor:not-allowed; }

/* MIC BUTTON */
.btn-mic {
  width:100%; padding:20px;
  border-radius:12px; border:1.5px solid #00d4ff;
  background:rgba(0,212,255,.12); color:#00d4ff;
  font-size:1.05rem; font-weight:700; font-family:inherit;
  cursor:pointer; margin-bottom:14px;
  transition:background .15s, border-color .15s;
}
.btn-mic.listening {
  border-color:#ff4466; background:rgba(255,68,102,.18); color:#ff6688;
  animation:pulse 1.2s infinite;
}
.btn-mic:disabled { opacity:.4; cursor:not-allowed; }
@keyframes pulse {
  0%,100% { opacity:1; }
  50% { opacity:.6; }
}

/* FEEDBACK */
.feedback {
  border-radius:12px; padding:16px;
  font-size:.9rem; font-weight:600; line-height:1.5;
  margin-bottom:14px; display:none;
}
.feedback.show { display:block; }
.feedback.ok  { background:rgba(0,255,136,.1); border:1px solid rgba(0,255,136,.4); color:#00ff88; }
.feedback.bad { background:rgba(255,68,102,.1); border:1px solid rgba(255,68,102,.4); color:#ff6688; }
.feedback .heard { font-size:.78rem; color:rgba(255,255,255,.5); margin-top:6px; }
.feedback .mic-score { font-size:.82rem; color:#00ff88; margin-top:8px; line-height:1.5; }
.mic-legend {
  margin-top:10px; border-top:1px solid rgba(0,255,136,.2);
  padding-top:8px;
}
.mic-legend table { width:100%; border-collapse:collapse; font-size:.75rem; }
.mic-legend td { padding:4px 6px; line-height:1.4; }
.mic-legend td:first-child { color:#00d4ff; font-weight:700; white-space:nowrap; width:90px; }
.mic-legend td:last-child { color:rgba(255,255,255,.6); }
.mic-legend tr.active-row td { color:#00ff88 !important; font-weight:700; }

/* NEXT BUTTON */
.btn-next {
  width:100%; padding:18px;
  border-radius:12px; border:1.5px solid #00ff88;
  background:rgba(0,255,136,.12); color:#00ff88;
  font-size:1rem; font-weight:700; font-family:inherit;
  cursor:pointer; display:none;
  transition:background .15s;
}
.btn-next.show { display:block; }
.btn-next:active { background:rgba(0,255,136,.28); }

/* STATUS */
.status {
  font-size:.75rem; color:rgba(255,255,255,.35);
  text-align:center; min-height:20px;
  margin-bottom:10px;
}

/* FINISH */
.finish {
  background:rgba(0,255,136,.06);
  border:1px solid rgba(0,255,136,.3);
  border-radius:14px; padding:24px; text-align:center;
  display:none;
}
.finish.show { display:block; }
.finish h2 { font-size:1.3rem; color:#00ff88; margin-bottom:8px; }
.finish .fscore { font-size:2.5rem; font-weight:700; color:#00d4ff; margin:10px 0; }
.finish p { font-size:.85rem; color:rgba(255,255,255,.5); margin-bottom:16px; }
.btn-restart {
  width:100%; padding:18px;
  border-radius:12px; border:1.5px solid #00d4ff;
  background:rgba(0,212,255,.12); color:#00d4ff;
  font-size:1rem; font-weight:700; font-family:inherit;
  cursor:pointer;
}
.btn-restart:active { background:rgba(0,212,255,.28); }

/* LEVEL SELECTOR */
.lvl-bar {
  display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;
}
.lvl-btn {
  flex:1; min-width:52px; padding:9px 4px;
  border-radius:10px; border:1.5px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.04); color:rgba(255,255,255,.45);
  font-size:.75rem; font-weight:700; font-family:inherit;
  cursor:pointer;
}
.lvl-btn.active {
  border-color:#00ff88; background:rgba(0,255,136,.14); color:#00ff88;
}

/* MODE TOGGLE */
.mode-bar {
  display:flex; gap:8px; margin-bottom:14px;
}
.mode-btn {
  flex:1; padding:10px 6px;
  border-radius:10px; border:1.5px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.04); color:rgba(255,255,255,.45);
  font-size:.78rem; font-weight:700; font-family:inherit;
  cursor:pointer;
}
.mode-btn.active {
  border-color:#00d4ff; background:rgba(0,212,255,.14); color:#00d4ff;
}

/* TAB SWITCHER */
.tab-bar {
  display:flex; gap:6px; margin-bottom:14px;
}
.tab-btn {
  flex:1; padding:12px 6px;
  border-radius:10px; border:1.5px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.04); color:rgba(255,255,255,.45);
  font-size:.82rem; font-weight:700; font-family:inherit; cursor:pointer;
}
.tab-btn.active {
  border-color:#00d4ff; background:rgba(0,212,255,.14); color:#00d4ff;
}
.tab-section { display:none; }
.tab-section.show { display:block; }

/* SLOVÍČKA */
.voc-word {
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px; padding:20px 18px;
  margin-bottom:14px; text-align:center;
}
.voc-en {
  font-size:1.5rem; font-weight:700; color:#e8f0ff;
  margin-bottom:4px; letter-spacing:.5px;
}
.voc-phonetic {
  font-size:.82rem; color:rgba(0,212,255,.7);
  margin-bottom:6px; font-style:italic;
}
.voc-cz {
  font-size:.95rem; color:rgba(255,255,255,.5);
  display:none;
}
.voc-cz.show { display:block; }
.voc-cat {
  font-size:.68rem; color:rgba(255,255,255,.3);
  letter-spacing:1.5px; text-transform:uppercase;
  margin-bottom:12px;
}
.voc-btns {
  display:flex; gap:8px; margin-bottom:10px;
}
.btn-voc-play {
  flex:1; padding:14px;
  border-radius:12px; border:1.5px solid #00d4ff;
  background:rgba(0,212,255,.12); color:#00d4ff;
  font-size:.9rem; font-weight:700; font-family:inherit; cursor:pointer;
}
.btn-voc-mic {
  flex:1; padding:14px;
  border-radius:12px; border:1.5px solid #00ff88;
  background:rgba(0,255,136,.12); color:#00ff88;
  font-size:.9rem; font-weight:700; font-family:inherit; cursor:pointer;
}
.btn-voc-mic.listening {
  border-color:#ff4466; background:rgba(255,68,102,.18); color:#ff6688;
  animation:pulse 1.2s infinite;
}
.btn-voc-show {
  width:100%; padding:12px;
  border-radius:12px; border:1.5px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.05); color:rgba(255,255,255,.6);
  font-size:.85rem; font-weight:700; font-family:inherit; cursor:pointer;
  margin-bottom:10px;
}
.voc-heard {
  font-size:.8rem; color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:8px; padding:10px 12px;
  margin-bottom:10px; min-height:36px;
  text-align:center;
}
.voc-result {
  border-radius:10px; padding:12px 14px;
  font-size:.88rem; font-weight:600;
  margin-bottom:10px; display:none; text-align:center;
}
.voc-result.show { display:block; }
.voc-result.ok  { background:rgba(0,255,136,.1); border:1px solid rgba(0,255,136,.4); color:#00ff88; }
.voc-result.bad { background:rgba(255,68,102,.1); border:1px solid rgba(255,68,102,.4); color:#ff6688; }
.voc-next {
  width:100%; padding:16px;
  border-radius:12px; border:1.5px solid #00ff88;
  background:rgba(0,255,136,.12); color:#00ff88;
  font-size:.95rem; font-weight:700; font-family:inherit; cursor:pointer;
  display:none;
}
.voc-next.show { display:block; }
.voc-stats {
  display:flex; gap:8px; margin-bottom:12px;
}
.voc-stat-box {
  flex:1; background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px; padding:8px; text-align:center;
}
.voc-stat-num { font-size:1.2rem; font-weight:700; color:#00d4ff; }
.voc-stat-lbl { font-size:.65rem; color:rgba(255,255,255,.35); }
.voc-cat-bar {
  display:flex; gap:5px; flex-wrap:wrap; margin-bottom:12px;
}
.voc-cat-btn {
  padding:6px 10px; border-radius:8px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.04); color:rgba(255,255,255,.4);
  font-size:.7rem; font-weight:700; font-family:inherit; cursor:pointer;
}
.voc-cat-btn.active {
  border-color:#00d4ff; background:rgba(0,212,255,.14); color:#00d4ff;
}

/* OPT s reproduktorem */
.opt-row {
  display:flex; align-items:stretch; gap:0;
  border-radius:12px; border:1.5px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.05);
  overflow:hidden;
  transition:border-color .15s;
}
.opt-row.correct { border-color:#00ff88; background:rgba(0,255,136,.08); }
.opt-row.wrong   { border-color:#ff4466; background:rgba(255,68,102,.08); }
.opt-main {
  flex:1; padding:16px 12px;
  background:transparent; color:#e8f0ff;
  font-size:.92rem; font-family:inherit;
  cursor:pointer; text-align:left; line-height:1.4; border:none;
}
.opt-main.correct { color:#00ff88; }
.opt-main.wrong   { color:#ff6688; }
.opt-main:disabled { cursor:not-allowed; }
.opt-speak {
  padding:0 14px;
  background:rgba(255,255,255,.05);
  border:none; border-left:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.4);
  font-size:1rem; cursor:pointer;
  transition:background .15s, color .15s;
  flex-shrink:0;
}
.opt-speak:active { background:rgba(0,212,255,.2); color:#00d4ff; }

/* CUSTOM PHRASES */
.cu-btn{width:100%;padding:11px;border-radius:8px;border:1.5px solid rgba(0,212,255,.35);background:rgba(0,212,255,.07);color:#00d4ff;font-size:.78rem;font-weight:700;letter-spacing:.1em;cursor:pointer;margin-bottom:14px;}
.cu-btn:hover{background:rgba(0,212,255,.15);}
.cu-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;justify-content:center;padding:16px;overflow-y:auto;}
.cu-overlay.show{display:flex;}
.cu-modal{background:#0d1525;border:1px solid rgba(0,212,255,.3);border-radius:12px;padding:18px;width:100%;max-width:480px;margin:auto;}
.cu-modal h3{color:#00d4ff;font-size:.95rem;letter-spacing:2px;margin-bottom:14px;}
.cu-input{width:100%;padding:9px 11px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#e8f0ff;font-size:.8rem;margin-bottom:8px;box-sizing:border-box;}
.cu-input::placeholder{color:rgba(255,255,255,.3);}
.cu-label{font-size:.7rem;color:rgba(255,255,255,.4);margin-bottom:3px;letter-spacing:.05em;display:block;}
.cu-save{padding:10px 18px;border-radius:7px;border:none;background:#00d4ff;color:#000;font-weight:700;font-size:.8rem;cursor:pointer;}
.cu-close{padding:10px 18px;border-radius:7px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#aaa;font-size:.8rem;cursor:pointer;margin-left:8px;}
.cu-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:7px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);margin-bottom:6px;}
.cu-item-q{font-size:.78rem;color:#e8f0ff;flex:1;}
.cu-item-cz{font-size:.7rem;color:rgba(255,255,255,.4);}
.cu-del{background:transparent;border:none;color:#ff4466;font-size:.9rem;cursor:pointer;padding:2px 6px;}
.cu-count{font-size:.68rem;color:rgba(0,212,255,.6);margin-bottom:10px;}
</style>
</head>
<body>

<div class="hdr">
  <h1>SPEAKUP</h1>
  <span class="ver">v6.2Kl</span>
</div>
<div class="subhdr" id="subhdr">Trénink anglické konverzace · Úroveň 1 — Základy</div>

<!-- SCORE -->
<div class="scorebar">
  <div>
    <div class="score-num" id="scoreNum">0</div>
    <div class="score-lbl">správně<br>celkem</div>
  </div>
  <div style="flex:1;padding-left:8px;">
    <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
    <div style="font-size:.68rem;color:rgba(255,255,255,.3);margin-top:4px;" id="progLbl">0 / 40</div>
    <div class="mastery-bar" id="masteryBar"></div>
  </div>
  <div class="lvl-badge" id="lvlBadge">LVL 1</div>
</div>

<!-- TAB SWITCHER -->
<div class="tab-bar">
  <button class="tab-btn active" id="tabConv" onclick="switchTab('conv')">💬 Konverzace</button>
  <button class="tab-btn" id="tabVoc" onclick="switchTab('voc')">📖 Slovíčka</button>
</div>

<!-- ===== KONVERZACE TAB ===== -->
<div class="tab-section show" id="sectionConv">

<!-- LEVEL -->
<div class="lvl-bar">
  <button class="lvl-btn active" id="lbtn1" onclick="setLevel(1)">LVL 1</button>
  <button class="lvl-btn" id="lbtn2" onclick="setLevel(2)">LVL 2</button>
  <button class="lvl-btn" id="lbtn3" onclick="setLevel(3)">LVL 3</button>
  <button class="lvl-btn" id="lbtn4" onclick="setLevel(4)">LVL 4</button>
  <button class="lvl-btn" id="lbtnAll" onclick="setLevel(0)">VŠE</button>
</div>

<!-- MODE -->
<div class="mode-bar">
  <button class="mode-btn active" id="modeOpt" onclick="setMode('opt')">🎯 Výběr</button>
  <button class="mode-btn" id="modeMic" onclick="setMode('mic')">🎤 Mluvit</button>
  <button class="mode-btn" id="modeBoth" onclick="setMode('both')">⚡ Oboje</button>
</div>

<!-- MAIN CARD -->
<div class="card" id="mainCard">
  <div class="card-label">Otázka</div>
  <div class="question-en" id="qEn">—</div>
  <div class="question-cz" id="qCz">—</div>
</div>

<div class="status" id="status">Stiskni přehrát.</div>

<button class="btn-play" id="btnPlay" onclick="playQuestion()">🔊 Přehrát otázku</button>

<!-- OPTIONS (mode: opt / both) -->
<div class="options" id="optArea"></div>

<!-- MIC (mode: mic / both) -->
<button class="btn-mic" id="btnMic" onclick="toggleMic()" style="display:none;">🎤 Odpovědět</button>

<!-- FEEDBACK -->
<div class="feedback" id="feedback"></div>


<!-- CUSTOM PHRASES BUTTON -->
<button class="cu-btn" onclick="openCuModal()">➕ Přidat vlastní frázi</button>

<!-- CUSTOM PHRASES MODAL -->
<div class="cu-overlay" id="cuOverlay">
  <div class="cu-modal">
    <h3>🎤 VLASTNÍ FRÁZE</h3>
    <div class="cu-count" id="cuCount">Uloženo: 0 frází</div>

    <label class="cu-label">Anglická fráze (otázka)</label>
    <input class="cu-input" id="cuQ" placeholder="What's your favorite music?" />

    <label class="cu-label">Český překlad</label>
    <input class="cu-input" id="cuCz" placeholder="Co máš nejraději za hudbu?" />

    <label class="cu-label">Správná odpověď</label>
    <input class="cu-input" id="cuA1" placeholder="I love electronic music." />

    <label class="cu-label">Špatná možnost 2</label>
    <input class="cu-input" id="cuA2" placeholder="I play the drums." />

    <label class="cu-label">Špatná možnost 3</label>
    <input class="cu-input" id="cuA3" placeholder="Music is boring." />

    <label class="cu-label">Klíčová slova pro hlas (oddělte čárkou)</label>
    <input class="cu-input" id="cuKw" placeholder="love electronic music" />

    <div>
      <button class="cu-save" onclick="saveCuPhrase()">💾 Uložit</button>
      <button class="cu-close" onclick="closeCuModal()">✕ Zavřít</button>
    </div>

    <div class="cu-list" id="cuList"></div>
  </div>
</div>

<!-- NEXT -->
<button class="btn-next" id="btnNext" onclick="nextQ()">Další otázka →</button>

<!-- FINISH -->
<div class="finish" id="finish">
  <h2>✅ Hotovo!</h2>
  <div class="fscore" id="finalScore">0/40</div>
  <p id="finalMsg">—</p>
  <button class="btn-restart" onclick="restart()">🔄 Znovu od začátku</button>
</div>

</div><!-- end sectionConv -->

<!-- ===== SLOVÍČKA TAB ===== -->
<div class="tab-section" id="sectionVoc">

<div class="voc-stats">
  <div class="voc-stat-box">
    <div class="voc-stat-num" id="vocDone">0</div>
    <div class="voc-stat-lbl">procvičeno</div>
  </div>
  <div class="voc-stat-box">
    <div class="voc-stat-num" id="vocCorrect">0</div>
    <div class="voc-stat-lbl">správně</div>
  </div>
  <div class="voc-stat-box">
    <div class="voc-stat-num" id="vocAvgPct">—</div>
    <div class="voc-stat-lbl">průměr %</div>
  </div>
  <div class="voc-stat-box">
    <div class="voc-stat-num" id="vocTotal">0</div>
    <div class="voc-stat-lbl">slov</div>
  </div>
</div>

<div class="voc-cat-bar" id="vocCatBar"></div>

<div class="voc-word" id="vocCard">
  <div class="voc-cat" id="vocCat">—</div>
  <div class="voc-en" id="vocEn">—</div>
  <div class="voc-phonetic" id="vocPhonetic"></div>
  <div class="voc-cz" id="vocCz">—</div>
</div>

<div class="voc-btns">

/* ===== MASTERY (localStorage) ===== */
// Klíč: su_q_{hash} → {attempts, correct, avgPct}
function qKey(q){ return 'su_q_'+Math.abs(hashStr(q.q)); }
function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++){ h=Math.imul(31,h)+s.charCodeAt(i)|0; }
  return h;
}
function getMastery(q){
  try{ return JSON.parse(localStorage.getItem(qKey(q)))||{attempts:0,correct:0,avgPct:50}; }
  catch(e){ return {attempts:0,correct:0,avgPct:50}; }
}
function saveMastery(q, isCorrect, pct){
  try{
    const m=getMastery(q);
    m.attempts++;
    if(isCorrect) m.correct++;
    // klouzavý průměr posledních výsledků
    m.avgPct=Math.round((m.avgPct*(m.attempts-1)+(pct||( isCorrect?85:30)))/m.attempts);
    localStorage.setItem(qKey(q), JSON.stringify(m));
  }catch(e){}
}
function getPriority(q){
  const m=getMastery(q);
  if(m.attempts===0) return 2;        // nová — střední
  if(m.avgPct<55)    return 4;        // špatná výslovnost — nejvyšší
  if(m.avgPct<75)    return 3;        // pod cílem — vysoká
  if(m.avgPct<90)    return 2;        // OK — normální
  return 1;                           // zvládnuto — nízká
}
function buildQueue(src){
  // Rozděl podle priority a zamíchej každou skupinu
  const p4=[],p3=[],p2=[],p1=[];
  src.forEach(function(q){
    const p=getPriority(q);
    if(p===4) p4.push(q);
    else if(p===3) p3.push(q);
    else if(p===2) p2.push(q);
    else p1.push(q);
  });
  // Vysoce prioritní 2x, ostatní 1x, zvládnuté jen občas
  const result=[];
  shuffle(p4).forEach(function(q){ result.push(q); result.push(q); }); // 2x
  shuffle(p3).forEach(function(q){ result.push(q); });
  shuffle(p2).forEach(function(q){ result.push(q); });
  // p1 (zvládnuté) — jen každá třetí
  shuffle(p1).filter(function(_,i){ return i%3===0; }).forEach(function(q){ result.push(q); });
  return result.length>0 ? result : shuffle([...src]);
}
function updateMasteryBar(src){
  let ok=0,mid=0,bad=0,nw=0;
  src.forEach(function(q){
    const m=getMastery(q);
    if(m.attempts===0) nw++;
    else if(m.avgPct>=90) ok++;
    else if(m.avgPct>=75) mid++;
    else bad++;
  });
  const bar=document.getElementById('masteryBar');
  if(!bar) return;
  bar.innerHTML=
    '<span class="mastery-dot ok"></span><span style="color:rgba(255,255,255,.4)">'+ok+'</span>'
   +'<span class="mastery-dot mid" style="margin-left:6px"></span><span style="color:rgba(255,255,255,.4)">'+mid+'</span>'
   +'<span class="mastery-dot bad" style="margin-left:6px"></span><span style="color:rgba(255,255,255,.4)">'+bad+'</span>'
   +'<span class="mastery-dot new" style="margin-left:6px"></span><span style="color:rgba(255,255,255,.4)">'+nw+' nových</span>';
}

/* ===== LEVENSHTEIN ===== */
function levenshtein(a, b){
  const m=a.length, n=b.length;
  const dp=[];
  for(let i=0;i<=m;i++){ dp[i]=[i]; }
  for(let j=0;j<=n;j++){ dp[0][j]=j; }
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function similarityPct(heard, target){
  heard=heard.toLowerCase().trim();
  target=target.toLowerCase().trim();
  const maxLen=Math.max(heard.length, target.length);
  if(maxLen===0) return 100;
  const dist=levenshtein(heard, target);
  return Math.round((1 - dist/maxLen)*100);
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ===== CHECK OPTION ===== */
function checkOpt(chosen, row, btn, q, correctOpt){
  if(answered) return;
  answered=true;
  // Disable všechny opt-main buttony
  document.querySelectorAll('.opt-main').forEach(function(b){ b.disabled=true; });

  // Správnost: přesné porovnání s opts[0] (správná odpověď z DB)
  const correct = (chosen === correctOpt);
  saveMastery(q, correct, correct?88:25);

  if(correct){
    row.classList.add('correct');
    btn.classList.add('correct');
    score++; updateScore();
    showFeedback(true, chosen, null);
    // Auto-posun po 1.5s
    idx++;
    setTimeout(function(){ if(answered) nextQ(); }, 1500);
  } else {
    row.classList.add('wrong');
    btn.classList.add('wrong');
    // Zvýraznit správnou odpověď zeleně
    document.querySelectorAll('.opt-main').forEach(function(b){
      if(b.textContent === correctOpt){
        b.closest('.opt-row').classList.add('correct');
        b.classList.add('correct');
      }
    });
    showFeedback(false, chosen, correctOpt);
    idx++;
    document.getElementById('btnNext').classList.add('show');
  }
}

/* ===== MIC ===== */
function toggleMic(){
  if(recRunning){ stopMic(); return; }
  startMic();
}

function startMic(){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ document.getElementById('status').textContent='❌ Prohlížeč nepodporuje mikrofon.'; return; }
  recObj=new SR();
  recObj.lang='en-US'; recObj.interimResults=false; recObj.maxAlternatives=3;
  const btn=document.getElementById('btnMic');
  recObj.onstart=function(){ recRunning=true; btn.textContent='⏹ Zastavit'; btn.classList.add('listening'); document.getElementById('status').textContent='🎤 Poslouchám…'; };
  recObj.onresult=function(ev){
    let heard='';
    let conf=0;
    for(let i=0;i<ev.results[0].length;i++){
      heard+=ev.results[0][i].transcript+' ';
      if(ev.results[0][i].confidence>conf) conf=ev.results[0][i].confidence;
    }
    heard=heard.trim().toLowerCase();
    evalMic(heard, conf);
  };
  recObj.onerror=function(ev){
    if(ev.error==='no-speech'){ document.getElementById('status').textContent='Nic neslyšeno, zkus znovu.'; }
    else { document.getElementById('status').textContent='❌ '+ev.error; }
    recRunning=false;
    btn.textContent='🎤 Odpovědět'; btn.classList.remove('listening');
  };
  recObj.onend=function(){ recRunning=false; btn.textContent='🎤 Odpovědět'; btn.classList.remove('listening'); };
  recObj.start();
}

function stopMic(){ if(recObj&&recRunning) recObj.stop(); }

function evalMic(heard, confidence){
  if(answered) return;
  const q=queue[idx];
  const correctOpt=q.opts[0];
  const correct=q.answers.some(function(a){ return heard.includes(a); });
  answered=true;
  document.getElementById('btnMic').disabled=true;
  document.querySelectorAll('.opt-main').forEach(function(b){ b.disabled=true; });
  // Zobrazit co STT slyšelo
  document.getElementById('status').textContent='🎤 Slyšeno: ' + heard;

  // Výpočet srozumitelnosti
  const bestSim = q.answers.reduce(function(best, ans){
    return Math.max(best, similarityPct(heard, ans));
  }, 0);
  const confPct = Math.round((confidence||0)*100);
  const combined = Math.round(confPct*0.5 + bestSim*0.5);
  micTotal++;
  micScoreSum += combined;
  saveMastery(q, correct, combined);

  if(correct){
    score++; updateScore();
    showFeedback(true, heard, null, combined);
    idx++;
    setTimeout(function(){ if(answered) nextQ(); }, 2000);
  } else {
    showFeedback(false, heard, correctOpt, combined);
    idx++;
    document.getElementById('btnNext').classList.add('show');
  }
}

/* ===== FEEDBACK ===== */
function showFeedback(ok, heard, suggestion, micPct){
  const fb=document.getElementById('feedback');
  let micLine='';
  if(micPct !== undefined && micPct !== null){
    let label='';
    if(micPct>=90) label='Perfektní výslovnost 🏆';
    else if(micPct>=75) label='Angličan by ti rozuměl ✅';
    else if(micPct>=55) label='Celkem srozumitelné, ale pracuj na výslovnosti ⚠️';
    else label='Angličan by měl problém porozumět ❌';
    const avg = micTotal>0 ? Math.round(micScoreSum/micTotal) : micPct;
    const rows=[
      {range:'90–100%', desc:'Angličan rozumí bez problémů', min:90},
      {range:'75–89%',  desc:'Rozumí, možná se zeptá jednou znovu', min:75},
      {range:'55–74%',  desc:'Pochopí, ale musí se snažit', min:55},
      {range:'0–54%',   desc:'Požádá tě o zopakování', min:0}
    ];
    let tableRows='';
    rows.forEach(function(r){
      let isActive=false;
      if(micPct>=90) isActive=(r.min===90);
      else if(micPct>=75) isActive=(r.min===75);
      else if(micPct>=55) isActive=(r.min===55);
      else isActive=(r.min===0);
      tableRows+='<tr'+(isActive?' class="active-row"':'')+'><td>'+r.range+'</td><td>'+r.desc+'</td></tr>';
    });
    micLine='<div class="mic-score">🎙 Srozumitelnost: <b>'+micPct+'%</b> — '+label+'<br>'
            +'<span style="font-size:.72rem;opacity:.7">Průměr relace: '+avg+'%</span>'
            +'<div class="mic-legend"><table>'+tableRows+'</table></div>'
            +'</div>';
  }
  if(ok){
    fb.className='feedback ok show';
    fb.innerHTML='✅ Správně!<div class="heard">Slyšeno: '+escHtml(heard)+'</div>'+micLine;
  } else {
    fb.className='feedback bad show';
    let s='❌ Zkus jinak.';
    if(suggestion) s+=' Zkus: <b>'+escHtml(suggestion)+'</b>';
    s+='<div class="heard">Slyšeno/vybráno: '+escHtml(heard)+'</div>'+micLine;
    fb.innerHTML=s;
  }
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ===== SLOVÍČKA STATE ===== */
let vocQueue=[], vocIdx=0, vocDone=0, vocCorrectCount=0, vocScoreSum=0;
let vocCat='Vše', vocRecRunning=false, vocRecObj=null;

function vocInit(){
  // Kategorie tlačítka
  const cats=['Vše',...new Set(VOC.map(function(v){return v.cat;}))];
  const bar=document.getElementById('vocCatBar');
  bar.innerHTML='';
  cats.forEach(function(c){
    const b=document.createElement('button');
    b.className='voc-cat-btn'+(c===vocCat?' active':'');
    b.textContent=c;
    b.onclick=function(){
      vocCat=c;
      document.querySelectorAll('.voc-cat-btn').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      vocBuildQueue();
    };
    bar.appendChild(b);
  });
  document.getElementById('vocTotal').textContent=VOC.length;
  vocBuildQueue();
}

function vocBuildQueue(){
  const src=vocCat==='Vše'?VOC:VOC.filter(function(v){return v.cat===vocCat;});
  vocQueue=shuffle([...src]);
  vocIdx=0; vocDone=0; vocCorrectCount=0; vocScoreSum=0;
  updateVocStats();
  vocShowWord();
}

function vocShowWord(){
  if(vocIdx>=vocQueue.length) vocIdx=0;
  const w=vocQueue[vocIdx];
  document.getElementById('vocCat').textContent=w.cat;
  document.getElementById('vocEn').textContent=w.w;
  document.getElementById('vocPhonetic').textContent=w.ph||'';
  document.getElementById('vocCz').textContent=w.cz;
  document.getElementById('vocCz').classList.remove('show');
  document.getElementById('vocHeard').textContent='Stiskni 🎤 a vyslov slovo anglicky…';
  document.getElementById('vocResult').classList.remove('show');
  document.getElementById('vocResult').className='voc-result';
  document.getElementById('vocNext').classList.add('show');
  document.getElementById('btnVocMic').textContent='🎤 Vyslovit';
  document.getElementById('btnVocMic').classList.remove('listening');
  document.getElementById('btnVocMic').disabled=false;
}

function vocPlay(){
  const w=vocQueue[vocIdx];
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(w.w);
  u.lang=ttsLang; u.rate=0.8;
  window.speechSynthesis.speak(u);
}

function vocShowCz(){
  document.getElementById('vocCz').classList.add('show');
}

function vocNextWord(){
  window.speechSynthesis.cancel();
  if(vocRecRunning) vocStopMic();
  vocIdx++;
  vocShowWord();
}

function updateVocStats(){
  document.getElementById('vocDone').textContent=vocDone;
  document.getElementById('vocCorrect').textContent=vocCorrectCount;
  document.getElementById('vocAvgPct').textContent=vocDone>0?Math.round(vocScoreSum/vocDone)+'%':'—';
  document.getElementById('vocTotal').textContent=
    vocCat==='Vše'?VOC.length:VOC.filter(function(v){return v.cat===vocCat;}).length;
}

function vocToggleMic(){
  if(vocRecRunning){vocStopMic();return;}
  vocStartMic();
}

function vocStartMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){document.getElementById('vocHeard').textContent='❌ Mikrofon nepodporován.';return;}
  vocRecObj=new SR();
  vocRecObj.lang='en-US'; vocRecObj.interimResults=false; vocRecObj.maxAlternatives=3;
  const btn=document.getElementById('btnVocMic');
  vocRecObj.onstart=function(){
    vocRecRunning=true;
    btn.textContent='⏹ Zastavit';
    btn.classList.add('listening');
    document.getElementById('vocHeard').textContent='🎤 Poslouchám…';
  };
  vocRecObj.onresult=function(ev){
    let heard='', conf=0;
    for(let i=0;i<ev.results[0].length;i++){
      heard+=ev.results[0][i].transcript+' ';
      if(ev.results[0][i].confidence>conf) conf=ev.results[0][i].confidence;
    }
    heard=heard.trim().toLowerCase();
    document.getElementById('vocHeard').textContent='Slyšeno: '+heard;
    vocEvalPronunciation(heard, conf);
  };
  vocRecObj.onerror=function(ev){
    document.getElementById('vocHeard').textContent=ev.error==='no-speech'?'Nic neslyšeno.':'❌ '+ev.error;
    vocRecRunning=false;
    btn.textContent='🎤 Vyslovit'; btn.classList.remove('listening');
  };
  vocRecObj.onend=function(){
    vocRecRunning=false;
    btn.textContent='🎤 Vyslovit'; btn.classList.remove('listening');
  };
  vocRecObj.start();
}

function vocStopMic(){if(vocRecObj&&vocRecRunning) vocRecObj.stop();}

function vocEvalPronunciation(heard, confidence){
  const w=vocQueue[vocIdx];
  const target=w.w.toLowerCase().trim();
  const heardClean=heard.trim();

  // Podobnost: similarity + confidence
  const sim=similarityPct(heardClean, target);
  const confPct=Math.round((confidence||0)*100);
  // Bonus: pokud heard přímo obsahuje target word, minimálně 80%
  const containsBonus=(heardClean===target||heardClean.includes(target))?Math.max(sim,85):sim;
  const combined=Math.round(confPct*0.45 + containsBonus*0.55);
  const pct=Math.min(100, Math.max(combined, confPct>0?combined:sim));

  const correct=(pct>=65);
  vocDone++; vocScoreSum+=pct; if(correct) vocCorrectCount++;
  updateVocStats();

  // Hodnocení
  let label, emoji;
  if(pct>=90){ label='Angličan rozumí bez problémů'; emoji='🏆'; }
  else if(pct>=75){ label='Angličan by ti rozuměl'; emoji='✅'; }
  else if(pct>=55){ label='Celkem srozumitelné'; emoji='⚠️'; }
  else { label='Zkus výslovnost znovu'; emoji='❌'; }

  // Barevný progress bar pro %
  let barColor = pct>=75?'#00ff88':pct>=55?'#ffcc00':'#ff4466';

  const res=document.getElementById('vocResult');
  res.classList.add('show');
  res.className='voc-result '+(correct?'ok':'bad')+' show';
  res.innerHTML=
    '<div style="font-size:1.6rem;font-weight:700;color:'+barColor+';">'+pct+'%</div>'
   +'<div style="font-size:.8rem;margin:2px 0 8px;">'+emoji+' '+label+'</div>'
   +'<div style="background:rgba(255,255,255,.08);border-radius:6px;height:8px;overflow:hidden;">'
   +'<div style="width:'+pct+'%;height:8px;border-radius:6px;background:'+barColor+';transition:width .4s;"></div>'
   +'</div>'
   +(correct?'':'<div style="font-size:.75rem;margin-top:8px;opacity:.6;">Cíl: <b>'+escHtml(w.w)+'</b></div>');

  document.getElementById('vocCz').classList.add('show');
}
