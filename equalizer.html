<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="version" content="v3.20.Kl">
<title>Stereo VU Equalizer v3.20.Kl</title>
<style>
:root{
  --bg:#0a0e14;
  --panel:#0e1420;
  --text:#bdc7d5;
  --label:#5a6680;
  --cyan:#00d4ff;
  --green:#00ff7e;
  --yellow:#ffd400;
  --orange:#ff8c00;
  --red:#ff3c5a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'JetBrains Mono','Courier New',monospace;background:var(--bg);color:var(--text);min-height:100vh;padding:14px;}
.header{text-align:center;padding:8px 0 14px;}
.title{font-size:18px;color:var(--cyan);letter-spacing:6px;font-weight:600;text-shadow:0 0 12px rgba(0,212,255,0.5);}
.sub{font-size:10px;color:var(--label);letter-spacing:3px;margin-top:4px;}
.dot-live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);margin-right:5px;animation:pulse 1.4s infinite ease-in-out;vertical-align:middle;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

.status{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--panel);border:1px solid rgba(0,212,255,0.15);border-radius:6px;margin-bottom:12px;font-size:11px;}
.status-mode{font-weight:600;letter-spacing:1px;}
.status-mode.live{color:var(--green);}
.status-mode.wait{color:var(--yellow);}
.status-mode.offline{color:var(--red);}

.vu-wrap{background:var(--panel);border:1px solid rgba(0,212,255,0.15);border-radius:8px;padding:18px 14px;position:relative;}
.vu-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}

.scale{display:flex;flex-direction:column;justify-content:space-between;height:240px;font-size:9px;color:var(--label);padding:2px 0;text-align:right;width:22px;}
.scale span{line-height:1;}

.channel{flex:1;display:flex;flex-direction:column;align-items:center;}
.ch-label{font-size:12px;color:var(--cyan);letter-spacing:2px;margin-bottom:10px;font-weight:600;}
.ch-label.r{color:var(--yellow);}

.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;height:240px;width:100%;}
.bar-col{position:relative;height:100%;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);overflow:hidden;}
.bar-fill{position:absolute;bottom:0;left:0;right:0;height:0%;background:linear-gradient(to top,
  var(--green) 0%,
  var(--green) 80%,
  var(--yellow) 100%);
  transition:height 40ms linear;
  box-shadow:0 0 8px rgba(0,255,126,0.4);
}
.bar-peak{position:absolute;left:0;right:0;height:2px;background:#fff;box-shadow:0 0 4px #fff;transition:bottom 60ms linear;opacity:0.9;}

.freq-row{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px;width:100%;}
.freq-row span{font-size:8px;color:var(--label);text-align:center;}

.info-row{display:flex;justify-content:space-between;margin-top:14px;font-size:10px;color:var(--label);letter-spacing:1px;}
.peak-val{color:var(--cyan);font-weight:600;}

.btn-start{margin-top:14px;width:100%;padding:13px;background:transparent;border:2px solid var(--cyan);color:var(--cyan);font-family:inherit;font-size:12px;letter-spacing:3px;border-radius:6px;cursor:pointer;transition:all 0.2s;}
.btn-start:hover{background:rgba(0,212,255,0.12);}
.btn-start.active{border-color:var(--green);color:var(--green);}

.device-row{display:flex;gap:8px;margin-top:10px;align-items:center;}
.device-row select{flex:1;background:#0e1420;border:1px solid rgba(0,212,255,0.3);color:var(--text);font-family:inherit;font-size:10px;padding:7px 10px;border-radius:6px;outline:none;cursor:pointer;}
.device-row select option{background:#0e1420;}
.device-row label{font-size:10px;color:var(--label);letter-spacing:1px;white-space:nowrap;}

.btn-reset{margin-top:8px;width:100%;padding:9px;background:transparent;border:1px solid var(--yellow);color:var(--yellow);font-family:inherit;font-size:11px;letter-spacing:3px;border-radius:6px;cursor:pointer;transition:all 0.2s;}
.btn-reset:hover{background:rgba(255,212,0,0.1);}
.btn-reset:disabled{opacity:0.3;cursor:default;}
.footer{text-align:center;font-size:9px;color:#2a3142;letter-spacing:3px;margin-top:18px;}

/* Rucickove VU metry */
.vu-meters-row{display:flex;justify-content:center;gap:10px;padding:4px 0 18px;}
.vu-meter-box{display:flex;flex-direction:column;align-items:center;background:#0a0d12;border:1px solid rgba(0,212,255,0.15);border-radius:8px;padding:8px 8px 6px;}
.vu-meter-box .ch-label{margin-bottom:4px;}
.vu-meter-readout{display:flex;justify-content:space-between;width:100%;font-size:8px;color:var(--label);margin-top:3px;letter-spacing:1px;padding:0 2px;}
.vu-meter-readout .vu-val{font-size:11px;font-weight:600;color:var(--green);}
.vu-meter-box.r .vu-meter-readout .vu-val{color:var(--yellow);}
</style>
</head>
<body>

<div class="header">
  <div class="title">&#9834; STEREO VU EQUALIZER &#9834;</div>
  <div class="sub"><span class="dot-live"></span>KLADYXLAND &middot; WEB AUDIO API &middot; v3.20.Kl</div>
</div>

<div class="status">
  <div>MODE: <span class="status-mode wait" id="mode">CEKA NA VSTUP</span></div>
  <div id="hb">&#8212; &#8212;</div>
</div>

<div class="vu-wrap">
  <div class="vu-meters-row">
    <div class="vu-meter-box">
      <div class="ch-label">&#9668; L</div>
      <svg id="vu-svg-l" width="148" height="95" viewBox="0 0 200 128"></svg>
      <div class="vu-meter-readout"><span>CURRENT</span><span class="vu-val" id="vu-l-val">-&#8734;</span></div>
    </div>
    <div class="vu-meter-box r">
      <div class="ch-label r">R &#9658;</div>
      <svg id="vu-svg-r" width="148" height="95" viewBox="0 0 200 128"></svg>
      <div class="vu-meter-readout"><span>CURRENT</span><span class="vu-val" id="vu-r-val">-&#8734;</span></div>
    </div>
  </div>

  <div class="vu-row">
    <div class="scale">
      <span>0</span><span>-15</span><span>-30</span><span>-45</span><span>-60</span>
    </div>
    <div class="channel">
      <div class="ch-label">&#9668; L</div>
      <div class="bars" id="bars-l"></div>
      <div class="freq-row">
        <span>60</span><span>150</span><span>400</span><span>1k</span>
        <span>2.4k</span><span>6k</span><span>12k</span><span>16k</span>
      </div>
    </div>
    <div class="channel">
      <div class="ch-label r">R &#9658;</div>
      <div class="bars" id="bars-r"></div>
      <div class="freq-row">
        <span>60</span><span>150</span><span>400</span><span>1k</span>
        <span>2.4k</span><span>6k</span><span>12k</span><span>16k</span>
      </div>
    </div>
    <div class="scale">
      <span>0</span><span>-15</span><span>-30</span><span>-45</span><span>-60</span>
    </div>
  </div>
  <div class="info-row">
    <div>PEAK L: <span class="peak-val" id="peak-l">0</span></div>
    <div>PEAK R: <span class="peak-val" id="peak-r">0</span></div>
  </div>
</div>

<div class="device-row">
  <label>VSTUP:</label>
  <select id="dev-select"><option value="">-- vyber audio vstup --</option></select>
</div>

<button class="btn-start" id="btn-start" onclick="startAudio()">&#9654; SPUSTIT ANALYZU</button>
<button class="btn-reset" id="btn-reset" onclick="resetPeak()" disabled>&#8635; RESET PEAK</button>

<div class="footer">WEB AUDIO API &middot; FFT 8 BANDS &middot; REAL-TIME &middot; KLADYXLAND 2026 &middot; v3.20.Kl</div>

<script>
var BANDS = 8;
var FREQ_BOUNDS = [40, 100, 200, 500, 1200, 3000, 7000, 14000, 22050];

var smoothL = new Array(BANDS).fill(0);
var smoothR = new Array(BANDS).fill(0);
var SMOOTH_UP   = 0.75;
var SMOOTH_DOWN = 0.35;

var peakHoldL = new Array(BANDS).fill(0);
var peakHoldR = new Array(BANDS).fill(0);
var peakTimerL = new Array(BANDS).fill(0);
var peakTimerR = new Array(BANDS).fill(0);
var PEAK_HOLD_MS = 400;
var PEAK_DECAY   = 0.88;

var audioCtx = null;
var analyserL = null;
var analyserR = null;
var stream = null;
var running = false;
var rafId = null;
var FFT_SIZE = 1024;

// VU smooth (analogova ballistics)
var vuSmL = 0, vuSmR = 0;
var VU_UP = 0.45, VU_DOWN = 0.12;

function buildBars(id){
  var c = document.getElementById(id);
  c.innerHTML = '';
  for(var b = 0; b < BANDS; b++){
    var col = document.createElement('div');
    col.className = 'bar-col';
    var fill = document.createElement('div');
    fill.className = 'bar-fill';
    fill.id = id + '-fill-' + b;
    var peak = document.createElement('div');
    peak.className = 'bar-peak';
    peak.id = id + '-peak-' + b;
    peak.style.bottom = '0%';
    col.appendChild(fill);
    col.appendChild(peak);
    c.appendChild(col);
  }
}
buildBars('bars-l');
buildBars('bars-r');

// ---- Rucickovy VU metr ----
// Pivot: cx=100, cy=112, r_arc=82
// Rozsah uhlu od vertikaly: -68 az +68 stupnu
// VU stupnice: -20 az +3 VU (23 dB celkem)
// pct 0-100 -> uhel -68 az +68

var VU_CX = 100, VU_CY = 112, VU_R = 82;
var VU_ANG_MIN = -68, VU_ANG_MAX = 68; // stupne od vertikaly

function vuPctToAngle(pct){
  return VU_ANG_MIN + (pct / 100) * (VU_ANG_MAX - VU_ANG_MIN);
}

function vuPt(r, angDeg){
  var rad = angDeg * Math.PI / 180;
  return {
    x: VU_CX + r * Math.sin(rad),
    y: VU_CY - r * Math.cos(rad)
  };
}

function arcPath(r, angStart, angEnd){
  var p1 = vuPt(r, angStart);
  var p2 = vuPt(r, angEnd);
  var span = angEnd - angStart;
  var laf = (span > 180) ? 1 : 0;
  return 'M ' + p1.x.toFixed(2) + ' ' + p1.y.toFixed(2) +
         ' A ' + r + ' ' + r + ' 0 ' + laf + ' 1 ' +
         p2.x.toFixed(2) + ' ' + p2.y.toFixed(2);
}

function buildVuMeter(svgId, isRight){
  var svg = document.getElementById(svgId);
  var ns = 'http://www.w3.org/2000/svg';

  function el(tag, attrs){
    var e = document.createElementNS(ns, tag);
    for(var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // pozadi oblouk
  svg.appendChild(el('path',{
    d: arcPath(VU_R, VU_ANG_MIN, VU_ANG_MAX),
    fill:'none', stroke:'rgba(255,255,255,0.07)', 'stroke-width':'12', 'stroke-linecap':'round'
  }));

  // VU stupnice: -20 az +3, zonove hranice v pct
  // -3 VU = pct 73.9%, 0 VU = pct 87%, +2 VU = pct 95.7%
  var zGreenEnd = VU_ANG_MIN + 0.739 * (VU_ANG_MAX - VU_ANG_MIN); // -3 VU
  var zYellEnd  = VU_ANG_MIN + 0.870 * (VU_ANG_MAX - VU_ANG_MIN); // 0 VU
  var zOrgEnd   = VU_ANG_MIN + 0.957 * (VU_ANG_MAX - VU_ANG_MIN); // +2 VU

  var zones = [
    {a0: VU_ANG_MIN, a1: zGreenEnd, color:'#00c853'},
    {a0: zGreenEnd,  a1: zYellEnd,  color:'#ffd400'},
    {a0: zYellEnd,   a1: zOrgEnd,   color:'#ff8c00'},
    {a0: zOrgEnd,    a1: VU_ANG_MAX, color:'#ff3c5a'}
  ];
  zones.forEach(function(z){
    svg.appendChild(el('path',{
      d: arcPath(VU_R, z.a0, z.a1),
      fill:'none', stroke: z.color, 'stroke-width':'12',
      'stroke-linecap':'butt', opacity:'0.55'
    }));
  });

  // Tick marks + labely
  // VU labely: -20,-10,-7,-5,-3,-2,-1,0,1,2,3
  var labels = [
    {vu:-20, pct:0},
    {vu:-10, pct:43.5},
    {vu:-7,  pct:56.5},
    {vu:-5,  pct:65.2},
    {vu:-3,  pct:73.9},
    {vu:-2,  pct:78.3},
    {vu:-1,  pct:82.6},
    {vu:0,   pct:87.0},
    {vu:1,   pct:91.3},
    {vu:2,   pct:95.7},
    {vu:3,   pct:100}
  ];
  var majorLabels = [-20,-10,-5,-3,0,3];
  var R_OUT = VU_R + 11;
  var R_IN_MAJ = VU_R - 8;
  var R_IN_MIN = VU_R - 5;
  var R_TXT = VU_R - 20;

  labels.forEach(function(lbl){
    var ang = vuPctToAngle(lbl.pct);
    var isMaj = majorLabels.indexOf(lbl.vu) !== -1;
    var pOuter = vuPt(R_OUT, ang);
    var pInner = vuPt(isMaj ? R_IN_MAJ : R_IN_MIN, ang);
    var col = lbl.pct >= 95.7 ? '#ff3c5a' : (lbl.pct >= 87.0 ? '#ff8c00' : (lbl.pct >= 73.9 ? '#ffd400' : '#5a7a60'));
    svg.appendChild(el('line',{
      x1: pOuter.x.toFixed(2), y1: pOuter.y.toFixed(2),
      x2: pInner.x.toFixed(2), y2: pInner.y.toFixed(2),
      stroke: col, 'stroke-width': isMaj ? '1.8' : '1.1'
    }));
    if(isMaj){
      var pTxt = vuPt(R_TXT, ang);
      var txt = el('text',{
        x: pTxt.x.toFixed(2), y: (pTxt.y + 3).toFixed(2),
        'text-anchor':'middle', fill: col,
        'font-size':'7.5', 'font-family':'monospace'
      });
      txt.textContent = lbl.vu > 0 ? ('+'+lbl.vu) : lbl.vu;
      svg.appendChild(txt);
    }
  });

  // "VU" label uprostred pod obloukem
  var vuTxt = el('text',{
    x:'100', y:'122', 'text-anchor':'middle',
    fill:'rgba(255,255,255,0.25)', 'font-size':'9', 'font-family':'monospace', 'letter-spacing':'3'
  });
  vuTxt.textContent = 'VU';
  svg.appendChild(vuTxt);

  // Ručička - wrapper g s CSS transition
  var grpId = svgId + '-grp';
  var g = document.createElementNS(ns, 'g');
  g.setAttribute('id', grpId);
  g.style.transformOrigin = VU_CX + 'px ' + VU_CY + 'px';
  g.style.transform = 'rotate(' + VU_ANG_MIN + 'deg)';
  g.style.transition = 'transform 120ms cubic-bezier(0.15,0.9,0.35,1)';

  // shadow
  var shadow = el('line',{
    x1: VU_CX, y1: VU_CY,
    x2: VU_CX, y2: (VU_CY - VU_R - 4),
    stroke: 'rgba(0,0,0,0.5)', 'stroke-width':'3', 'stroke-linecap':'round'
  });
  // hlavni ručicka
  var needle = el('line',{
    x1: VU_CX, y1: (VU_CY + 8),
    x2: VU_CX, y2: (VU_CY - VU_R - 4),
    stroke: isRight ? '#ffe080' : '#e8f8ff',
    'stroke-width':'1.8', 'stroke-linecap':'round'
  });
  g.appendChild(shadow);
  g.appendChild(needle);
  svg.appendChild(g);

  // pivot
  svg.appendChild(el('circle',{
    cx: VU_CX, cy: VU_CY, r:'5',
    fill:'#1a2030', stroke:'#556677', 'stroke-width':'1.5'
  }));
  // pivot stred
  svg.appendChild(el('circle',{
    cx: VU_CX, cy: VU_CY, r:'2',
    fill:'#889'
  }));
}

buildVuMeter('vu-svg-l', false);
buildVuMeter('vu-svg-r', true);

function updateVuNeedle(svgId, valId, pct){
  var c = Math.max(0, Math.min(100, pct));
  var ang = vuPctToAngle(c);
  var g = document.getElementById(svgId + '-grp');
  if(g) g.style.transform = 'rotate(' + ang.toFixed(1) + 'deg)';
  var vu = -20 + c * 23 / 100;
  var el = document.getElementById(valId);
  if(el) el.textContent = (vu >= 0 ? '+' : '') + vu.toFixed(1);
}

// ---- Audio init ----
async function loadDevices(){
  try{
    var tmp = await navigator.mediaDevices.getUserMedia({audio:true});
    tmp.getTracks().forEach(function(t){t.stop();});
    var devs = await navigator.mediaDevices.enumerateDevices();
    var sel = document.getElementById('dev-select');
    sel.innerHTML = '<option value="">-- vyber audio vstup --</option>';
    devs.forEach(function(d){
      if(d.kind === 'audioinput'){
        var opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || ('Mikrofon ' + d.deviceId.substring(0,8));
        if(d.label && (d.label.indexOf('ES4') !== -1 || d.label.indexOf('PreSonus') !== -1 || d.label.indexOf('Presonus') !== -1)){
          opt.selected = true;
        }
        sel.appendChild(opt);
      }
    });
  }catch(e){
    setMode('offline','NENI POVOLENI');
  }
}
loadDevices();

function bandEnergy(dataArray, sampleRate, freqLow, freqHigh){
  var binCount = dataArray.length;
  var binSize = sampleRate / FFT_SIZE;
  var lo = Math.max(1, Math.round(freqLow / binSize));
  var hi = Math.min(Math.round(freqHigh / binSize), binCount - 1);
  if(hi < lo) hi = lo;
  var sum = 0;
  for(var i = lo; i <= hi; i++){
    var v = (dataArray[i] / 255.0);
    sum += v * v;
  }
  return Math.sqrt(sum / (hi - lo + 1));
}

function setMode(cls, txt){
  var el = document.getElementById('mode');
  el.className = 'status-mode ' + cls;
  el.textContent = txt;
}

async function startAudio(){
  if(running){ stopAudio(); return; }
  var devId = document.getElementById('dev-select').value;
  try{
    setMode('wait','SPOUSTIM...');
    document.getElementById('btn-start').disabled=true;
    document.getElementById('btn-start').textContent='...CEKEJ...';
    var audioConstraints = {
      echoCancellation:false, noiseSuppression:false,
      autoGainControl:false, sampleRate:48000
    };
    if(devId){ audioConstraints.deviceId = {exact: devId}; }
    stream = await navigator.mediaDevices.getUserMedia({audio: audioConstraints});
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({sampleRate:48000});
    var source = audioCtx.createMediaStreamSource(stream);
    var splitter = audioCtx.createChannelSplitter(2);
    source.connect(splitter);

    analyserL = audioCtx.createAnalyser();
    analyserL.fftSize = FFT_SIZE;
    analyserL.smoothingTimeConstant = 0.1;
    analyserL.minDecibels = -70;
    analyserL.maxDecibels = -10;

    analyserR = audioCtx.createAnalyser();
    analyserR.fftSize = FFT_SIZE;
    analyserR.smoothingTimeConstant = 0.1;
    analyserR.minDecibels = -70;
    analyserR.maxDecibels = -10;

    splitter.connect(analyserL, 0);
    splitter.connect(analyserR, 1);

    running = true;
    document.getElementById('btn-start').disabled=false;
    document.getElementById('btn-start').textContent = 'STOP';
    document.getElementById('btn-start').classList.add('active');
    document.getElementById('btn-reset').disabled=false;
    setMode('live','ANALYZUJE');
    rafLoop();
  }catch(e){
    setMode('offline','CHYBA: ' + e.message);
    document.getElementById('btn-start').disabled=false;
    document.getElementById('btn-start').textContent='\u25B6 SPUSTIT ANALYZU';
    console.error(e);
  }
}

function stopAudio(){
  running = false;
  if(rafId) cancelAnimationFrame(rafId);
  if(stream) stream.getTracks().forEach(function(t){t.stop();});
  if(audioCtx) audioCtx.close();
  audioCtx = null; analyserL = null; analyserR = null; stream = null;
  document.getElementById('btn-start').textContent = '\u25B6 SPUSTIT ANALYZU';
  document.getElementById('btn-start').classList.remove('active');
  document.getElementById('btn-reset').disabled=true;
  setMode('wait','ZASTAVENO');
  for(var b=0;b<BANDS;b++){
    smoothL[b]=0; smoothR[b]=0;
    peakHoldL[b]=0; peakHoldR[b]=0;
    document.getElementById('bars-l-fill-'+b).style.height='0%';
    document.getElementById('bars-r-fill-'+b).style.height='0%';
    document.getElementById('bars-l-peak-'+b).style.bottom='0%';
    document.getElementById('bars-r-peak-'+b).style.bottom='0%';
  }
  vuSmL = 0; vuSmR = 0;
  updateVuNeedle('vu-svg-l', 'vu-l-val', 0);
  updateVuNeedle('vu-svg-r', 'vu-r-val', 0);
  document.getElementById('vu-l-val').textContent = '-\u221e';
  document.getElementById('vu-r-val').textContent = '-\u221e';
}

function resetPeak(){
  for(var b=0;b<BANDS;b++){
    peakHoldL[b]=0; peakHoldR[b]=0;
    peakTimerL[b]=0; peakTimerR[b]=0;
    document.getElementById('bars-l-peak-'+b).style.bottom='0%';
    document.getElementById('bars-r-peak-'+b).style.bottom='0%';
  }
  document.getElementById('peak-l').textContent='0';
  document.getElementById('peak-r').textContent='0';
}

var dataL = null;
var dataR = null;

function rafLoop(){
  if(!running){ return; }
  rafId = requestAnimationFrame(rafLoop);
  if(!analyserL || !analyserR) return;
  if(!dataL) dataL = new Uint8Array(analyserL.frequencyBinCount);
  if(!dataR) dataR = new Uint8Array(analyserR.frequencyBinCount);

  analyserL.getByteFrequencyData(dataL);
  analyserR.getByteFrequencyData(dataR);

  var sr = audioCtx.sampleRate;
  var maxL = 0, maxR = 0;
  var now = Date.now();

  for(var b = 0; b < BANDS; b++){
    var lRaw = bandEnergy(dataL, sr, FREQ_BOUNDS[b], FREQ_BOUNDS[b+1]) * 100;
    var rRaw = bandEnergy(dataR, sr, FREQ_BOUNDS[b], FREQ_BOUNDS[b+1]) * 100;

    lRaw = Math.min(100, lRaw * 1.6);
    rRaw = Math.min(100, rRaw * 1.6);

    var aL = lRaw > smoothL[b] ? SMOOTH_UP : SMOOTH_DOWN;
    var aR = rRaw > smoothR[b] ? SMOOTH_UP : SMOOTH_DOWN;
    smoothL[b] = smoothL[b] + aL * (lRaw - smoothL[b]);
    smoothR[b] = smoothR[b] + aR * (rRaw - smoothR[b]);

    var lVal = smoothL[b];
    var rVal = smoothR[b];

    document.getElementById('bars-l-fill-'+b).style.height = lVal.toFixed(1)+'%';
    document.getElementById('bars-r-fill-'+b).style.height = rVal.toFixed(1)+'%';

    if(lVal >= peakHoldL[b]){ peakHoldL[b]=lVal; peakTimerL[b]=now; }
    else if(now - peakTimerL[b] > PEAK_HOLD_MS){ peakHoldL[b] *= PEAK_DECAY; }
    if(rVal >= peakHoldR[b]){ peakHoldR[b]=rVal; peakTimerR[b]=now; }
    else if(now - peakTimerR[b] > PEAK_HOLD_MS){ peakHoldR[b] *= PEAK_DECAY; }

    document.getElementById('bars-l-peak-'+b).style.bottom = peakHoldL[b].toFixed(1)+'%';
    document.getElementById('bars-r-peak-'+b).style.bottom = peakHoldR[b].toFixed(1)+'%';

    if(lVal > maxL) maxL = lVal;
    if(rVal > maxR) maxR = rVal;
  }

  document.getElementById('peak-l').textContent = maxL.toFixed(0);
  document.getElementById('peak-r').textContent = maxR.toFixed(0);
  document.getElementById('hb').textContent = new Date().toLocaleTimeString('cs-CZ');

  // VU analogova ballistics
  vuSmL += (maxL > vuSmL ? VU_UP : VU_DOWN) * (maxL - vuSmL);
  vuSmR += (maxR > vuSmR ? VU_UP : VU_DOWN) * (maxR - vuSmR);
  updateVuNeedle('vu-svg-l', 'vu-l-val', vuSmL);
  updateVuNeedle('vu-svg-r', 'vu-r-val', vuSmR);
}
</script>
