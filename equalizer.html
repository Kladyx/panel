<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="version" content="v3.1.Kl">
<title>Stereo VU Equalizer v3.1.Kl</title>
<style>
:root{
  --bg:#0a0e14;
  --panel:#0e1420;
  --grid:rgba(0,200,255,0.08);
  --text:#bdc7d5;
  --label:#5a6680;
  --cyan:#00d4ff;
  --green:#00ff7e;
  --yellow:#ffd400;
  --orange:#ff8c00;
  --red:#ff3c5a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'JetBrains Mono','Courier New',monospace;background:var(--bg);color:var(--text);min-height:100vh;padding:14px;}
.header{text-align:center;padding:8px 0 14px;}
.title{font-size:18px;color:var(--cyan);letter-spacing:6px;font-weight:600;text-shadow:0 0 12px rgba(0,212,255,0.5);}
.sub{font-size:10px;color:var(--label);letter-spacing:3px;margin-top:4px;}
.dot-live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);margin-right:5px;animation:pulse 1.4s infinite ease-in-out;vertical-align:middle;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

.status{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--panel);border:1px solid rgba(0,212,255,0.15);border-radius:6px;margin-bottom:12px;font-size:11px;}
.status-mode{font-weight:600;letter-spacing:1px;}
.status-mode.live{color:var(--green);}
.status-mode.fake{color:var(--cyan);}
.status-mode.offline{color:var(--red);}

/* VU METR - profi DJ styl */
.vu-wrap{background:var(--panel);border:1px solid rgba(0,212,255,0.15);border-radius:8px;padding:18px 14px;position:relative;}
.vu-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}

/* dB stupnice */
.scale{display:flex;flex-direction:column;justify-content:space-between;height:240px;font-size:9px;color:var(--label);padding:2px 0;text-align:right;width:22px;}
.scale span{line-height:1;}

/* Kanal L/R blok */
.channel{flex:1;display:flex;flex-direction:column;align-items:center;}
.ch-label{font-size:12px;color:var(--cyan);letter-spacing:2px;margin-bottom:10px;font-weight:600;}
.ch-label.r{color:var(--red);}

/* 8 sloupcu v ramci kanalu */
.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;height:240px;width:100%;}
.bar-col{position:relative;height:100%;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);overflow:hidden;}
/* PLYNULY SLOUPEC - jeden gradient, ne dilky */
.bar-fill{position:absolute;bottom:0;left:0;right:0;height:0%;background:linear-gradient(to top,
  var(--green) 0%,
  var(--green) 50%,
  var(--yellow) 70%,
  var(--orange) 85%,
  var(--red) 100%);
  transition:height 180ms cubic-bezier(0.25,0.1,0.25,1);
  box-shadow:0 0 8px rgba(0,255,126,0.4);
}
/* Peak hold cara */
.bar-peak{position:absolute;left:0;right:0;height:2px;background:#fff;box-shadow:0 0 4px #fff;transition:bottom 300ms linear;opacity:0.9;}

/* Frekvencni stitky */
.freq-row{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px;width:100%;}
.freq-row span{font-size:8px;color:var(--label);text-align:center;}

/* Spodni info */
.info-row{display:flex;justify-content:space-between;margin-top:14px;font-size:10px;color:var(--label);letter-spacing:1px;}
.peak-val{color:var(--cyan);font-weight:600;}

/* Tlacitko prepnuti modu */
.btn-mode{margin-top:14px;width:100%;padding:11px;background:transparent;border:1px solid var(--cyan);color:var(--cyan);font-family:inherit;font-size:11px;letter-spacing:3px;border-radius:6px;cursor:pointer;transition:all 0.2s;}
.btn-mode:hover{background:rgba(0,212,255,0.1);}

.footer{text-align:center;font-size:9px;color:#2a3142;letter-spacing:3px;margin-top:18px;}
</style>
</head>
<body>

<div class="header">
  <div class="title">♪ STEREO VU EQUALIZER ♪</div>
  <div class="sub"><span class="dot-live"></span>KLADYXLAND · PRESONUS ES4 · v3.1.Kl</div>
</div>

<div class="status">
  <div>MODE: <span class="status-mode fake" id="mode">FAKE DEMO</span></div>
  <div id="hb">— —</div>
</div>

<div class="vu-wrap">
  <div class="vu-row">
    <!-- Leva dB stupnice -->
    <div class="scale">
      <span>0</span>
      <span>-15</span>
      <span>-30</span>
      <span>-45</span>
      <span>-60</span>
    </div>
    
    <!-- L kanal -->
    <div class="channel">
      <div class="ch-label">◄ L</div>
      <div class="bars" id="bars-l"></div>
      <div class="freq-row">
        <span>60</span><span>150</span><span>400</span><span>1k</span>
        <span>2.4k</span><span>6k</span><span>12k</span><span>16k</span>
      </div>
    </div>
    
    <!-- R kanal -->
    <div class="channel">
      <div class="ch-label r">R ►</div>
      <div class="bars" id="bars-r"></div>
      <div class="freq-row">
        <span>60</span><span>150</span><span>400</span><span>1k</span>
        <span>2.4k</span><span>6k</span><span>12k</span><span>16k</span>
      </div>
    </div>
    
    <!-- Prava dB stupnice -->
    <div class="scale">
      <span>0</span>
      <span>-15</span>
      <span>-30</span>
      <span>-45</span>
      <span>-60</span>
    </div>
  </div>
  
  <div class="info-row">
    <div>PEAK L: <span class="peak-val" id="peak-l">0</span></div>
    <div>PEAK R: <span class="peak-val" id="peak-r">0</span></div>
  </div>
</div>

<button class="btn-mode" id="btn-mode">↻ PŘEPNOUT MODE (FAKE / LIVE)</button>

<div class="footer">FFT 8 BANDS · PEAK METER · KLADYXLAND 2026</div>

<script>
var FB='https://kladyxland-default-rtdb.europe-west1.firebasedatabase.app';
var BANDS = 8;
var MAX_AGE_MS = 5000;
var FAKE_MODE = true;

// Peak hold per pasmo
var peakHoldL = new Array(BANDS).fill(0);
var peakHoldR = new Array(BANDS).fill(0);
var peakDecayL = new Array(BANDS).fill(0);
var peakDecayR = new Array(BANDS).fill(0);

// Vytvor sloupce
function buildBars(containerId){
  var c = document.getElementById(containerId);
  c.innerHTML = '';
  for(var b=0; b<BANDS; b++){
    var col = document.createElement('div');
    col.className = 'bar-col';
    var fill = document.createElement('div');
    fill.className = 'bar-fill';
    fill.id = containerId + '-fill-' + b;
    var peak = document.createElement('div');
    peak.className = 'bar-peak';
    peak.id = containerId + '-peak-' + b;
    peak.style.bottom = '0%';
    col.appendChild(fill);
    col.appendChild(peak);
    c.appendChild(col);
  }
}

buildBars('bars-l');
buildBars('bars-r');

// Aktualizuj sloupce - plynule
function updateBars(L, R){
  var maxL = 0, maxR = 0;
  for(var b=0; b<BANDS; b++){
    var lVal = Math.max(0, Math.min(100, L[b]));
    var rVal = Math.max(0, Math.min(100, R[b]));
    
    // Plynula vyska sloupce
    document.getElementById('bars-l-fill-' + b).style.height = lVal + '%';
    document.getElementById('bars-r-fill-' + b).style.height = rVal + '%';
    
    // Peak hold - drzi nejvyssi hodnotu s pomalym poklesem
    if(lVal > peakHoldL[b]){ peakHoldL[b] = lVal; peakDecayL[b] = 0; }
    else { peakDecayL[b]++; if(peakDecayL[b] > 8) peakHoldL[b] = Math.max(0, peakHoldL[b] - 0.8); }
    
    if(rVal > peakHoldR[b]){ peakHoldR[b] = rVal; peakDecayR[b] = 0; }
    else { peakDecayR[b]++; if(peakDecayR[b] > 8) peakHoldR[b] = Math.max(0, peakHoldR[b] - 0.8); }
    
    document.getElementById('bars-l-peak-' + b).style.bottom = peakHoldL[b] + '%';
    document.getElementById('bars-r-peak-' + b).style.bottom = peakHoldR[b] + '%';
    
    if(lVal > maxL) maxL = lVal;
    if(rVal > maxR) maxR = rVal;
  }
  document.getElementById('peak-l').textContent = Math.round(maxL);
  document.getElementById('peak-r').textContent = Math.round(maxR);
}

// FAKE generator - simuluje hudbu
var fakePhase = 0;
function generateFake(){
  var L = [], R = [];
  fakePhase += 0.08;
  for(var b=0; b<BANDS; b++){
    var weight = b<2 ? 70 : (b<5 ? 55 : 40);
    var lVal = weight + Math.sin(fakePhase + b*0.7) * 22 + Math.random() * 12;
    var rVal = weight + Math.sin(fakePhase + b*0.7 + 0.4) * 22 + Math.random() * 12;
    L.push(Math.max(0, Math.min(100, lVal)));
    R.push(Math.max(0, Math.min(100, rVal)));
  }
  return {L:L, R:R};
}

// Cti z Firebase
function fetchLive(cb){
  var url = FB + '/audio_spectrum.json?ts=' + Date.now();
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.timeout = 2000;
  xhr.onreadystatechange = function(){
    if(xhr.readyState === 4){
      if(xhr.status === 200){
        try{ cb(JSON.parse(xhr.responseText)); }
        catch(e){ cb(null); }
      } else cb(null);
    }
  };
  xhr.send();
}

// Hlavni loop
function tick(){
  if(FAKE_MODE){
    var d = generateFake();
    updateBars(d.L, d.R);
    document.getElementById('mode').textContent = 'FAKE DEMO';
    document.getElementById('mode').className = 'status-mode fake';
    document.getElementById('hb').textContent = 'simulace';
    return;
  }
  
  fetchLive(function(data){
    if(!data || !data.L || !data.R){
      document.getElementById('mode').textContent = 'OFFLINE';
      document.getElementById('mode').className = 'status-mode offline';
      document.getElementById('hb').textContent = 'cekam...';
      return;
    }
    var age = Date.now() - (data.ts || 0);
    if(age > MAX_AGE_MS){
      document.getElementById('mode').textContent = 'OFFLINE (stara data)';
      document.getElementById('mode').className = 'status-mode offline';
      document.getElementById('hb').textContent = Math.round(age/1000) + 's';
      return;
    }
    updateBars(data.L, data.R);
    document.getElementById('mode').textContent = 'LIVE · ' + age + 'ms';
    document.getElementById('mode').className = 'status-mode live';
    var now = new Date();
    document.getElementById('hb').textContent = 
      String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0') + ':' +
      String(now.getSeconds()).padStart(2,'0');
  });
}

// Tlacitko prepnuti
document.getElementById('btn-mode').onclick = function(){
  FAKE_MODE = !FAKE_MODE;
  tick();
};

// Start - 50ms = 20 FPS
setInterval(tick, 50);
tick();
</script>

</body>
</html>
