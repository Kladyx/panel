<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050810">
  <title>KLADYX PANEL v7.6 - s E-knihami</title>
  <style>
    /* ===== PŮVODNÍ KLADYX STYLES ===== */
    #panel-gate {
      position: fixed; inset: 0; z-index: 99999;
      background: #050810;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px; transition: opacity 0.4s;
      overflow: hidden;
    }
    #panel-gate.hidden { opacity: 0; pointer-events: none; }
    .gate-logo { font-size: 2.2rem; font-weight: 900; letter-spacing: 8px; color: #00d4ff; text-shadow: 0 0 30px #00d4ff; }
    .gate-sub { font-size: 0.6rem; letter-spacing: 4px; color: #5a6488; text-transform: uppercase; margin-top: -18px; }
    .gate-btn { display: flex; align-items: center; gap: 12px; padding: 14px 28px; border: 1px solid rgba(0,212,255,0.3); background: rgba(0,212,255,0.06); color: #dde4ff; font-family: "Courier New", monospace; font-size: 0.85rem; letter-spacing: 2px; cursor: pointer; border-radius: 6px; }
    .gate-btn:hover { background: rgba(0,212,255,0.14); }
    .gate-status { font-size: 0.6rem; letter-spacing: 2px; color: #5a6488; min-height: 16px; }
    .gate-err { color: #ff3c5a; }
    #signout-btn { display: none; font-family: "Courier New", monospace; font-size: 0.55rem; letter-spacing: 1px; padding: 3px 10px; border: 1px solid rgba(0,255,120,0.3); background: transparent; color: #00ff78; cursor: pointer; border-radius: 3px; margin-left: 8px; }
    
    @keyframes starPulse {
      0%, 100% { opacity: 0.15; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(2.2); box-shadow: 0 0 8px #00f5ff, 0 0 16px rgba(0, 245, 255, 0.5), 0 0 24px rgba(0, 245, 255, 0.2); }
    }
    
    .star-container {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #00a0ff;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: starPulse 2s ease-in-out infinite;
      will-change: opacity, transform;
      pointer-events: none;
      z-index: 0;
    }
    
    .star-container.big {
      width: 8px;
      height: 8px;
    }

    #main-stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    #main-stars .star-container {
      position: absolute;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg:#050810; --sidebar:#080d1c; --cyan:#00d4ff; --muted:#5a6488; --light:#dde4ff; --card:#0d1428; }
    html,body { width:100%; height:100%; background:var(--bg); font-family:"Courier New",monospace; color:var(--light); overflow:hidden; }
    body::before {
      content:'';
      position:fixed;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      width:60vmin; height:60vmin;
      border-radius:50%;
      background:radial-gradient(circle,rgba(0,212,255,0.08) 0%,transparent 70%);
      filter:blur(40px);
      opacity:0.08;
      pointer-events:none;
      z-index:0;
    }
    .layout { display:flex; flex-direction:column; height:100vh; height:100dvh; }
    .topbar { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--sidebar); border-bottom:1px solid rgba(0,212,255,0.2); flex-shrink:0; z-index:10; overflow-x:scroll; -webkit-overflow-scrolling:touch; scrollbar-width:none; touch-action:pan-x; }
    .topbar::-webkit-scrollbar { display:none; }
    .tlogo { font-size:0.7rem; font-weight:bold; letter-spacing:3px; color:var(--cyan); text-shadow:0 0 10px var(--cyan); white-space:nowrap; flex-shrink:0; }
    .tlogo span { font-size:0.48rem; color:var(--muted); letter-spacing:1px; display:block; }
    .tdiv { width:1px; height:24px; background:rgba(0,212,255,0.15); flex-shrink:0; }
    .app-btn { display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 9px; background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.07); border-radius:7px; cursor:pointer; transition:all 0.2s; white-space:nowrap; flex-shrink:0; position:relative; min-width:54px; }
    .app-btn:hover { border-color:rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); }
    .app-btn.active { border-color:var(--ac); background:rgba(var(--ac-rgb),0.12); box-shadow:0 0 12px rgba(var(--ac-rgb),0.25); }
    .bi { font-size:1.1rem; line-height:1; }
    .bl { font-size:0.52rem; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
    .app-btn.active .bl { color:var(--ac); }
    .bd { position:absolute; top:4px; right:5px; width:4px; height:4px; border-radius:50%; background:#00ff88; box-shadow:0 0 5px #00ff88; opacity:0; transition:opacity 0.3s; }
    .app-btn.active .bd { opacity:1; }
    .iframe-wrap { flex:1; position:relative; overflow:hidden; background:transparent; z-index:0; }
    /* E-KNIHY APP - vlastní background bez hvězdiček */
    #app-ebook {
      background: var(--bg);
      z-index: 1;
    }

    /* Ostatní apky - transparentní aby byly vidět hvězdičky */
    .app-frame { position:absolute; inset:0; width:100%; height:100%; border:none; opacity:0; pointer-events:none; transition:opacity 0.25s; background:transparent; z-index:1; }
    .app-frame.visible { opacity:1; pointer-events:all; touch-action:auto; z-index:2; }
    .welcome { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:14px; padding:20px; padding-top:max(20px,8vh); text-align:center; overflow-y:auto; -webkit-overflow-scrolling:touch; transition:opacity 0.3s; }
    .welcome.hidden { opacity:0; pointer-events:none; }

    /* ===== E-KNIHY STYLES ===== */
    .ebook-reader {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: var(--bg);
    }

    .ebook-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--sidebar);
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
      gap: 12px;
    }

    .ebook-title {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--cyan);
      text-shadow: 0 0 10px var(--cyan);
      font-weight: bold;
    }

    .ebook-controls {
      display: flex;
      gap: 8px;
    }

    .ebook-btn {
      padding: 4px 10px;
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.3);
      color: var(--light);
      cursor: pointer;
      border-radius: 4px;
      font-family: "Courier New", monospace;
      font-size: 0.65rem;
      transition: all 0.2s;
    }

    .ebook-btn:hover {
      background: rgba(0, 212, 255, 0.2);
      border-color: var(--cyan);
    }

    .library-view {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: none;
    }

    .library-view.active {
      display: block;
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .library-header h2 {
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    .upload-btn {
      padding: 6px 12px;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: #00ff88;
      cursor: pointer;
      border-radius: 4px;
      font-family: "Courier New", monospace;
      font-size: 0.65rem;
    }

    .upload-btn:hover {
      background: rgba(0, 255, 136, 0.2);
    }

    #fileInput {
      display: none;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
    }

    .book-card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .book-card:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.2);
    }

    .book-cover {
      width: 100%;
      aspect-ratio: 3/4;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 255, 136, 0.1));
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .book-title {
      font-weight: bold;
      color: var(--light);
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      font-size: 0.6rem;
    }

    .book-author {
      color: var(--muted);
      font-size: 0.5rem;
    }

    .book-delete {
      font-size: 0.5rem;
      color: #ff3c5a;
      cursor: pointer;
      padding: 2px;
      border: 1px solid rgba(255, 60, 90, 0.3);
      border-radius: 2px;
      text-align: center;
      background: rgba(255, 60, 90, 0.05);
    }

    .reader-view {
      flex: 1;
      overflow: hidden;
      display: none;
      flex-direction: column;
    }

    .reader-view.active {
      display: flex;
    }

    .reader-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      line-height: 1.7;
      font-size: 1rem;
    }

    .reader-content h1, .reader-content h2, .reader-content h3 {
      margin-top: 16px;
      margin-bottom: 8px;
      color: var(--cyan);
    }

    .reader-content p {
      margin-bottom: 10px;
    }

    .reader-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--sidebar);
      border-top: 1px solid rgba(0, 212, 255, 0.2);
      gap: 10px;
      font-size: 0.65rem;
      flex-wrap: wrap;
    }

    .reader-nav {
      display: flex;
      gap: 6px;
    }

    .settings-group {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 3px;
    }

    .settings-group label {
      font-size: 0.6rem;
      color: var(--muted);
    }

    .settings-group input {
      width: 35px;
      padding: 2px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 212, 255, 0.2);
      color: var(--light);
      border-radius: 2px;
      font-family: "Courier New", monospace;
      font-size: 0.6rem;
    }
  </style>
</head>
<body>

<div id="panel-gate">
  <div class="gate-logo">KLADYX</div>
  <div class="gate-sub">Control Panel · Private Access</div>
  <button class="gate-btn" onclick="googleSignIn()">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    PŘIHLÁSIT SE PŘEZ GOOGLE
  </button>
  <div class="gate-status" id="gate-status"></div>
</div>

<div id="main-stars"></div>

<div class="layout">
  <div class="topbar">
    <div class="tlogo">▬ KLADYX PANEL<span>v7.5</span></div>
    <div class="tdiv"></div>
    <button class="app-btn" id="btn-home" style="--ac:#00d4ff;--ac-rgb:0,212,255" onclick="goHome()">
      <div class="bd"></div><div class="bi">🏠</div><div class="bl">Domů</div>
    </button>
    <div class="tdiv"></div>
    <button class="app-btn" id="btn-ebook" style="--ac:#f5a623;--ac-rgb:245,166,35" onclick="openApp('ebook')">
      <div class="bd"></div><div class="bi">📚</div><div class="bl">E-Knihy</div>
    </button>
    <div class="tdiv"></div>
    <button id="signout-btn" onclick="googleSignOut()">⏻ ODHLÁSIT</button>
  </div>

  <div class="iframe-wrap">
    <div class="welcome" id="welcome">
      <div style="font-size:1.7rem;font-weight:bold;letter-spacing:6px;color:var(--cyan);text-shadow:0 0 25px var(--cyan);">KLADYX</div>
      <div style="font-size:0.6rem;letter-spacing:3px;color:var(--muted);">CONTROL PANEL — VYBERTE APLIKACI</div>
    </div>

    <!-- E-KNIHY APP -->
    <div class="app-frame" id="app-ebook">
      <div class="ebook-reader">
        <div class="ebook-header">
          <div class="ebook-title">📚 E-KNIHY</div>
          <div class="ebook-controls">
            <button class="ebook-btn" id="libBtn" onclick="showLibrary()">KNIHOVNA</button>
          </div>
        </div>

        <!-- KNIHOVNA -->
        <div class="library-view active" id="libraryView">
          <div class="library-header">
            <h2>Moje knihy</h2>
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">+ NAHRÁT</button>
            <input type="file" id="fileInput" accept=".epub,.pdf" onchange="uploadBook(event)">
          </div>
          <div class="books-grid" id="booksGrid"></div>
        </div>

        <!-- ČTEČKA -->
        <div class="reader-view" id="readerView">
          <div class="ebook-header">
            <span style="cursor:pointer;color:var(--cyan);" onclick="showLibrary()">← KNIHOVNA</span>
            <span id="bookTitle" style="font-size:0.65rem;"></span>
            <span style="color:var(--muted);font-size:0.6rem;"><span id="currentPage">0</span> / <span id="totalPages">0</span></span>
          </div>
          <div class="reader-content" id="readerContent"></div>
          <div class="reader-footer">
            <div class="reader-nav">
              <button class="ebook-btn" onclick="prevPage()">← Předchozí</button>
              <button class="ebook-btn" onclick="nextPage()">Další →</button>
            </div>
            <div class="settings-group">
              <label>Font:</label>
              <input type="range" id="fontSizeSlider" min="12" max="20" value="16" onchange="changeFontSize()">
              <span id="fontSizeValue" style="font-size:0.6rem;">16</span>px
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- KNIHOVNY EPUB.JS & PDF.JS -->
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.88/dist/epub.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
// ===== KLADYX CORE =====
let _gateAuth = null;
const currentYear = new Date().getFullYear();

function openApp(appName) {
  document.querySelectorAll('.app-frame').forEach(f => f.classList.remove('visible'));
  document.querySelectorAll('.app-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('app-' + appName).classList.add('visible');
  document.getElementById('btn-' + appName).classList.add('active');
  document.getElementById('welcome').classList.add('hidden');
}

function goHome() {
  document.querySelectorAll('.app-frame').forEach(f => f.classList.remove('visible'));
  document.querySelectorAll('.app-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('welcome').classList.remove('hidden');
}

function unlockPanel() {
  var gate = document.getElementById('panel-gate');
  gate.classList.add('hidden');
  setTimeout(function() { gate.style.display = 'none'; }, 400);
  var sb = document.getElementById('signout-btn');
  if (sb) sb.style.display = 'inline-block';
}

function lockPanel() {
  var gate = document.getElementById('panel-gate');
  gate.style.display = 'flex';
  gate.classList.remove('hidden');
  var sb = document.getElementById('signout-btn');
  if (sb) sb.style.display = 'none';
}

function googleSignIn() {
  if (!_gateAuth) {
    document.getElementById('gate-status').textContent = 'Načítám...';
    return;
  }
  document.getElementById('gate-status').textContent = 'Přihlašuji...';
  document.getElementById('gate-status').className = 'gate-status';
  _gateAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e) {
    document.getElementById('gate-status').textContent = 'Chyba: ' + e.message;
    document.getElementById('gate-status').className = 'gate-status gate-err';
  });
}

function googleSignOut() {
  if (_gateAuth) _gateAuth.signOut().then(function() { location.reload(); });
}

// FIREBASE INIT (dummy)
window._gateAuth = { signInWithPopup: () => {}, signOut: () => {} };

// ===== E-KNIHY =====
let currentBook = null;
let currentReader = null;
let books = [];
let currentBookIndex = 0;
let fontSize = parseInt(localStorage.getItem('fontSize')) || 16;

const dbName = 'EbookReaderDB';
const storeName = 'books';

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(dbName, 1);
    request.onerror = () => reject(request.error);
    request.onsuccess = () => resolve(request.result);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(storeName)) {
        db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
      }
    };
  });
}

async function saveBook(file, metadata) {
  const db = await initDB();
  const arrayBuffer = await file.arrayBuffer();
  const book = {
    id: Date.now(),
    filename: file.name,
    filetype: file.name.split('.').pop().toLowerCase(),
    arrayBuffer: arrayBuffer,
    metadata: metadata,
    progress: 0,
    timestamp: new Date()
  };
  
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    const request = store.add(book);
    request.onsuccess = () => resolve(book);
    request.onerror = () => reject(request.error);
  });
}

async function loadBooks() {
  const db = await initDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const request = store.getAll();
    request.onsuccess = () => {
      books = request.result;
      renderLibrary();
      resolve(books);
    };
    request.onerror = () => reject(request.error);
  });
}

async function deleteBook(bookId) {
  const db = await initDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    const request = store.delete(bookId);
    request.onsuccess = () => {
      loadBooks();
      resolve();
    };
    request.onerror = () => reject(request.error);
  });
}

async function uploadBook(event) {
  const file = event.target.files[0];
  if (!file) return;

  const metadata = {
    title: file.name.replace(/\.[^/.]+$/, ''),
    author: 'Neznámý autor'
  };

  try {
    await saveBook(file, metadata);
    loadBooks();
  } catch (err) {
    alert('Chyba: ' + err.message);
  }
}

function renderLibrary() {
  const grid = document.getElementById('booksGrid');
  grid.innerHTML = books.map((book, idx) => `
    <div class="book-card" onclick="openBook(${idx})">
      <div class="book-cover">📖</div>
      <div class="book-title">${book.metadata.title}</div>
      <div class="book-author">${book.metadata.author}</div>
      <div class="book-delete" onclick="event.stopPropagation(); deleteBook(${book.id})">🗑️</div>
    </div>
  `).join('');
}

async function openBook(index) {
  currentBookIndex = index;
  const book = books[index];
  const filetype = book.filetype.toLowerCase();

  document.getElementById('bookTitle').textContent = book.metadata.title;
  document.getElementById('libraryView').classList.remove('active');
  document.getElementById('readerView').classList.add('active');

  if (filetype === 'epub') {
    openEPUB(book);
  } else if (filetype === 'pdf') {
    openPDF(book);
  }
}

async function openEPUB(book) {
  const blob = new Blob([book.arrayBuffer], { type: 'application/epub+zip' });
  const url = URL.createObjectURL(blob);

  currentReader = ePub(url, { openAs: 'epub' });
  
  await currentReader.ready;
  
  const spine = currentReader.spine.spineItems.length;
  document.getElementById('totalPages').textContent = spine;

  currentReader.display(book.progress).then(() => {
    updateProgress();
  });
}

async function openPDF(book) {
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(book.arrayBuffer) }).promise;
  document.getElementById('totalPages').textContent = pdf.numPages;
  
  let currentPageNum = Math.max(1, Math.ceil(book.progress));
  
  async function renderPage(num) {
    const page = await pdf.getPage(num);
    const scale = 1.5;
    const viewport = page.getViewport({ scale });
    
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    
    const content = document.getElementById('readerContent');
    content.innerHTML = '';
    content.appendChild(canvas);
    
    document.getElementById('currentPage').textContent = num;
    books[currentBookIndex].progress = num / pdf.numPages;
  }

  currentReader = { pdf, currentPageNum, renderPage };
  renderPage(currentPageNum);
}

function nextPage() {
  if (!currentReader) return;
  
  if (currentReader.next) {
    currentReader.next().then(() => updateProgress());
  } else {
    currentReader.currentPageNum++;
    if (currentReader.currentPageNum <= currentReader.pdf.numPages) {
      currentReader.renderPage(currentReader.currentPageNum);
    } else {
      currentReader.currentPageNum--;
    }
  }
}

function prevPage() {
  if (!currentReader) return;
  
  if (currentReader.prev) {
    currentReader.prev().then(() => updateProgress());
  } else {
    currentReader.currentPageNum--;
    if (currentReader.currentPageNum >= 1) {
      currentReader.renderPage(currentReader.currentPageNum);
    } else {
      currentReader.currentPageNum++;
    }
  }
}

function updateProgress() {
  if (currentReader && currentReader.location) {
    const progress = currentReader.book.locations.percentageFromCfi(currentReader.location.start.cfi);
    document.getElementById('currentPage').textContent = Math.round(progress * 100) + '%';
    books[currentBookIndex].progress = progress;
  }
}

function changeFontSize() {
  const size = document.getElementById('fontSizeSlider').value;
  fontSize = size;
  localStorage.setItem('fontSize', size);
  document.getElementById('fontSizeValue').textContent = size;
  document.getElementById('readerContent').style.fontSize = size + 'px';
}

function showLibrary() {
  document.getElementById('libraryView').classList.add('active');
  document.getElementById('readerView').classList.remove('active');
}

// HVĚZDIČKY
(function() {
  function createStarParticles() {
    var panelGate = document.getElementById('panel-gate');
    if (panelGate) spawnStars(panelGate, 40);
    var mainStars = document.getElementById('main-stars');
    if (mainStars) spawnStars(mainStars, 60);
  }
  
  function spawnStars(container, count) {
    for (let i = 0; i < count; i++) {
      const star = document.createElement('div');
      star.className = 'star-container' + (Math.random() > 0.7 ? ' big' : '');
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 2 + 's';
      container.appendChild(star);
    }
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', createStarParticles);
  } else {
    createStarParticles();
  }
})();

// INIT
window.addEventListener('load', () => {
  unlockPanel();
  loadBooks();
  changeFontSize();
});
</script>
