<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050810">
  <title>KLADYX PANEL v7.5</title>
  <style>
    #panel-gate {
      position: fixed; inset: 0; z-index: 99999;
      background: #050810;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px; transition: opacity 0.4s;
    }
    #panel-gate.hidden { opacity: 0; pointer-events: none; }
    .gate-logo { font-size: 2.2rem; font-weight: 900; letter-spacing: 8px; color: #00d4ff; text-shadow: 0 0 30px #00d4ff; }
    .gate-sub { font-size: 0.6rem; letter-spacing: 4px; color: #5a6488; text-transform: uppercase; margin-top: -18px; }
    .gate-btn { display: flex; align-items: center; gap: 12px; padding: 14px 28px; border: 1px solid rgba(0,212,255,0.3); background: rgba(0,212,255,0.06); color: #dde4ff; font-family: "Courier New", monospace; font-size: 0.85rem; letter-spacing: 2px; cursor: pointer; border-radius: 6px; }
    .gate-btn:hover { background: rgba(0,212,255,0.14); }
    .gate-status { font-size: 0.6rem; letter-spacing: 2px; color: #5a6488; min-height: 16px; }
    .gate-err { color: #ff3c5a; }
    #signout-btn { display: none; font-family: "Courier New", monospace; font-size: 0.55rem; letter-spacing: 1px; padding: 3px 10px; border: 1px solid rgba(0,255,120,0.3); background: transparent; color: #00ff78; cursor: pointer; border-radius: 3px; margin-left: 8px; }

    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg:#050810; --sidebar:#080d1c; --cyan:#00d4ff; --muted:#5a6488; --light:#dde4ff; --card:#0d1428; }
    html,body { width:100%; height:100%; background:var(--bg); font-family:"Courier New",monospace; color:var(--light); overflow:hidden; }
    
    /* HVĚZDIČKOVÝ CANVAS - POZADÍ */
    #stars-canvas { 
      position:fixed; top:0; left:0; width:100%; height:100%; 
      pointer-events:none; z-index:0; 
    }
    
    /* OBSAH NA VRSTVĚ NAD HVĚZDIČKAMI */
    body > *:not(#stars-canvas) { position:relative; z-index:1; }
    
    body::before {
      content:'';
      position:fixed;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      width:60vmin; height:60vmin;
      border-radius:50%;
      background:radial-gradient(circle,rgba(0,212,255,0.08) 0%,transparent 70%);
      filter:blur(40px);
      opacity:0.08;
      pointer-events:none;
      z-index:0;
    }
    .layout { display:flex; flex-direction:column; height:100vh; height:100dvh; }
    .topbar { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--sidebar); border-bottom:1px solid rgba(0,212,255,0.2); flex-shrink:0; z-index:10; overflow-x:scroll; -webkit-overflow-scrolling:touch; scrollbar-width:none; touch-action:pan-x; }
    .topbar::-webkit-scrollbar { display:none; }
    .tlogo { font-size:0.7rem; font-weight:bold; letter-spacing:3px; color:var(--cyan); text-shadow:0 0 10px var(--cyan); white-space:nowrap; flex-shrink:0; }
    .tlogo span { font-size:0.48rem; color:var(--muted); letter-spacing:1px; display:block; }
    .tdiv { width:1px; height:24px; background:rgba(0,212,255,0.15); flex-shrink:0; }
    .app-btn { display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 9px; background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.07); border-radius:7px; cursor:pointer; transition:all 0.2s; white-space:nowrap; flex-shrink:0; position:relative; min-width:54px; }
    .app-btn:hover { border-color:rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); }
    .app-btn.active { border-color:var(--ac); background:rgba(var(--ac-rgb),0.12); box-shadow:0 0 12px rgba(var(--ac-rgb),0.25); }
    .bi { font-size:1.1rem; line-height:1; }
    .bl { font-size:0.52rem; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
    .app-btn.active .bl { color:var(--ac); }
    .bd { position:absolute; top:4px; right:5px; width:4px; height:4px; border-radius:50%; background:#00ff88; box-shadow:0 0 5px #00ff88; opacity:0; transition:opacity 0.3s; }
    .app-btn.active .bd { opacity:1; }
    
    /* DŮLEŽITÉ: iframe-wrap má TRANSPARENTNÍ pozadí aby byly vidět hvězdičky */
    .iframe-wrap { flex:1; position:relative; overflow:hidden; background:transparent; }
    .app-frame { position:absolute; inset:0; width:100%; height:100%; border:none; opacity:0; pointer-events:none; transition:opacity 0.25s; }
    .app-frame.visible { opacity:1; pointer-events:all; touch-action:auto; }
    .welcome { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:14px; padding:20px; padding-top:max(20px,8vh); text-align:center; overflow-y:auto; -webkit-overflow-scrolling:touch; transition:opacity 0.3s; }
    .welcome.hidden { opacity:0; pointer-events:none; }
    .wlogo { font-size:1.7rem; font-weight:bold; letter-spacing:6px; color:var(--cyan); text-shadow:0 0 25px var(--cyan); animation:glow 3s ease-in-out infinite; }
    @keyframes glow { 0%,100%{text-shadow:0 0 18px var(--cyan)} 50%{text-shadow:0 0 45px var(--cyan),0 0 70px rgba(0,212,255,0.4)} }
    .wsub { font-size:0.6rem; letter-spacing:3px; color:var(--muted); }
    .wgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:420px; width:100%; margin-top:6px; }
    @media(max-width:460px){ .wgrid { grid-template-columns:repeat(2,1fr); } }
    .wcard { background:var(--card); border:1px solid rgba(255,255,255,0.07); border-radius:10px; padding:12px 8px; cursor:pointer; transition:all 0.2s; display:flex; flex-direction:column; align-items:center; gap:4px; }
    .wcard:active { transform:scale(0.96); }
    .wi { font-size:1.5rem; }
    .wn { font-size:0.56rem; letter-spacing:1px; text-transform:uppercase; color:var(--light); }
    .wd { font-size:0.5rem; color:var(--muted); }
    .eq-wrap{display:flex;gap:20px;justify-content:center;align-items:flex-end;margin:8px 0 4px;}
    .dancer{width:36px;height:56px;position:relative;flex-shrink:0;}
    .dancer svg{width:36px;height:56px;overflow:visible;}
    .dancer-g .arm-l{transform-origin:16px 14px;animation:armLg 0.5s ease-in-out infinite alternate;}
    .dancer-g .arm-r{transform-origin:16px 14px;animation:armRg 0.5s ease-in-out infinite alternate;}
    .dancer-g .leg-l{transform-origin:16px 28px;animation:legLg 0.5s ease-in-out infinite alternate;}
    .dancer-g .leg-r{transform-origin:16px 28px;animation:legRg 0.5s ease-in-out infinite alternate;}
    .dancer-b .arm-l{transform-origin:16px 14px;animation:armLg 0.5s ease-in-out infinite alternate-reverse;}
    .dancer-b .arm-r{transform-origin:16px 14px;animation:armRg 0.5s ease-in-out infinite alternate-reverse;}
    .dancer-b .leg-l{transform-origin:16px 28px;animation:legLg 0.5s ease-in-out infinite alternate-reverse;}
    .dancer-b .leg-r{transform-origin:16px 28px;animation:legRg 0.5s ease-in-out infinite alternate-reverse;}
    @keyframes armLg{0%{transform:rotate(-30deg);}100%{transform:rotate(30deg);}}
    @keyframes armRg{0%{transform:rotate(30deg);}100%{transform:rotate(-30deg);}}
    @keyframes legLg{0%{transform:rotate(-25deg);}100%{transform:rotate(25deg);}}
    @keyframes legRg{0%{transform:rotate(25deg);}100%{transform:rotate(-25deg);}}
    .eq{display:flex;align-items:flex-end;gap:2px;height:36px;}
    .eq-bar{width:5px;border-radius:2px 2px 0 0;background:linear-gradient(to top,#00ff44,#00cc33);box-shadow:0 0 5px rgba(0,255,68,0.5);}
    .eq-bar:nth-child(1){animation:eqb1 0.4s ease-in-out infinite alternate;}
    .eq-bar:nth-child(2){animation:eqb2 0.6s ease-in-out infinite alternate;}
    .eq-bar:nth-child(3){animation:eqb3 0.3s ease-in-out infinite alternate;}
  </style>
</head>
<body>

<!-- HVĚZDIČKOVÝ CANVAS - Z-INDEX 0 -->
<canvas id="stars-canvas"></canvas>

<!-- OBSAH - Z-INDEX 1 (NAD HVĚZDIČKAMI) -->
<div id="panel-gate">
  <canvas id="gate-stars-canvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>
  <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:28px;">
  <div class="gate-logo">KLADYX</div>
  <div class="gate-sub">Control Panel · Private Access</div>
  <button class="gate-btn" onclick="googleSignIn()">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    PŘIHLÁSIT SE PŘES GOOGLE
  </button>
  <div class="gate-status" id="gate-status"></div>
  </div>
</div>

<div class="layout">
  <div class="topbar">
    <div class="tlogo">▬ KLADYX PANEL<span>v7.5</span></div>
    <div class="tdiv"></div>
    <div style="color:#5a6488;font-size:0.55rem;letter-spacing:1px;">TEST</div>
    <button id="signout-btn" onclick="googleSignOut()" style="display:none;">⏻ ODHLÁSIT</button>
  </div>
  <div class="iframe-wrap">
    <div class="welcome" id="welcome">
      <div class="wlogo">KLADYX</div>
      <div class="wsub">CONTROL PANEL — VYBERTE APLIKACI</div>
      <div class="wgrid">
        <div class="wcard">
          <div class="wi">🎵</div>
          <div class="wn">Housetime</div>
        </div>
        <div class="wcard">
          <div class="wi">🎛️</div>
          <div class="wn">Hardware</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// PŘIHLAŠOVACÍ OBRAZOVKA - HVĚZDIČKY
(function(){
  var canvas=document.getElementById('gate-stars-canvas');
  var ctx=canvas.getContext('2d');
  var COLORS=['#00e5ff','#29b6f6','#4fc3f7','#00bcd4','#0288d1'];
  var stars=[];
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  function rnd(a,b){return a+Math.random()*(b-a);}
  function mkStar(){return{x:rnd(0,canvas.width),y:rnd(0,canvas.height),size:rnd(2,10),color:COLORS[Math.floor(Math.random()*COLORS.length)],alpha:rnd(0.3,1),speed:rnd(0.002,0.008),phase:rnd(0,Math.PI*2),dx:rnd(-0.05,0.05),dy:rnd(-0.02,0.02)};}
  function init(){stars=[];for(var i=0;i<60;i++)stars.push(mkStar());}
  function drawStar(x,y,sz,col,al){ctx.save();ctx.globalAlpha=al;ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=sz*2;ctx.beginPath();for(var i=0;i<5;i++){var oa=(i*4*Math.PI)/5-Math.PI/2,ia=oa+(2*Math.PI)/10;ctx.lineTo(x+Math.cos(oa)*sz,y+Math.sin(oa)*sz);ctx.lineTo(x+Math.cos(ia)*(sz*0.4),y+Math.sin(ia)*(sz*0.4));}ctx.closePath();ctx.fill();ctx.restore();}
  var t=0;
  function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);t+=0.016;stars.forEach(function(s){var p=0.4+0.6*(0.5+0.5*Math.sin(t*s.speed*60+s.phase));s.x+=s.dx;s.y+=s.dy;if(s.x<-20)s.x=canvas.width+20;if(s.x>canvas.width+20)s.x=-20;if(s.y<-20)s.y=canvas.height+20;if(s.y>canvas.height+20)s.y=-20;drawStar(s.x,s.y,s.size,s.color,s.alpha*p);});requestAnimationFrame(animate);}
  resize();init();animate();
  window.addEventListener('resize',function(){resize();init();});
})();

// HLAVNÍ PANEL - HVĚZDIČKY
(function(){
  var canvas=document.getElementById('stars-canvas');
  var ctx=canvas.getContext('2d');
  var COLORS=['#00e5ff','#29b6f6','#4fc3f7','#00bcd4','#0288d1'];
  var stars=[];
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  function rnd(a,b){return a+Math.random()*(b-a);}
  function mkStar(){return{x:rnd(0,canvas.width),y:rnd(0,canvas.height),size:rnd(2,10),color:COLORS[Math.floor(Math.random()*COLORS.length)],alpha:rnd(0.3,1),speed:rnd(0.002,0.008),phase:rnd(0,Math.PI*2),dx:rnd(-0.05,0.05),dy:rnd(-0.02,0.02)};}
  function init(){stars=[];for(var i=0;i<60;i++)stars.push(mkStar());}
  function drawStar(x,y,sz,col,al){ctx.save();ctx.globalAlpha=al;ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=sz*2;ctx.beginPath();for(var i=0;i<5;i++){var oa=(i*4*Math.PI)/5-Math.PI/2,ia=oa+(2*Math.PI)/10;ctx.lineTo(x+Math.cos(oa)*sz,y+Math.sin(oa)*sz);ctx.lineTo(x+Math.cos(ia)*(sz*0.4),y+Math.sin(ia)*(sz*0.4));}ctx.closePath();ctx.fill();ctx.restore();}
  var t=0;
  function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);t+=0.016;stars.forEach(function(s){var p=0.4+0.6*(0.5+0.5*Math.sin(t*s.speed*60+s.phase));s.x+=s.dx;s.y+=s.dy;if(s.x<-20)s.x=canvas.width+20;if(s.x>canvas.width+20)s.x=-20;if(s.y<-20)s.y=canvas.height+20;if(s.y>canvas.height+20)s.y=-20;drawStar(s.x,s.y,s.size,s.color,s.alpha*p);});requestAnimationFrame(animate);}
  resize();init();animate();
  window.addEventListener('resize',function(){resize();init();});
})();

function googleSignIn() {
  var gate=document.getElementById('panel-gate');
  gate.classList.add('hidden');
  setTimeout(function(){gate.style.display='none';},400);
  var sb=document.getElementById('signout-btn');
  if(sb)sb.style.display='inline-block';
}

function googleSignOut() {
  location.reload();
}
</script>

</body>
</html>
