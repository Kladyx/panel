<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0e1a;color:#cce5ff;font-family:'Segoe UI',sans-serif;min-height:100vh;padding:12px;}
.header{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
h1{font-size:1rem;color:#00f5ff;letter-spacing:2px;text-transform:uppercase;}
.film-reel{display:inline-block;font-size:1.2rem;animation:reelSpin 3s linear infinite;}
@keyframes reelSpin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#00ff88;box-shadow:0 0 6px #00ff88;animation:syncPulse 2s ease-in-out infinite;}
@keyframes syncPulse{0%,100%{opacity:1;box-shadow:0 0 6px #00ff88;}50%{opacity:.4;box-shadow:none;}}
.brand{font-size:1.1rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px;font-family:'Segoe UI',sans-serif;font-weight:700;background:linear-gradient(90deg,#00f5ff,#ff00cc,#00f5ff);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:brandPulse 2.5s linear infinite;}
@keyframes brandPulse{0%{background-position:0% center;}100%{background-position:200% center;}}
.connected-label{font-size:0.55rem;color:#00ff88;letter-spacing:1px;font-family:'Segoe UI',sans-serif;}
.ver-label{font-size:0.5rem;color:rgba(0,245,255,0.35);letter-spacing:1px;font-family:'Segoe UI',sans-serif;margin-bottom:4px;}
.counter{font-size:0.65rem;color:rgba(0,245,255,0.5);margin-bottom:10px;letter-spacing:1px;}
#add-form{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
#add-form input{background:#0d1530;border:1px solid rgba(0,245,255,0.35);color:#cce5ff;padding:7px 10px;border-radius:4px;font-size:0.8rem;outline:none;transition:border-color .3s;}
#add-form input:focus{border-color:#00f5ff;box-shadow:0 0 8px rgba(0,245,255,0.2);}
#add-btn{background:linear-gradient(135deg,rgba(0,245,255,0.25),rgba(0,200,255,0.15));border:1px solid rgba(0,245,255,0.5);color:#00f5ff;padding:8px;border-radius:4px;cursor:pointer;font-size:0.8rem;letter-spacing:1px;transition:all .2s;}
#add-btn:hover{background:linear-gradient(135deg,rgba(0,245,255,0.4),rgba(0,200,255,0.25));transform:scale(1.01);}
#add-btn:active{transform:scale(0.98);}
.vcard{background:linear-gradient(135deg,#0d1530,#0a1025);border:1px solid rgba(0,245,255,0.15);border-radius:8px;margin-bottom:10px;overflow:hidden;display:flex;flex-direction:column;gap:0;padding:0;animation:cardIn .3s ease-out;}
.vcard-top{display:flex;gap:10px;}
.vembed{display:none;width:100%;min-width:0;align-self:stretch;box-sizing:border-box;position:relative;padding-bottom:56.25%;height:0;}
.vembed iframe{position:absolute;top:0;left:0;width:100%!important;height:100%!important;border:none;display:block;}
.vplay-active{background:rgba(255,60,60,0.25);border:1px solid rgba(255,60,60,0.5);color:#ff6666;}
@keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.vthumb{width:100px;min-height:70px;flex-shrink:0;background:#080c18;position:relative;overflow:hidden;}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block;}
.vthumb-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:28px;height:28px;background:rgba(255,0,0,0.85);border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.vthumb-play::after{content:'';border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px;}
.vinfo{flex:1;padding:8px 8px 8px 0;display:flex;flex-direction:column;justify-content:center;min-width:0;}
.vtitle{font-size:0.82rem;color:#00ccee;font-weight:bold;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vbtns{display:flex;gap:4px;flex-wrap:wrap;}
.vbtns a,.vbtns button{display:inline-flex;align-items:center;gap:3px;padding:5px 8px;border-radius:3px;font-size:0.68rem;cursor:pointer;text-decoration:none;border:none;transition:all .2s;}
.vbtns a:active,.vbtns button:active{transform:scale(0.95);}
.vplay{background:rgba(0,200,80,0.2);border:1px solid rgba(0,255,100,0.4);color:#00ff66;}
.vedit{background:rgba(255,170,0,0.12);border:1px solid rgba(255,170,0,0.35);color:#ffaa00;}
.vcopy{background:rgba(0,150,255,0.12);border:1px solid rgba(0,150,255,0.35);color:#44aaff;}
.vdel{background:rgba(255,0,0,0.1);border:1px solid rgba(255,60,60,0.3);color:#ff4444;}
#status{font-size:0.7rem;color:#888;margin-bottom:8px;min-height:16px;}
.empty{text-align:center;color:#444;font-size:0.8rem;margin-top:30px;}
</style>
</head>
<body>
<div class="brand">Kladyxland multifunkční panel inc.</div>
<div class="header">
  <span class="film-reel">🎞</span><h1>Videos</h1>
  <span class="sync-dot" id="sync-dot" title="Synchronizováno"></span>
  <span class="connected-label" id="connected-label">CONNECTED</span>
</div>
<div class="counter" id="counter"></div>
<div class="ver-label">v2.0.Videos/26</div>
<div id="status"></div>
<div id="add-form">
  <input id="inp-name" type="text" placeholder="Název videa..." maxlength="80">
  <input id="inp-url" type="url" placeholder="YouTube URL (https://youtu.be/...)">
  <button id="add-btn">+ PŘIDAT VIDEO</button>
</div>
<div id="list"></div>

<script>
var FIREBASE_URL = 'https://kladyxland-default-rtdb.europe-west1.firebasedatabase.app/videosDb';
var videos = {};

function status(msg, col){
  var el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = col || '#888';
}

function syncOk(){
  var dot = document.getElementById('sync-dot');
  dot.style.background = '#00ff88';
  dot.style.boxShadow = '0 0 6px #00ff88';
  dot.title = 'Synchronizováno';
  var lbl = document.getElementById('connected-label');
  if(lbl){lbl.style.display='inline';lbl.textContent='CONNECTED';lbl.style.color='#00ff88';}
}

function syncErr(){
  var dot = document.getElementById('sync-dot');
  dot.style.background = '#ff4444';
  dot.style.boxShadow = '0 0 6px #ff4444';
  dot.title = 'Chyba spojení';
  var lbl = document.getElementById('connected-label');
  if(lbl){lbl.textContent='ERROR';lbl.style.color='#ff4444';}
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function getYouTubeId(url){
  var m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([^&?\/\s]+)/);
  return m ? m[1] : null;
}

function getThumb(url){
  var id = getYouTubeId(url);
  if(id) return 'https://img.youtube.com/vi/' + id + '/mqdefault.jpg';
  return '';
}

function render(){
  var list = document.getElementById('list');
  var keys = Object.keys(videos);
  document.getElementById('counter').textContent = keys.length > 0 ? keys.length + ' videí' : '';
  if(keys.length === 0){
    list.innerHTML = '<div class="empty">Žádná videa. Přidej první!</div>';
    return;
  }
  list.innerHTML = '';
  keys.sort(function(a,b){ return (videos[b].ts||0)-(videos[a].ts||0); });
  keys.forEach(function(key){
    var v = videos[key];
    var thumb = getThumb(v.url);
    var card = document.createElement('div');
    card.className = 'vcard';
    var vid = getYouTubeId(v.url);
    card.innerHTML =
      '<div class="vcard-top">' +
      (thumb ?
        '<div class="vthumb" style="cursor:pointer" data-key="' + key + '" data-action="embed">' +
          '<img src="' + esc(thumb) + '" alt="" loading="lazy">' +
          '<div class="vthumb-play"></div>' +
        '</div>' :
        '<div class="vthumb"></div>') +
      '<div class="vinfo">' +
        '<div class="vtitle" title="' + esc(v.name) + '">' + esc(v.name) + '</div>' +
        '<div class="vbtns">' +
          (vid ? '<button class="vplay" data-key="' + key + '" data-action="embed">▶</button>' : '') +
          '<button class="vedit" data-key="' + key + '" data-action="edit">✏</button>' +
          '<button class="vcopy" data-key="' + key + '" data-action="copy">🔗</button>' +
          '<button class="vdel" data-key="' + key + '" data-action="del">🗑</button>' +
        '</div>' +
      '</div>' +
      '</div>' +
      '<div class="vembed" id="emb-' + key + '">' +
        '<iframe id="ifr-' + key + '" src="" allowfullscreen allow="autoplay"></iframe>' +
      '</div>';
    list.appendChild(card);
  });

  list.querySelectorAll('[data-action]').forEach(function(btn){
    btn.onclick = function(){
      var key = btn.getAttribute('data-key');
      var action = btn.getAttribute('data-action');
      if(action === 'embed') toggleEmbed(key);
      if(action === 'edit') editVideo(key);
      if(action === 'copy') copyUrl(key);
      if(action === 'del') delVideo(key);
    };
  });
}

function toggleEmbed(key){
  var embDiv = document.getElementById('emb-' + key);
  var iframe = document.getElementById('ifr-' + key);
  var btns = document.querySelectorAll('[data-action="embed"][data-key="' + key + '"]');
  if(!embDiv) return;
  if(embDiv.style.display === 'block'){
    embDiv.style.display = 'none';
    iframe.src = '';
    btns.forEach(function(b){ b.classList.remove('vplay-active'); b.textContent = '▶'; });
  } else {
    var v = videos[key];
    var vid = getYouTubeId(v.url);
    if(!vid) return;
    iframe.src = 'https://www.youtube.com/embed/' + vid + '?autoplay=1&loop=1&playlist=' + vid + '&rel=0';
    embDiv.style.display = 'block';
    btns.forEach(function(b){ b.classList.add('vplay-active'); b.textContent = '■'; });
  }
}

function editVideo(key){
  var v = videos[key];
  var newName = prompt('Nový název videa:', v.name);
  if(newName === null || newName.trim() === '') return;
  newName = newName.trim();
  status('Ukládám...', '#888');
  fetch(FIREBASE_URL + '/' + key + '/name.json', {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(newName)
  }).then(function(r){
    if(r.ok){ status('Přejmenováno!', '#00ff88'); syncOk(); load(); }
    else{ status('Chyba přejmenování.', '#ff4444'); syncErr(); }
  }).catch(function(){ status('Chyba spojení.', '#ff4444'); syncErr(); });
}

function copyUrl(key){
  var url = videos[key].url;
  if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){ status('Zkopírováno!', '#00ff88'); setTimeout(function(){ status(''); }, 2000); }); }
  else{ status('Zkopíruj ručně: ' + url, '#00ccee'); }
}

function delVideo(key){
  if(!confirm('Smazat video "' + videos[key].name + '"?')) return;
  fetch(FIREBASE_URL + '/' + key + '.json', {method:'DELETE'})
    .then(function(r){
      if(r.ok){ status('Smazáno.', '#ff4444'); syncOk(); load(); }
      else{ status('Chyba mazání.', '#ff4444'); syncErr(); }
    })
    .catch(function(){ status('Chyba při mazání.', '#ff4444'); syncErr(); });
}

function load(){
  status('Načítám...', '#888');
  fetch(FIREBASE_URL + '.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      videos = data || {};
      render();
      status('', '');
      syncOk();
    })
    .catch(function(){ status('Chyba načítání.', '#ff4444'); syncErr(); });
}

document.getElementById('add-btn').onclick = function(){
  var name = document.getElementById('inp-name').value.trim();
  var url = document.getElementById('inp-url').value.trim();
  if(!name || !url){ status('Vyplň název i URL.', '#00ccee'); return; }
  if(!url.startsWith('http')){ status('Neplatná URL.', '#ff4444'); return; }
  var key = 'v' + Date.now();
  var entry = {name:name, url:url, ts:Date.now()};
  status('Ukládám...', '#888');
  fetch(FIREBASE_URL + '/' + key + '.json', {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(entry)
  }).then(function(r){
    if(r.ok){
      document.getElementById('inp-name').value = '';
      document.getElementById('inp-url').value = '';
      status('Uloženo!', '#00ff88');
      syncOk();
      load();
    } else { status('Chyba ukládání.', '#ff4444'); syncErr(); }
  }).catch(function(){ status('Chyba ukládání.', '#ff4444'); syncErr(); });
};

load();
</script>
</body>
</html>
