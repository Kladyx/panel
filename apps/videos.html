<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0e1a;color:#cce5ff;font-family:'Segoe UI',sans-serif;min-height:100vh;padding:12px;}
h1{font-size:1rem;color:#ff6600;letter-spacing:2px;margin-bottom:12px;text-transform:uppercase;}
#add-form{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
#add-form input{background:#0d1530;border:1px solid rgba(255,102,0,0.35);color:#cce5ff;padding:7px 10px;border-radius:4px;font-size:0.8rem;outline:none;}
#add-form input:focus{border-color:#ff6600;}
#add-btn{background:rgba(255,102,0,0.2);border:1px solid rgba(255,102,0,0.5);color:#ff6600;padding:7px;border-radius:4px;cursor:pointer;font-size:0.8rem;letter-spacing:1px;}
#add-btn:hover{background:rgba(255,102,0,0.35);}
.vcard{background:#0d1530;border:1px solid rgba(255,102,0,0.2);border-radius:6px;margin-bottom:10px;overflow:hidden;padding:10px;}
.vtitle{font-size:0.9rem;color:#ff8833;font-weight:bold;margin-bottom:6px;word-break:break-word;}
.vurl{font-size:0.6rem;color:rgba(255,136,51,0.4);margin-bottom:8px;word-break:break-all;}
.vbtns{display:flex;gap:6px;flex-wrap:wrap;}
.vbtns a,.vbtns button{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border-radius:4px;font-size:0.8rem;cursor:pointer;text-decoration:none;border:none;}
.vplay{background:rgba(0,200,80,0.25);border:1px solid rgba(0,255,100,0.5);color:#00ff66;}
.vcopy{background:rgba(0,150,255,0.15);border:1px solid rgba(0,150,255,0.4);color:#44aaff;}
.vdel{background:rgba(255,0,0,0.12);border:1px solid rgba(255,60,60,0.4);color:#ff4444;}
#status{font-size:0.7rem;color:#888;margin-bottom:8px;min-height:16px;}
.empty{text-align:center;color:#444;font-size:0.8rem;margin-top:30px;}
</style>
</head>
<body>
<h1>🎬 Videos</h1>
<div id="status"></div>
<div id="add-form">
  <input id="inp-name" type="text" placeholder="Název videa..." maxlength="80">
  <input id="inp-url" type="url" placeholder="YouTube URL (https://youtu.be/...)">
  <button id="add-btn">+ PŘIDAT VIDEO</button>
</div>
<div id="list"></div>

<script>
var FIREBASE_URL = 'https://kladyxland-default-rtdb.europe-west1.firebasedatabase.app/videosDb';
var videos = {};

function status(msg, col){
  var el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = col || '#888';
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render(){
  var list = document.getElementById('list');
  var keys = Object.keys(videos);
  if(keys.length === 0){
    list.innerHTML = '<div class="empty">Žádná videa. Přidej první!</div>';
    return;
  }
  list.innerHTML = '';
  keys.sort(function(a,b){ return (videos[b].ts||0)-(videos[a].ts||0); });
  keys.forEach(function(key){
    var v = videos[key];
    var card = document.createElement('div');
    card.className = 'vcard';
    card.innerHTML =
      '<div class="vtitle">' + esc(v.name) + '</div>' +
      '<div class="vurl">' + esc(v.url) + '</div>' +
      '<div class="vbtns">' +
        '<a class="vplay" href="' + esc(v.url) + '" target="_blank" rel="noopener">▶ PŘEHRÁT</a>' +
        '<button class="vcopy" data-key="' + key + '" data-action="copy">🔗 ODKAZ</button>' +
        '<button class="vdel" data-key="' + key + '" data-action="del">🗑 SMAZAT</button>' +
      '</div>';
    list.appendChild(card);
  });

  list.querySelectorAll('[data-action]').forEach(function(btn){
    btn.onclick = function(){
      var key = btn.getAttribute('data-key');
      var action = btn.getAttribute('data-action');
      if(action === 'copy') copyUrl(key);
      if(action === 'del') delVideo(key);
    };
  });
}

function copyUrl(key){
  var url = videos[key].url;
  if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){ status('Zkopírováno!', '#00ff88'); setTimeout(function(){ status(''); }, 2000); }); }
  else{ status('Zkopíruj ručně: ' + url, '#ff8833'); }
}

function delVideo(key){
  if(!confirm('Smazat video "' + videos[key].name + '"?')) return;
  fetch(FIREBASE_URL + '/' + key + '.json', {method:'DELETE'})
    .then(function(){ status('Smazáno.', '#ff4444'); load(); })
    .catch(function(){ status('Chyba při mazání.', '#ff4444'); });
}

function load(){
  status('Načítám...', '#888');
  fetch(FIREBASE_URL + '.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      videos = data || {};
      render();
      status('', '');
    })
    .catch(function(){ status('Chyba načítání.', '#ff4444'); });
}

document.getElementById('add-btn').onclick = function(){
  var name = document.getElementById('inp-name').value.trim();
  var url = document.getElementById('inp-url').value.trim();
  if(!name || !url){ status('Vyplň název i URL.', '#ff8833'); return; }
  if(!url.startsWith('http')){ status('Neplatná URL.', '#ff4444'); return; }
  var key = 'v' + Date.now();
  var entry = {name:name, url:url, ts:Date.now()};
  status('Ukládám...', '#888');
  fetch(FIREBASE_URL + '/' + key + '.json', {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(entry)
  }).then(function(){
    document.getElementById('inp-name').value = '';
    document.getElementById('inp-url').value = '';
    status('Uloženo!', '#00ff88');
    load();
  }).catch(function(){ status('Chyba ukládání.', '#ff4444'); });
};

load();
</script>
</body>
</html>
