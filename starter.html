<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starter v1.6.Kl</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100%;font-family:'Orbitron',monospace;color:#e0e0e0;overflow-y:auto;}
body{background:radial-gradient(ellipse at 50% 20%,rgba(0,180,255,.25) 0%,transparent 60%),radial-gradient(ellipse at 50% 90%,rgba(80,120,255,.18) 0%,transparent 60%),linear-gradient(180deg,#0a2a5c 0%,#1e4a8c 50%,#2a5aa0 100%);display:flex;flex-direction:column;align-items:center;padding:20px;position:relative;}
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.star{position:absolute;color:#fff;font-size:10px;opacity:0;animation:twinkle 3s infinite;}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5);}50%{opacity:.9;transform:scale(1);}}
.star.s1{top:8%;left:18%;font-size:12px;animation-duration:2.5s;}
.star.s2{top:15%;left:78%;font-size:8px;animation-duration:3.2s;animation-delay:.4s;color:#00ffee;}
.star.s3{top:25%;left:35%;animation-duration:2.8s;animation-delay:1.1s;color:#ffee00;}
.star.s4{top:12%;left:55%;font-size:14px;animation-duration:3.5s;animation-delay:.7s;}
.star.s5{top:32%;left:88%;font-size:9px;animation-duration:2.2s;animation-delay:1.5s;color:#ff88ff;}
.star.s6{top:45%;left:8%;font-size:11px;animation-duration:2.9s;animation-delay:.2s;color:#88ffaa;}
.star.s7{top:55%;left:70%;font-size:8px;animation-duration:3.1s;animation-delay:1.8s;}
.star.s8{top:68%;left:22%;animation-duration:2.6s;animation-delay:.9s;color:#00c8ff;}
.head{position:relative;z-index:2;text-align:center;margin-bottom:16px;width:100%;max-width:380px;}
.head-row{display:flex;align-items:center;justify-content:center;gap:10px;}
.title{color:#00f5ff;font-size:1.15rem;letter-spacing:.25em;font-weight:900;text-shadow:0 0 12px rgba(0,245,255,.5);}
.ver{font-size:.38rem;color:rgba(255,255,255,.3);letter-spacing:.15em;margin-top:2px;}
.sub{color:#4a5060;font-size:.55rem;letter-spacing:.2em;margin-top:4px;font-weight:500;}
.edit-btn{background:rgba(0,245,255,.1);border:1.5px solid rgba(0,245,255,.3);color:#00f5ff;border-radius:8px;padding:6px 12px;font-family:'Orbitron',monospace;font-size:.5rem;letter-spacing:.1em;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.edit-btn.active{background:rgba(255,200,0,.15);border-color:rgba(255,200,0,.5);color:#ffc800;}
.grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:380px;}
.app-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 8px;border-radius:14px;border:1.5px solid rgba(0,245,255,.2);background:rgba(255,255,255,.03);cursor:pointer;transition:transform .15s;-webkit-tap-highlight-color:transparent;position:relative;}
.app-btn:active{transform:scale(.93);}
.app-icon{font-size:1.8rem;line-height:1;}
.app-name{font-family:'Orbitron',monospace;font-size:.42rem;font-weight:700;letter-spacing:.1em;color:#e0e8ff;text-align:center;line-height:1.3;}
[data-color="orange"]{border-color:rgba(255,165,0,.3);}
[data-color="green"]{border-color:rgba(0,255,136,.3);}
[data-color="purple"]{border-color:rgba(167,139,250,.3);}
[data-color="red"]{border-color:rgba(255,60,90,.3);}
[data-color="cyan"]{border-color:rgba(0,245,255,.3);}
[data-color="blue"]{border-color:rgba(0,136,255,.3);}
.del-btn{display:none;position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:#ff3c5a;border:2px solid #fff;color:#fff;font-size:14px;line-height:20px;text-align:center;cursor:pointer;z-index:10;font-weight:bold;}
body.edit-mode .del-btn{display:block;}
body.edit-mode .app-btn{animation:wiggle .4s infinite alternate;}
@keyframes wiggle{0%{transform:rotate(-1deg);}100%{transform:rotate(1deg);}}
.add-btn{display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px 8px;border-radius:14px;border:2px dashed rgba(0,245,255,.4);background:rgba(0,245,255,.05);cursor:pointer;font-size:2rem;color:rgba(0,245,255,.6);min-height:100px;}
body.edit-mode .add-btn{display:flex;}
.overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:linear-gradient(180deg,#0d2d5c,#0a1f3c);border:1.5px solid rgba(0,245,255,.3);border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;max-width:420px;}
.sheet-title{color:#00f5ff;font-size:.7rem;letter-spacing:.2em;margin-bottom:16px;text-align:center;}
.row{margin-bottom:12px;}
.lbl{font-size:.45rem;color:rgba(255,255,255,.5);letter-spacing:.1em;margin-bottom:4px;display:block;}
.inp,.sel{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(0,245,255,.2);border-radius:8px;padding:10px 12px;color:#e0e8ff;font-family:'Orbitron',monospace;font-size:.55rem;outline:none;}
.sel{background:#0d2d5c;}
.clr-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
.dot.sel{border-color:#fff;}
.dot[data-c="cyan"]{background:#00f5ff;}
.dot[data-c="green"]{background:#00ff88;}
.dot[data-c="purple"]{background:#a78bfa;}
.dot[data-c="orange"]{background:#ffa500;}
.dot[data-c="red"]{background:#ff3c5a;}
.dot[data-c="blue"]{background:#0088ff;}
.btns{display:flex;gap:10px;margin-top:16px;}
.btn-ok{flex:1;background:rgba(0,245,255,.15);border:1.5px solid rgba(0,245,255,.4);border-radius:10px;padding:14px;color:#00f5ff;font-family:'Orbitron',monospace;font-size:.55rem;cursor:pointer;}
.btn-no{flex:1;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.2);border-radius:10px;padding:14px;color:rgba(255,255,255,.5);font-family:'Orbitron',monospace;font-size:.55rem;cursor:pointer;}
.info{position:relative;z-index:2;margin-top:16px;font-size:.4rem;letter-spacing:.12em;color:rgba(255,255,255,.3);text-align:center;}
.icon-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;}
.icon-input-group{flex:1;}
.file-input{display:none;}
.upload-btn{background:rgba(0,245,255,.1);border:1.5px solid rgba(0,245,255,.3);color:#00f5ff;border-radius:8px;padding:10px 16px;font-family:'Orbitron',monospace;font-size:.5rem;cursor:pointer;letter-spacing:.1em;width:100%;margin-top:4px;-webkit-tap-highlight-color:transparent;}
.upload-btn:active{background:rgba(0,245,255,.2);}
.icon-preview{width:80px;height:80px;border-radius:50%;border:2px solid rgba(0,245,255,.4);background:rgba(0,245,255,.05);display:flex;align-items:center;justify-content:center;font-size:2.5rem;overflow:hidden;flex-shrink:0;box-shadow:0 0 12px rgba(0,245,255,.15);}
.icon-preview img{width:100%;height:100%;object-fit:cover;}
</style>
</head>
<body>
<div class="stars">
<div class="star s1">✦</div><div class="star s2">✦</div><div class="star s3">✦</div><div class="star s4">✦</div>
<div class="star s5">✦</div><div class="star s6">✦</div><div class="star s7">✦</div><div class="star s8">✦</div>
</div>
<div class="head">
  <div style="font-size:1.8rem;margin-bottom:4px;">🚀</div>
  <div class="head-row">
    <div>
      <div class="title">STARTER</div>
      <div class="ver">v1.6.Kl</div>
      <div class="sub">ANDROID · APP LAUNCHER</div>
    </div>
    <button class="edit-btn" id="editBtn" onclick="toggleEdit()">✏️ UPRAVIT</button>
  </div>
</div>
<div class="grid" id="grid"></div>
<div class="info" id="info">Funguje pouze na Android · Otevře nainstalovanou appku</div>
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-title">➕ PŘIDAT APPKU</div>
    <div class="icon-row">
      <div class="icon-input-group">
        <label class="lbl">IKONA (emoji nebo foto)</label>
        <input class="inp" id="fIcon" type="text" placeholder="📱" maxlength="4">
        <button type="button" class="upload-btn" onclick="document.getElementById('fileInput').click()">📱 NAHRÁT FOTO</button>
        <input type="file" id="fileInput" class="file-input" accept="image/*" onchange="handleImageUpload(event)">
      </div>
      <div class="icon-preview" id="iconPreview">📱</div>
    </div>
    <div class="row"><label class="lbl">NÁZEV</label><input class="inp" id="fName" type="text" placeholder="NÁZEV APPKY" maxlength="20"></div>
    <div class="row"><label class="lbl">TYP</label>
      <select class="sel" id="fType" onchange="typeChanged()">
        <option value="android">Android appka (package)</option>
        <option value="url">Webová URL</option>
      </select>
    </div>
    <div class="row"><label class="lbl" id="fLbl">PACKAGE NAME</label><input class="inp" id="fTarget" placeholder="com.example.app"></div>
    <div class="row"><label class="lbl">BARVA</label><div class="clr-row" id="clrRow"></div></div>
    <div class="btns">
      <button class="btn-no" onclick="closeForm()">ZRUŠIT</button>
      <button class="btn-ok" onclick="saveApp()">ULOŽIT</button>
    </div>
  </div>
</div>
<script>
var SK='starter_v1';
var DEFS=[
  {id:1,icon:'🖥',name:'CONNECT|BOT',type:'android',target:'org.connectbot',color:'cyan'},
  {id:2,icon:'🐙',name:'GITHUB',type:'android',target:'com.github.android',color:'green'},
  {id:3,icon:'📡',name:'OBS|REMOTE',type:'url',target:'https://obs-web.niek.tv/',color:'purple'},
  {id:4,icon:'☁️',name:'MIXCLOUD',type:'android',target:'com.mixcloud.player',color:'cyan'},
  {id:5,icon:'🎛',name:'UNIVERSAL|CONTROL',type:'android',target:'com.presonus.ucremote',color:'cyan'},
  {id:6,icon:'🎚',name:'MY|PRESONUS',type:'android',target:'com.presonus.mypresonus',color:'blue'},
  {id:7,icon:'📷',name:'IRIUN|WEBCAM',type:'android',target:'com.jacksoftw.webcam',color:'green'},
  {id:8,icon:'🔔',name:'NTFY',type:'android',target:'io.heckel.ntfy',color:'red'},
  {id:9,icon:'🌐',name:'KLADYX|WEB',type:'url',target:'https://kladyx.github.io/kladyxland/',color:'cyan'}
];
var CLRS=['cyan','green','purple','orange','red','blue'];
var apps=[],editMode=false,selClr='cyan',nid=100;

function load(){
  try{
    var s=localStorage.getItem(SK);
    if(s){var d=JSON.parse(s);if(d&&d.apps&&d.apps.length){apps=d.apps;nid=d.nid||100;return;}}
  }catch(e){}
  apps=DEFS.map(function(a){return {id:a.id,icon:a.icon,name:a.name,type:a.type,target:a.target,color:a.color};});
}

function save(){try{localStorage.setItem(SK,JSON.stringify({apps:apps,nid:nid}));}catch(e){}}

function render(){
  var g=document.getElementById('grid'),h='';
  apps.forEach(function(a){
    var n=a.name.split('|').join('<br>');
    h+='<div class="app-btn" data-color="'+a.color+'" onclick="go('+a.id+')">';
    h+='<div class="del-btn" onclick="event.stopPropagation();del('+a.id+')">×</div>';
    if(a.icon.startsWith('data:image')){
      h+='<div class="app-icon"><img src="'+a.icon+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;" alt="app-icon"></div>';
    }else{
      h+='<div class="app-icon">'+a.icon+'</div>';
    }
    h+='<div class="app-name">'+n+'</div></div>';
  });
  if(editMode) h+='<div class="add-btn" onclick="openForm()">＋</div>';
  g.innerHTML=h;
  document.getElementById('info').textContent=editMode?'✏️ Úpravy · × smaže · ＋ přidá':'Funguje pouze na Android · Otevře nainstalovanou appku';
}

function go(id){
  if(editMode)return;
  var a=apps.filter(function(x){return x.id===id;})[0];
  if(!a)return;
  if(a.type==='android'){try{(window.top||window).location.href='intent://#Intent;package='+a.target+';end';}catch(e){}}
  else{(window.top||window).open(a.target,'_blank');}
}

function toggleEdit(){
  editMode=!editMode;
  document.body.classList.toggle('edit-mode',editMode);
  var b=document.getElementById('editBtn');
  b.className='edit-btn'+(editMode?' active':'');
  b.textContent=editMode?'✅ HOTOVO':'✏️ UPRAVIT';
  render();
}

function del(id){
  if(!confirm('Smazat?'))return;
  apps=apps.filter(function(a){return a.id!==id;});
  save();render();
}

function handleImageUpload(e){
  var f=e.target.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas');
      c.width=140;c.height=140;
      var ctx=c.getContext('2d');
      ctx.drawImage(img,0,0,140,140);
      var b64=c.toDataURL('image/jpeg',0.65);
      document.getElementById('fIcon').value=b64;
      updateIconPreview();
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
}

function updateIconPreview(){
  var v=document.getElementById('fIcon').value.trim();
  var p=document.getElementById('iconPreview');
  if(v.startsWith('data:image')){
    p.innerHTML='<img src="'+v+'" alt="icon">';
  }else{
    p.textContent=v||'📱';
  }
}

document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('fIcon').addEventListener('input',function(){
    if(this.value.trim() && !this.value.startsWith('data:image')){
      document.getElementById('fileInput').value='';
    }
    updateIconPreview();
  });
});

function openForm(){
  document.getElementById('fIcon').value='';
  document.getElementById('fileInput').value='';
  document.getElementById('fName').value='';
  document.getElementById('fType').value='android';
  document.getElementById('fTarget').value='';
  selClr='cyan';typeChanged();renderClrs();
  updateIconPreview();
  document.getElementById('overlay').className='overlay open';
}

function closeForm(){document.getElementById('overlay').className='overlay';}

function typeChanged(){
  var t=document.getElementById('fType').value;
  document.getElementById('fLbl').textContent=t==='android'?'PACKAGE NAME':'URL ADRESA';
  document.getElementById('fTarget').placeholder=t==='android'?'com.example.app':'https://...';
}

function renderClrs(){
  document.getElementById('clrRow').innerHTML=CLRS.map(function(c){
    return '<div class="dot'+(c===selClr?' sel':'')+'" data-c="'+c+'" onclick="pickClr(\''+c+'\')"></div>';
  }).join('');
}

function pickClr(c){
  selClr=c;
  document.querySelectorAll('.dot').forEach(function(d){d.classList.toggle('sel',d.getAttribute('data-c')===c);});
}

function saveApp(){
  var icon=document.getElementById('fIcon').value.trim()||'📱';
  var name=document.getElementById('fName').value.trim().toUpperCase();
  var type=document.getElementById('fType').value;
  var target=document.getElementById('fTarget').value.trim();
  if(!name){alert('Zadej název');return;}
  if(!target){alert('Zadej package nebo URL');return;}
  apps.push({id:nid++,icon:icon,name:name,type:type,target:target,color:selClr});
  save();closeForm();render();
}

load();renderClrs();render();
</script>
</body>
</html>
