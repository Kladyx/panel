<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="version" content="v1.6.Kl">
<title>Starter v1.6.Kl</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100%;font-family:'Orbitron',monospace;color:#e0e0e0;overflow-y:auto;}
body{
  background:
    radial-gradient(ellipse at 50% 20%, rgba(0,180,255,.25) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 90%, rgba(80,120,255,.18) 0%, transparent 60%),
    linear-gradient(180deg,#0a2a5c 0%,#1e4a8c 50%,#2a5aa0 100%);
  display:flex;flex-direction:column;align-items:center;padding:20px;
  position:relative;
}
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.star{position:absolute;color:#fff;font-size:10px;opacity:0;animation:twinkle 3s infinite;text-shadow:0 0 4px rgba(255,255,255,.8);}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5);}50%{opacity:.9;transform:scale(1);}}
.star.s1{top:8%;left:18%;font-size:12px;animation-duration:2.5s;color:#fff;}
.star.s2{top:15%;left:78%;font-size:8px;animation-duration:3.2s;animation-delay:.4s;color:#00ffee;}
.star.s3{top:25%;left:35%;font-size:10px;animation-duration:2.8s;animation-delay:1.1s;color:#ffee00;}
.star.s4{top:12%;left:55%;font-size:14px;animation-duration:3.5s;animation-delay:.7s;color:#fff;}
.star.s5{top:32%;left:88%;font-size:9px;animation-duration:2.2s;animation-delay:1.5s;color:#ff88ff;}
.star.s6{top:45%;left:8%;font-size:11px;animation-duration:2.9s;animation-delay:.2s;color:#88ffaa;}
.star.s7{top:55%;left:70%;font-size:8px;animation-duration:3.1s;animation-delay:1.8s;color:#fff;}
.star.s8{top:68%;left:22%;font-size:10px;animation-duration:2.6s;animation-delay:.9s;color:#00c8ff;}
.head{position:relative;z-index:2;text-align:center;margin-bottom:16px;width:100%;max-width:380px;}
.head-row{display:flex;align-items:center;justify-content:center;gap:10px;}
.title{color:#00f5ff;font-size:1.15rem;letter-spacing:.25em;font-weight:900;text-shadow:0 0 12px rgba(0,245,255,.5);}
.ver{font-size:.38rem;color:rgba(255,255,255,.3);letter-spacing:.15em;margin-top:2px;}
.sub{color:#4a5060;font-size:.55rem;letter-spacing:.2em;margin-top:4px;font-weight:500;}
.edit-btn{
  background:rgba(0,245,255,.1);border:1.5px solid rgba(0,245,255,.3);
  color:#00f5ff;border-radius:8px;padding:6px 12px;
  font-family:'Orbitron',monospace;font-size:.5rem;letter-spacing:.1em;
  cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;
}
.edit-btn.active{background:rgba(255,200,0,.15);border-color:rgba(255,200,0,.5);color:#ffc800;}
.grid{
  position:relative;z-index:2;
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:12px;width:100%;max-width:380px;
}
.app-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:18px 8px;border-radius:14px;
  border:1.5px solid rgba(0,245,255,.2);background:rgba(255,255,255,.03);
  cursor:pointer;transition:transform .15s,border-color .25s,box-shadow .25s;
  text-decoration:none;-webkit-tap-highlight-color:transparent;position:relative;
}
.app-btn:active{transform:scale(.93);}
.app-btn:hover{border-color:rgba(0,245,255,.6);box-shadow:0 0 16px rgba(0,245,255,.2);}
.app-icon{font-size:1.8rem;line-height:1;}
.app-icon img{width:2.2rem;height:2.2rem;object-fit:contain;border-radius:6px;}
.app-name{font-family:'Orbitron',monospace;font-size:.42rem;font-weight:700;
  letter-spacing:.1em;color:#e0e8ff;text-align:center;line-height:1.3;}
.app-btn[data-color="orange"]{border-color:rgba(255,165,0,.25);}
.app-btn[data-color="orange"]:hover{border-color:rgba(255,165,0,.6);box-shadow:0 0 16px rgba(255,165,0,.2);}
.app-btn[data-color="green"]{border-color:rgba(0,255,136,.25);}
.app-btn[data-color="green"]:hover{border-color:rgba(0,255,136,.6);box-shadow:0 0 16px rgba(0,255,136,.2);}
.app-btn[data-color="purple"]{border-color:rgba(167,139,250,.25);}
.app-btn[data-color="purple"]:hover{border-color:rgba(167,139,250,.6);box-shadow:0 0 16px rgba(167,139,250,.2);}
.app-btn[data-color="red"]{border-color:rgba(255,60,90,.25);}
.app-btn[data-color="red"]:hover{border-color:rgba(255,60,90,.6);box-shadow:0 0 16px rgba(255,60,90,.2);}
.app-btn[data-color="cyan"]{border-color:rgba(0,245,255,.25);}
.app-btn[data-color="cyan"]:hover{border-color:rgba(0,245,255,.6);box-shadow:0 0 16px rgba(0,245,255,.2);}
.app-btn[data-color="blue"]{border-color:rgba(0,136,255,.25);}
.app-btn[data-color="blue"]:hover{border-color:rgba(0,136,255,.6);box-shadow:0 0 16px rgba(0,136,255,.2);}
/* Delete button */
.del-btn{
  display:none;position:absolute;top:-8px;right:-8px;
  width:22px;height:22px;border-radius:50%;
  background:#ff3c5a;border:2px solid #fff;
  color:#fff;font-size:13px;line-height:18px;text-align:center;
  cursor:pointer;z-index:10;font-weight:bold;
}
body.edit-mode .del-btn{display:block;}
body.edit-mode .app-btn{border-style:dashed;animation:wiggle .4s infinite alternate;}
@keyframes wiggle{0%{transform:rotate(-1deg);}100%{transform:rotate(1deg);}}
/* Add button */
.add-btn{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:18px 8px;border-radius:14px;
  border:2px dashed rgba(0,245,255,.4);background:rgba(0,245,255,.05);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  font-size:2rem;color:rgba(0,245,255,.6);
}
body.edit-mode .add-btn{display:flex;}
/* Form overlay */
.form-overlay{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.7);align-items:flex-end;justify-content:center;
}
.form-overlay.open{display:flex;}
.form-sheet{
  background:linear-gradient(180deg,#0d2d5c,#0a1f3c);
  border:1.5px solid rgba(0,245,255,.3);border-radius:20px 20px 0 0;
  padding:24px 20px 32px;width:100%;max-width:420px;
}
.form-title{color:#00f5ff;font-size:.7rem;letter-spacing:.2em;margin-bottom:16px;text-align:center;}
.form-row{margin-bottom:12px;}
.form-label{font-size:.45rem;color:rgba(255,255,255,.5);letter-spacing:.1em;margin-bottom:4px;}
.form-input{
  width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(0,245,255,.2);
  border-radius:8px;padding:10px 12px;color:#e0e8ff;
  font-family:'Orbitron',monospace;font-size:.55rem;outline:none;
}
.form-input:focus{border-color:rgba(0,245,255,.5);}
.form-select{
  width:100%;background:#0d2d5c;border:1.5px solid rgba(0,245,255,.2);
  border-radius:8px;padding:10px 12px;color:#e0e8ff;
  font-family:'Orbitron',monospace;font-size:.55rem;outline:none;
}
.color-row{display:flex;gap:8px;flex-wrap:wrap;}
.color-dot{
  width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:border-color .2s;
}
.color-dot.selected{border-color:#fff;}
.color-dot.cyan{background:#00f5ff;}
.color-dot.green{background:#00ff88;}
.color-dot.purple{background:#a78bfa;}
.color-dot.orange{background:#ffa500;}
.color-dot.red{background:#ff3c5a;}
.color-dot.blue{background:#0088ff;}
.form-btns{display:flex;gap:10px;margin-top:16px;}
.btn-save{
  flex:1;background:rgba(0,245,255,.15);border:1.5px solid rgba(0,245,255,.4);
  border-radius:10px;padding:12px;color:#00f5ff;
  font-family:'Orbitron',monospace;font-size:.55rem;letter-spacing:.1em;cursor:pointer;
}
.btn-cancel{
  flex:1;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.2);
  border-radius:10px;padding:12px;color:rgba(255,255,255,.5);
  font-family:'Orbitron',monospace;font-size:.55rem;letter-spacing:.1em;cursor:pointer;
}
.info{position:relative;z-index:2;margin-top:16px;font-size:.4rem;
  letter-spacing:.12em;color:rgba(255,255,255,.3);text-align:center;}
</style>
</head>
<body>
<div class="stars">
  <div class="star s1">✦</div><div class="star s2">✦</div>
  <div class="star s3">✦</div><div class="star s4">✦</div>
  <div class="star s5">✦</div><div class="star s6">✦</div>
  <div class="star s7">✦</div><div class="star s8">✦</div>
</div>

<div class="head">
  <div style="font-size:1.8rem;margin-bottom:4px;">🚀</div>
  <div class="head-row">
    <div>
      <div class="title">STARTER</div>
      <div class="ver">v1.6.Kl</div>
      <div class="sub">ANDROID · APP LAUNCHER</div>
    </div>
    <button class="edit-btn" id="editBtn" onclick="toggleEdit()">✏️ UPRAVIT</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="info" id="infoText">Funguje pouze na Android · Otevře nainstalovanou appku</div>

<!-- Form overlay -->
<div class="form-overlay" id="formOverlay">
  <div class="form-sheet">
    <div class="form-title">➕ PŘIDAT APPKU</div>
    <div class="form-row">
      <div class="form-label">IKONA (emoji)</div>
      <input class="form-input" id="fIcon" type="text" placeholder="📱" maxlength="4">
    </div>
    <div class="form-row">
      <div class="form-label">NÁZEV</div>
      <input class="form-input" id="fName" type="text" placeholder="NÁZEV APPKY" maxlength="20">
    </div>
    <div class="form-row">
      <div class="form-label">TYP</div>
      <select class="form-select" id="fType" onchange="typeChanged()">
        <option value="android">Android appka (package)</option>
        <option value="url">Webová URL</option>
      </select>
    </div>
    <div class="form-row" id="fTargetRow">
      <div class="form-label" id="fTargetLabel">PACKAGE NAME</div>
      <input class="form-input" id="fTarget" type="text" placeholder="com.example.app">
    </div>
    <div class="form-row">
      <div class="form-label">BARVA RÁMEČKU</div>
      <div class="color-row" id="colorRow"></div>
    </div>
    <div class="form-btns">
      <button class="btn-cancel" onclick="closeForm()">ZRUŠIT</button>
      <button class="btn-save" onclick="saveApp()">ULOŽIT</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'starter_v1';
const UC_IMG =  + UC_IMG + ;
const KW_IMG =  + KW_IMG + ;

const DEFAULT_APPS = [
  {id:1,icon:'🖥',name:'CONNECT\nBOT',type:'android',target:'org.connectbot',color:'cyan'},
  {id:2,icon:'🐙',name:'GITHUB',type:'android',target:'com.github.android',color:'green'},
  {id:3,icon:'📡',name:'OBS\nREMOTE',type:'url',target:'https://obs-web.niek.tv/',color:'purple'},
  {id:4,icon:'☁️',name:'MIXCLOUD',type:'android',target:'com.mixcloud.player',color:'cyan'},
  {id:5,icon:UC_IMG,name:'UNIVERSAL\nCONTROL',type:'android',target:'com.presonus.ucremote',color:'cyan'},
  {id:6,icon:'🎚',name:'MY\nPRESONUS',type:'android',target:'com.presonus.mypresonus',color:'blue'},
  {id:7,icon:'📷',name:'IRIUN\nWEBCAM',type:'android',target:'com.jacksoftw.webcam',color:'green'},
  {id:8,icon:'🔔',name:'NTFY',type:'android',target:'io.heckel.ntfy',color:'red'},
  {id:9,icon:KW_IMG,name:'KLADYX\nWEB',type:'url',target:'https://kladyx.github.io/kladyxland/',color:'cyan'}
];

const COLORS = ['cyan','green','purple','orange','red','blue'];
let apps = [];
let editMode = false;
let selectedColor = 'cyan';
let nextId = 100;

function loadApps() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const d = JSON.parse(s);
      if (d && d.apps && Array.isArray(d.apps)) {
        apps = d.apps;
        nextId = d.nextId || 100;
        return;
      }
    }
  } catch(e) {}
  apps = DEFAULT_APPS.map(a => ({...a}));
  nextId = 100;
}

function saveApps() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({apps, nextId}));
}

function renderIcon(icon) {
  if (icon && (icon.startsWith('data:') || icon.startsWith('http'))) {
    return '<img src="' + icon + '">';
  }
  return icon || '📱';
}

function renderGrid() {
  const grid = document.getElementById('grid');
  let html = '';
  apps.forEach(app => {
    const nameParts = app.name.split('\n');
    const nameHtml = nameParts.join('<br>');
    html += '<div class="app-btn" data-color="' + app.color + '" onclick="appClick(' + app.id + ')">';
    html += '<div class="del-btn" onclick="event.stopPropagation();deleteApp(' + app.id + ')">×</div>';
    html += '<div class="app-icon">' + renderIcon(app.icon) + '</div>';
    html += '<div class="app-name">' + nameHtml + '</div>';
    html += '</div>';
  });
  if (editMode) {
    html += '<div class="add-btn" onclick="openForm()">＋</div>';
  }
  grid.innerHTML = html;
  document.getElementById('infoText').textContent = editMode
    ? '✏️ Režim úprav · Klikni × pro smazání · ＋ pro přidání'
    : 'Funguje pouze na Android · Otevře nainstalovanou appku';
}

function appClick(id) {
  if (editMode) return;
  const app = apps.find(a => a.id === id);
  if (!app) return;
  if (app.type === 'android') {
    launch(app.target);
  } else {
    (window.top || window).open(app.target, '_blank');
  }
}

function toggleEdit() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  document.getElementById('editBtn').classList.toggle('active', editMode);
  document.getElementById('editBtn').textContent = editMode ? '✅ HOTOVO' : '✏️ UPRAVIT';
  renderGrid();
}

function deleteApp(id) {
  if (!confirm('Smazat tuto appku?')) return;
  apps = apps.filter(a => a.id !== id);
  saveApps();
  renderGrid();
}

function openForm() {
  document.getElementById('fIcon').value = '';
  document.getElementById('fName').value = '';
  document.getElementById('fType').value = 'android';
  document.getElementById('fTarget').value = '';
  selectedColor = 'cyan';
  typeChanged();
  renderColorPicker();
  document.getElementById('formOverlay').classList.add('open');
}

function closeForm() {
  document.getElementById('formOverlay').classList.remove('open');
}

function typeChanged() {
  const type = document.getElementById('fType').value;
  document.getElementById('fTargetLabel').textContent = type === 'android' ? 'PACKAGE NAME' : 'URL ADRESA';
  document.getElementById('fTarget').placeholder = type === 'android' ? 'com.example.app' : 'https://...';
}

function renderColorPicker() {
  const row = document.getElementById('colorRow');
  row.innerHTML = COLORS.map(c =>
    '<div class="color-dot ' + c + (c === selectedColor ? ' selected' : '') + '" onclick="selectColor('' + c + '')" data-c="' + c + '"></div>'
  ).join('');
}

function selectColor(c) {
  selectedColor = c;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.toggle('selected', d.dataset.c === c));
}

function saveApp() {
  const icon = document.getElementById('fIcon').value.trim() || '📱';
  const name = document.getElementById('fName').value.trim().toUpperCase();
  const type = document.getElementById('fType').value;
  const target = document.getElementById('fTarget').value.trim();
  if (!name) { alert('Zadej název'); return; }
  if (!target) { alert('Zadej package nebo URL'); return; }
  apps.push({id: nextId++, icon, name, type, target, color: selectedColor});
  saveApps();
  closeForm();
  renderGrid();
}

function launch(pkg) {
  try {
    (window.top || window).location.href = 'intent://#Intent;package=' + pkg + ';end';
  } catch(e) { alert('Nelze otevřít: ' + pkg); }
}

// Init
renderColorPicker();
loadApps();
renderGrid();
</script>
</body>
</html>
