<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KLADYX READER</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{--bg:#050810;--surface:#080d1c;--surface2:#0d1428;--cyan:#00d4ff;--muted:#5a6488;--light:#dde4ff;--border:rgba(0,212,255,0.18);--font:"Courier New",monospace;--fs:17px;--lh:1.75;--mx:20px;}
    html,body{width:100%;height:100%;background:var(--bg);font-family:var(--font);color:var(--light);overflow:hidden;}
    @keyframes starPulse{0%,100%{opacity:.15;transform:scale(.5);}50%{opacity:1;transform:scale(2.2);box-shadow:0 0 8px #00f5ff,0 0 16px rgba(0,245,255,.5);}}
    .star{position:absolute;width:3px;height:3px;background:#00a0ff;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:starPulse 2s ease-in-out infinite;pointer-events:none;}
    .star.big{width:7px;height:7px;}
    #stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
    #upload-screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .4s;}
    #upload-screen.hidden{opacity:0;pointer-events:none;}
    .logo{font-size:1.9rem;font-weight:900;letter-spacing:8px;color:var(--cyan);text-shadow:0 0 30px var(--cyan);}
    .logo-sub{font-size:.55rem;letter-spacing:4px;color:var(--muted);margin-top:-12px;}
    .upload-zone{position:relative;width:min(320px,90vw);padding:36px 24px;border:1px dashed rgba(0,212,255,.35);border-radius:10px;background:rgba(0,212,255,.04);display:flex;flex-direction:column;align-items:center;gap:16px;cursor:pointer;transition:background .2s,border-color .2s;}
    .upload-zone:hover,.upload-zone.drag{background:rgba(0,212,255,.1);border-color:var(--cyan);}
    .upload-icon{font-size:2.8rem;line-height:1;}
    .upload-label{font-size:.72rem;letter-spacing:2px;color:var(--muted);text-align:center;text-transform:uppercase;}
    .upload-types{font-size:.6rem;letter-spacing:1px;color:rgba(90,100,136,.7);}
    #file-input{position:absolute;inset:0;opacity:0;cursor:pointer;}
    .recent-label{font-size:.55rem;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}
    #reader-screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .4s;}
    #reader-screen.active{opacity:1;pointer-events:all;}
    #topbar{flex-shrink:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(5,8,16,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:20;}
    .tb-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:6px;line-height:1;transition:color .15s;}
    .tb-btn:hover{color:var(--cyan);}
    #book-title{font-size:.6rem;letter-spacing:2px;color:var(--light);max-width:55vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    #content-area{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;}
    #epub-viewer{flex:1;overflow:hidden;background:var(--bg);}
    #pdf-viewer{flex:1;overflow-y:auto;overflow-x:hidden;display:none;flex-direction:column;align-items:center;padding:16px var(--mx);gap:12px;background:var(--bg);-webkit-overflow-scrolling:touch;}
    #pdf-viewer canvas{max-width:100%;height:auto!important;border:1px solid var(--border);border-radius:4px;display:block;}
    .tap-zone{position:absolute;top:0;bottom:0;width:50%;z-index:10;cursor:pointer;-webkit-tap-highlight-color:transparent;display:none;}
    #tap-prev{left:0;}
    #tap-next{right:0;}
    .tap-zone.flash{background:rgba(0,212,255,0.07);}
    .tap-hint{position:absolute;top:50%;transform:translateY(-50%);font-size:1.8rem;opacity:0;transition:opacity 0.15s;pointer-events:none;color:rgba(0,212,255,0.4);}
    #tap-prev .tap-hint{left:8px;}
    #tap-next .tap-hint{right:8px;}
    #bottombar{flex-shrink:0;background:rgba(5,8,16,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:8px 16px 12px;display:flex;flex-direction:column;gap:8px;z-index:20;}
    #progress-bar-wrap{width:100%;height:3px;background:rgba(0,212,255,.1);border-radius:2px;cursor:pointer;}
    #progress-bar{height:100%;background:var(--cyan);border-radius:2px;width:0%;transition:width .3s;}
    .nav-row{display:flex;align-items:center;justify-content:space-between;}
    .nav-btn{display:flex;align-items:center;gap:6px;background:rgba(0,212,255,.07);border:1px solid var(--border);color:var(--light);font-family:var(--font);font-size:.65rem;letter-spacing:1.5px;padding:7px 14px;border-radius:5px;cursor:pointer;transition:background .15s,border-color .15s;}
    .nav-btn:hover{background:rgba(0,212,255,.15);border-color:var(--cyan);}
    .nav-btn:disabled{opacity:.3;cursor:not-allowed;}
    #page-info{font-size:.58rem;letter-spacing:1px;color:var(--muted);}
    #settings-panel{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(8,13,28,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);border-radius:16px 16px 0 0;padding:20px 20px 32px;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
    #settings-panel.open{transform:translateY(0);}
    .panel-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px;}
    .panel-title{font-size:.6rem;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;margin-bottom:18px;}
    .setting-row{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
    .setting-label{font-size:.58rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;}
    .setting-label span{color:var(--cyan);}
    input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:rgba(0,212,255,.15);border-radius:2px;outline:none;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--cyan);border-radius:50%;cursor:pointer;box-shadow:0 0 8px rgba(0,212,255,.5);}
    .font-family-btns{display:flex;gap:8px;flex-wrap:wrap;}
    .ff-btn{padding:6px 12px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--muted);font-family:var(--font);font-size:.65rem;cursor:pointer;transition:.15s;}
    .ff-btn.active,.ff-btn:hover{border-color:var(--cyan);color:var(--light);background:rgba(0,212,255,.1);}
    .theme-btns{display:flex;gap:8px;}
    .theme-btn{flex:1;padding:8px;border-radius:5px;border:1px solid var(--border);cursor:pointer;font-family:var(--font);font-size:.6rem;letter-spacing:1px;transition:.15s;}
    .theme-btn.dark{background:#050810;color:#dde4ff;}
    .theme-btn.sepia{background:#1a1208;color:#d4b896;}
    .theme-btn.light{background:#f0ede8;color:#1a1208;}
    .theme-btn.active{border-color:var(--cyan);box-shadow:0 0 8px rgba(0,212,255,.3);}
    #toc-panel{position:fixed;inset:0;z-index:25;background:rgba(5,8,16,.96);backdrop-filter:blur(20px);transform:translateX(-100%);transition:transform .3s;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch;}
    #toc-panel.open{transform:translateX(0);}
    .toc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
    .toc-title{font-size:.65rem;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;}
    .toc-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;}
    .toc-item{display:block;padding:11px 14px;margin-bottom:4px;border:1px solid transparent;border-radius:5px;color:var(--muted);font-size:.7rem;letter-spacing:1px;cursor:pointer;transition:.15s;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .toc-item:hover{color:var(--light);border-color:var(--border);background:rgba(0,212,255,.06);}
    .toc-item.active{color:var(--cyan);border-color:rgba(0,212,255,.3);}
    #pdf-loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(5,8,16,.85);z-index:15;}
    #pdf-loading.show{display:flex;}
    .loading-spinner{width:36px;height:36px;border:2px solid rgba(0,212,255,.2);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading-text{font-size:.6rem;letter-spacing:2px;color:var(--muted);}
    #toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:rgba(8,13,28,.95);border:1px solid var(--border);color:var(--light);font-size:.65rem;letter-spacing:1.5px;padding:8px 18px;border-radius:5px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
    #toast.show{opacity:1;}
    #overlay{position:fixed;inset:0;z-index:22;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;}
    #overlay.show{opacity:1;pointer-events:all;}
    #bookmarks-panel{position:fixed;inset:0;z-index:25;background:rgba(5,8,16,.97);backdrop-filter:blur(20px);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch;}
    #bookmarks-panel.open{transform:translateX(0);}
    .bm-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .bm-title{font-size:.65rem;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;}
    .bm-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;}
    .bm-save-btn{width:100%;padding:11px;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.35);border-radius:6px;color:var(--cyan);font-family:var(--font);font-size:.65rem;letter-spacing:2px;cursor:pointer;margin-bottom:10px;transition:.15s;}
    .bm-save-btn:hover{background:rgba(0,212,255,.2);}
    #save-file-btn.saving { animation: saveBtnSaving 0.6s ease-in-out; }
    #save-file-btn.saved { background:rgba(255,60,90,.2) !important; border-color:rgba(255,60,90,.4) !important; color:#ff3c5a !important; }
    @keyframes saveBtnSaving { 0% { transform:scale(1); } 50% { transform:scale(1.05); } 100% { transform:scale(1); } }
    @keyframes githubPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,212,255,.5),0 0 12px rgba(0,212,255,.3);}50%{box-shadow:0 0 0 10px rgba(0,212,255,0),0 0 24px rgba(0,212,255,.6);}}
    .github-auto-btn{width:min(320px,90vw);padding:13px 18px;background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.45);border-radius:8px;color:var(--cyan);font-family:var(--font);font-size:.7rem;letter-spacing:2px;cursor:pointer;animation:githubPulse 2s ease-in-out infinite;transition:background .15s;}
    .github-auto-btn:hover{background:rgba(0,212,255,.25);animation:none;}
    .bm-io-row{display:flex;gap:8px;margin-bottom:18px;}
    .bm-io-btn{flex:1;padding:9px 6px;border-radius:6px;font-family:var(--font);font-size:.6rem;letter-spacing:1.5px;cursor:pointer;transition:.15s;}
    .bm-io-btn.export{background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.3);color:#00ff88;}
    .bm-io-btn.export:hover{background:rgba(0,255,136,.15);}
    .bm-io-btn.import{background:rgba(255,200,0,.07);border:1px solid rgba(255,200,0,.3);color:#ffc800;}
    .bm-io-btn.import:hover{background:rgba(255,200,0,.15);}
    .bm-section{font-size:.55rem;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
    .bm-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;margin-bottom:6px;border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:.15s;gap:8px;}
    .bm-item:hover{background:rgba(0,212,255,.06);border-color:rgba(0,212,255,.3);}
    .bm-info{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
    .bm-name{font-size:.7rem;color:var(--light);}
    .bm-meta{font-size:.55rem;color:var(--muted);}
    .bm-del{background:none;border:none;color:#ff3c5a;cursor:pointer;font-size:.85rem;padding:4px 8px;}
    #archive-panel{position:fixed;inset:0;z-index:25;background:rgba(5,8,16,.97);backdrop-filter:blur(20px);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch;}
    #archive-panel.open{transform:translateY(0);}
    .arc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .arc-title{font-size:.65rem;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;}
    .arc-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;}
    .arc-auto-row{display:flex;gap:8px;margin-bottom:16px;}
    .arc-auto-btn{flex:1;padding:9px 6px;border-radius:6px;font-family:var(--font);font-size:.6rem;letter-spacing:1.5px;cursor:pointer;transition:.15s;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);color:var(--cyan);}
    .arc-auto-btn:hover{background:rgba(0,212,255,.2);}
    .arc-auto-btn.loading{opacity:.5;cursor:not-allowed;}
    .arc-empty{text-align:center;padding:20px;color:var(--muted);font-size:.7rem;line-height:1.6;}
    .arc-item{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:6px;border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:.15s;}
    .arc-item:hover{background:rgba(0,212,255,.06);border-color:rgba(0,212,255,.3);}
    .arc-icon{font-size:1.3rem;}
    .arc-info{flex:1;min-width:0;}
    .arc-name{font-size:.7rem;color:var(--light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .arc-meta{font-size:.55rem;color:var(--muted);margin-top:2px;}
    .arc-del{background:none;border:none;color:#ff3c5a;cursor:pointer;font-size:.9rem;padding:4px;flex-shrink:0;}
  </style>
</head>
<body>

<div id="stars"></div>

<!-- UPLOAD SCREEN -->
<div id="upload-screen">
  <div class="logo">KLADYX</div>
  <div class="logo-sub">READER</div>
  <div style="font-size:.5rem;letter-spacing:3px;color:var(--cyan);margin-top:-8px;text-shadow:0 0 8px rgba(0,212,255,.5);">v8.0Kl</div>
  <div class="upload-zone" id="upload-zone">
    <div class="upload-icon">📖</div>
    <label class="upload-label">Vložit EPUB nebo PDF</label>
    <div class="upload-types">(nebo přetáhni soubor)</div>
    <input type="file" id="file-input" accept=".epub,.pdf">
  </div>
  <div style="max-width:320px;text-align:center;">
    <div class="recent-label">NEBO</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">
      <input type="text" id="github-url-input" placeholder="GitHub RAW URL..." style="background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.25);color:var(--light);padding:9px 12px;border-radius:5px;font-family:var(--font);font-size:.65rem;">
      <button onclick="loadFromGithub()" style="background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.3);color:var(--cyan);padding:9px 12px;border-radius:5px;cursor:pointer;font-family:var(--font);font-size:.65rem;transition:.15s;">📥 NAČÍST Z GITHUB</button>
    </div>
  </div>
  <button onclick="openArchive()" class="nav-btn" style="margin-top:8px;">📚 ARCHIV</button>
  <button onclick="autoLoadHomeBtn()" id="home-auto-btn" class="github-auto-btn">🔄 AUTO STÁHNOUT Z GITHUB</button>
</div>

<!-- READER SCREEN -->
<div id="reader-screen">
  <div id="topbar">
    <button class="tb-btn" id="home-btn" title="Domů">🏠</button>
    <div id="book-title"></div>
    <div style="display:flex;gap:4px;">
      <button class="tb-btn" onclick="openToc()" title="Obsah">📑</button>
      <button class="tb-btn" onclick="openBookmarks()" title="Záložky">🔖</button>
      <button class="tb-btn" onclick="openSettings()" title="Nastavení">⚙️</button>
    </div>
  </div>
  <div id="content-area">
    <div id="tap-prev" class="tap-zone"><span class="tap-hint">‹</span></div>
    <div id="tap-next" class="tap-zone"><span class="tap-hint">›</span></div>
    <div id="epub-viewer"></div>
    <div id="pdf-viewer"></div>
    <div id="pdf-loading"><div class="loading-spinner"></div><div class="loading-text">NAČÍTÁM PDF…</div></div>
  </div>
  <div id="bottombar">
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    <div class="nav-row">
      <button class="nav-btn" id="prev-btn">← PŘEDCHOZÍ</button>
      <div id="page-info"></div>
      <button class="nav-btn" id="next-btn">DALŠÍ →</button>
    </div>
  </div>
</div>

<!-- SETTINGS PANEL -->
<div id="settings-panel">
  <div class="panel-handle"></div>
  <div class="panel-title">NASTAVENÍ</div>
  
  <div class="setting-row">
    <div class="setting-label">Velikost písma <span id="fs-val">100%</span></div>
    <input type="range" id="font-size-slider" min="50" max="250" value="100">
  </div>
  
  <div class="setting-row">
    <div class="setting-label">Řádkování <span id="lh-val">1.75</span></div>
    <input type="range" id="line-height-slider" min="1" max="2.5" step="0.1" value="1.75">
  </div>
  
  <div class="setting-row">
    <div class="setting-label" style="margin-bottom:8px;">Písmo</div>
    <div class="font-family-btns">
      <button class="ff-btn active" data-font="Courier New">Courier</button>
      <button class="ff-btn" data-font="Georgia">Georgia</button>
      <button class="ff-btn" data-font="Times New Roman">Times</button>
      <button class="ff-btn" data-font="Arial">Arial</button>
    </div>
  </div>
  
  <div class="setting-row">
    <div class="setting-label" style="margin-bottom:8px;">Téma</div>
    <div class="theme-btns">
      <button class="theme-btn dark active" data-theme="dark">🌑 DARK</button>
      <button class="theme-btn sepia" data-theme="sepia">📖 SEPIA</button>
      <button class="theme-btn light" data-theme="light">☀️ LIGHT</button>
    </div>
  </div>
  
  <div class="setting-row">
    <button id="save-file-btn" class="bm-save-btn">💾 ULOŽIT SOUBOR</button>
  </div>
  <div class="setting-row" style="margin-top:8px;">
    <button id="reset-settings-btn" class="bm-save-btn" style="background:rgba(255,60,90,.08);border-color:rgba(255,60,90,.3);color:#ff3c5a;">↺ RESET NASTAVENÍ</button>
  </div>
</div>

<!-- BOOKMARKS PANEL -->
<div id="bookmarks-panel">
  <div class="bm-header">
    <div class="bm-title">ZÁLOŽKY</div>
    <button class="bm-close" onclick="closeBookmarks()">✕</button>
  </div>
  <button class="bm-save-btn" id="bm-add-here-btn" onclick="saveBookmarkHere()">📌 ULOŽIT ZÁLOŽKU ZDE</button>
  <div class="bm-io-row">
    <button class="bm-io-btn export" onclick="exportBookmarks()">📤 EXPORT</button>
    <button class="bm-io-btn import" onclick="importBookmarks()">📥 IMPORT</button>
  </div>
  <input type="file" id="bm-import-file" accept=".json" style="display:none;">
  <div id="bookmarks-list"></div>
</div>

<!-- TABLE OF CONTENTS PANEL -->
<div id="toc-panel">
  <div class="toc-header">
    <div class="toc-title">OBSAH</div>
    <button class="toc-close" onclick="closeToc()">✕</button>
  </div>
  <div id="toc-list"></div>
</div>

<!-- ARCHIVE PANEL -->
<div id="archive-panel">
  <div class="arc-header">
    <div class="arc-title">ARCHIV KNIH</div>
    <div id="arc-count" style="font-size:.6rem;letter-spacing:2px;color:#00ff88;margin-top:-10px;margin-bottom:12px;">POČET KNIH V ARCHIVU: 0</div>
    <button class="arc-close" onclick="closeArchive()">✕</button>
  </div>
  <div class="arc-auto-row" style="display:flex;flex-direction:column;gap:8px;">
    <button class="arc-auto-btn" id="auto-load-btn" onclick="autoLoadGithubBooks()">🔄 AUTO NAČÍST Z GITHUB</button>
    <button class="arc-auto-btn" onclick="closeArchive();openBookmarks();" style="background:linear-gradient(135deg,rgba(255,193,7,.15),rgba(255,193,7,.05));border:1px solid rgba(255,193,7,.4);color:#ffc107;">📌 ZÁLOŽKY</button>
  </div>
  <div id="arc-list"></div>
</div>

<!-- TRANSLATE BUBBLE -->
<div id="translate-bubble" style="display:none;position:fixed;z-index:999;max-width:220px;background:rgba(10,15,30,.97);border:1px solid rgba(0,212,255,.4);border-radius:12px;padding:10px 14px;box-shadow:0 4px 24px rgba(0,0,0,.7),0 0 12px rgba(0,212,255,.15);pointer-events:none;">
  <div id="tb-word" style="font-size:.75rem;letter-spacing:2px;color:#00d4ff;font-family:'Courier New',monospace;font-weight:700;margin-bottom:4px;"></div>
  <div id="tb-trans" style="font-size:.9rem;color:#e8f4f8;font-family:'Courier New',monospace;"></div>
</div>

<!-- OVERLAY -->
<div id="overlay" onclick="closeAllPanels()"></div>

<!-- TOAST -->
<div id="toast"></div>

<script>
  // ──────────────────────────────────────────────────────────────
  // GLOBÁLNÍ PROMĚNNÉ
  // ──────────────────────────────────────────────────────────────
  var currentFile={};var bookType=null;var epubBook=null;var epubRendition=null;var pdfDoc=null;var currentPdfPage=1;var pdfPages=0;
  var bookmarks=JSON.parse(localStorage.getItem('kladyx-bm')||'[]');
  var settings={fs:100,lh:1.75,font:'Courier New',theme:'dark'};
  var githubBooks=[];
  
  // ──────────────────────────────────────────────────────────────
  // INICIALIZACE
  // ──────────────────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded',function(){
    loadSettings();
    genStars();
    setupEventListeners();
  });
  
  function setupEventListeners(){
    // Upload
    document.getElementById('upload-zone').addEventListener('click',function(){document.getElementById('file-input').click();});
    document.getElementById('upload-zone').addEventListener('dragover',function(e){e.preventDefault();this.classList.add('drag');});
    document.getElementById('upload-zone').addEventListener('dragleave',function(){this.classList.remove('drag');});
    document.getElementById('upload-zone').addEventListener('drop',function(e){e.preventDefault();this.classList.remove('drag');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);});
    document.getElementById('file-input').addEventListener('change',function(e){if(this.files.length)handleFile(this.files[0]);});
    
    // Reader buttons
    document.getElementById('home-btn').addEventListener('click',goHome);
    document.getElementById('prev-btn').addEventListener('click',prevPage);
    document.getElementById('next-btn').addEventListener('click',nextPage);
    
    // TAP ZONES - poklepání na levou/pravou část obrazovky
    function setupTapZones(){
      var tzPrev=document.getElementById('tap-prev');
      var tzNext=document.getElementById('tap-next');
      function flashZone(el,fn){
        el.classList.add('flash');
        el.querySelector('.tap-hint').style.opacity='1';
        setTimeout(function(){el.classList.remove('flash');el.querySelector('.tap-hint').style.opacity='0';},200);
        fn();
      }
      tzPrev.addEventListener('click',function(){flashZone(tzPrev,prevPage);});
      tzNext.addEventListener('click',function(){flashZone(tzNext,nextPage);});
    }
    setupTapZones();
    
    // Settings
    document.getElementById('font-size-slider').addEventListener('input',function(){settings.fs=this.value;applySettings();});
    document.getElementById('line-height-slider').addEventListener('input',function(){settings.lh=this.value;applySettings();});
    document.querySelectorAll('.ff-btn').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.ff-btn').forEach(function(x){x.classList.remove('active');});this.classList.add('active');settings.font=this.dataset.font;applySettings();});});
    document.querySelectorAll('.theme-btn').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.theme-btn').forEach(function(x){x.classList.remove('active');});this.classList.add('active');settings.theme=this.dataset.theme;applySettings();});});
    document.getElementById('save-file-btn').addEventListener('click',saveCurrentFile);
    document.getElementById('reset-settings-btn').addEventListener('click',function(){
      localStorage.removeItem('kladyx-settings');
      settings={fs:window.innerWidth<768?150:100,lh:1.75,font:'Courier New',theme:'dark'};
      loadSettings();
      toast('✓ Nastavení resetováno');
    });
    
    // Panels
    document.getElementById('bm-import-file').addEventListener('change',function(){if(this.files.length){var r=new FileReader();r.onload=function(e){try{var data=JSON.parse(e.target.result);bookmarks=data;localStorage.setItem('kladyx-bm',JSON.stringify(bookmarks));renderBookmarks();toast('✓ Záložky načteny');}catch(err){toast('⛔ Chyba načtení záložek');}};r.readAsText(this.files[0]);}});
  }
  
  function genStars(){
    var container=document.getElementById('stars');
    for(var i=0;i<50;i++){
      var s=document.createElement('div');
      s.className='star'+(Math.random()>.7?' big':'');
      s.style.left=Math.random()*100+'%';
      s.style.top=Math.random()*100+'%';
      s.style.animationDelay=(Math.random()*2)+'s';
      container.appendChild(s);
    }
  }
  
  function toast(msg){
    var el=document.getElementById('toast');
    el.textContent=msg;
    el.classList.add('show');
    setTimeout(function(){el.classList.remove('show');},3000);
  }
  
  // ── PŘEKLADAČ SLOV ──────────────────────────────────────────
  var _tbTimeout=null;
  function showTranslateBubble(word,x,y){
    var bub=document.getElementById('translate-bubble');
    var wEl=document.getElementById('tb-word');
    var tEl=document.getElementById('tb-trans');
    wEl.textContent=word.toUpperCase();
    tEl.textContent='…';
    // Pozice bubliny
    bub.style.display='block';
    var bw=bub.offsetWidth||220;
    var bh=bub.offsetHeight||70;
    var left=Math.min(x,window.innerWidth-bw-10);
    var top=y-bh-12;
    if(top<10)top=y+20;
    bub.style.left=left+'px';
    bub.style.top=top+'px';
    clearTimeout(_tbTimeout);
    _tbTimeout=setTimeout(function(){bub.style.display='none';},5000);
    // API volání
    fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(word)+'&langpair=en|cs')
      .then(function(r){return r.json();})
      .then(function(d){
        var t=d&&d.responseData&&d.responseData.translatedText;
        if(t&&t.toLowerCase()!==word.toLowerCase()){
          tEl.textContent=t;
        } else {
          tEl.textContent='—';
        }
      })
      .catch(function(){tEl.textContent='⛔ chyba';});
  }

  // ────────────────────────────────────────────────────────────

  function closeAllPanels(){
    closeSettings();closeToc();closeBookmarks();closeArchive();
  }
  
  // ──────────────────────────────────────────────────────────────
  // HOME - NÁVRAT NA HLAVNÍ STRÁNKU
  // ──────────────────────────────────────────────────────────────
  function goHome(){
    if(confirm('Chceš opravdu odejít z čtečky?\n\nTvé místo je automaticky uloženo.')){
      currentFile={};bookType=null;
      if(epubBook){epubBook.destroy();epubBook=null;epubRendition=null;}
      epubBook=null;
      if(pdfDoc){pdfDoc.destroy();}
      pdfDoc=null;
      document.getElementById('reader-screen').classList.remove('active');
      document.getElementById('upload-screen').classList.remove('hidden');
      document.getElementById('book-title').textContent='';
      document.getElementById('tap-prev').style.display='none';
      document.getElementById('tap-next').style.display='none';
      closeAllPanels();
    }
  }
  
  // ──────────────────────────────────────────────────────────────
  // NAHRÁVÁNÍ SOUBORU
  // ──────────────────────────────────────────────────────────────
  function handleFile(f){
    var ext=f.name.split('.').pop().toLowerCase();
    var reader=new FileReader();
    reader.onload=function(e){
      if(ext==='epub'){
        loadEpub({name:f.name},e.target.result);
      } else if(ext==='pdf'){
        loadPdf({name:f.name},e.target.result);
      } else {
        toast('⛔ Nepodporovaný formát');
      }
    };
    reader.onerror=function(){toast('⛔ Chyba čtení souboru');};
    reader.readAsArrayBuffer(f);
  }
  
  // ──────────────────────────────────────────────────────────────
  // EPUB
  // ──────────────────────────────────────────────────────────────
  function loadEpub(f,buf){
    var savedBuf=buf.slice(0);
    currentFile={name:f.name,data:savedBuf};
    bookType='epub';
    showReaderScreen();
    var viewer=document.getElementById('epub-viewer');
    var w=viewer.offsetWidth||window.innerWidth;
    var h=viewer.offsetHeight||(window.innerHeight-120);
    epubBook=ePub(buf);
    epubRendition=epubBook.renderTo('epub-viewer',{width:w,height:h,spread:'none',flow:'paginated'});
    epubBook.ready.then(function(){
      var meta=epubBook.packaging&&epubBook.packaging.metadata;
      var title=meta&&meta.title?meta.title:f.name;
      document.getElementById('book-title').textContent=title;
      var toc=[];
      try{
        (epubBook.navigation.toc||[]).forEach(function(item,i){
          toc.push({href:item.href,label:item.label||(i+1)+'.'});
        });
      }catch(e){}
      renderToc(toc,function(item){epubRendition.display(item.href);});
      epubRendition.on('relocated',updateEpubProgress);
      epubRendition.display();
      applySettings();
    }).catch(function(e){toast('⛔ Chyba EPUB: '+e.message);console.error(e);});
    document.getElementById('prev-btn').onclick=function(){epubRendition.prev();};
    document.getElementById('next-btn').onclick=function(){epubRendition.next();};
    document.addEventListener('click',function(e){
      var bub=document.getElementById('translate-bubble');
      if(bub.style.display!=='none')bub.style.display='none';
    });
    epubRendition.on('rendered',function(section,view){
      try{
        var iframeDoc=view.document||view.iframe.contentDocument||view.iframe.contentWindow.document;
        iframeDoc.addEventListener('mouseup',function(e){
          var sel=iframeDoc.getSelection();
          var word='';
          if(sel&&sel.toString().trim().length>0){
            word=sel.toString().trim().split(/\s+/)[0];
          } else {
            // klik bez výběru - vezmi slovo pod kurzorem
            if(iframeDoc.caretRangeFromPoint){
              var r=iframeDoc.caretRangeFromPoint(e.clientX,e.clientY);
              if(r){r.expand('word');word=r.toString();}
            }
          }
          word=word.replace(/[^a-zA-Z'\-]/g,'').trim();
          if(word.length<2)return;
          var iframe=document.querySelector('#epub-viewer iframe');
          var rect=iframe?iframe.getBoundingClientRect():{left:0,top:0};
          var px=rect.left+e.clientX;
          var py=rect.top+e.clientY;
          showTranslateBubble(word,px,py);
        });
      }catch(err){console.warn('translate hook:',err);}
    });
  }
  
  function updateEpubProgress(){
    if(!epubRendition)return;
    try{
      var prog=epubRendition.currentLocation();
      if(prog&&prog.start){
        var pct=epubBook.locations.percentageFromCfi(prog.start.cfi);
        if(!isNaN(pct)&&pct>=0){
          var p=Math.round(pct*100);
          document.getElementById('progress-bar').style.width=p+'%';
          document.getElementById('page-info').textContent=p+'%';
        }
      }
    }catch(e){}
  }
  
  // ──────────────────────────────────────────────────────────────
  // PDF
  // ──────────────────────────────────────────────────────────────
  function loadPdf(f,buf){
    var savedBuf=buf.slice(0);
    currentFile={name:f.name,data:savedBuf};
    bookType='pdf';
    document.getElementById('epub-viewer').style.display='none';
    document.getElementById('pdf-viewer').style.display='flex';
    document.getElementById('book-title').textContent=f.name;
    pdfjsLib.getDocument(buf).promise.then(function(pdf){
      pdfDoc=pdf;
      pdfPages=pdf.numPages;
      currentPdfPage=1;
      renderPdfPage(1);
      showReaderScreen();
      applySettings();
    }).catch(function(e){toast('⛔ Chyba načítání PDF: '+e.message);});
  }
  
  function renderPdfPage(num){
    if(!pdfDoc||num<1||num>pdfPages)return;
    currentPdfPage=num;
    document.getElementById('pdf-loading').classList.add('show');
    pdfDoc.getPage(num).then(function(pg){
      var vp=pg.getViewport({scale:window.innerWidth<768?3:2});
      var c=document.createElement('canvas');
      c.width=vp.width;c.height=vp.height;
      var ctx=c.getContext('2d');
      pg.render({canvasContext:ctx,viewport:vp}).promise.then(function(){
        document.getElementById('pdf-loading').classList.remove('show');
        var viewer=document.getElementById('pdf-viewer');
        viewer.innerHTML='';
        viewer.appendChild(c);
        document.getElementById('progress-bar').style.width=(num/pdfPages*100)+'%';
        document.getElementById('page-info').textContent=num+' / '+pdfPages;
      });
    });
  }
  
  // ──────────────────────────────────────────────────────────────
  // NAVIGACE
  // ──────────────────────────────────────────────────────────────
  function prevPage(){
    if(bookType==='pdf'){
      if(currentPdfPage>1)renderPdfPage(currentPdfPage-1);
    } else if(epubRendition){
      epubRendition.prev();
    }
  }
  
  function nextPage(){
    if(bookType==='pdf'){
      if(currentPdfPage<pdfPages)renderPdfPage(currentPdfPage+1);
    } else if(epubRendition){
      epubRendition.next();
    }
  }
  
  // ──────────────────────────────────────────────────────────────
  // PANELY
  // ──────────────────────────────────────────────────────────────
  function openToc(){document.getElementById('toc-panel').classList.add('open');document.getElementById('overlay').classList.add('show');}
  function closeToc(){document.getElementById('toc-panel').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
  function openBookmarks(){renderBookmarks();document.getElementById('bookmarks-panel').classList.add('open');document.getElementById('overlay').classList.add('show');}
  function closeBookmarks(){document.getElementById('bookmarks-panel').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
  function openSettings(){document.getElementById('settings-panel').classList.add('open');document.getElementById('overlay').classList.add('show');}
  function closeSettings(){document.getElementById('settings-panel').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
  function openArchive(){renderArchive();document.getElementById('archive-panel').classList.add('open');document.getElementById('overlay').classList.add('show');}
  function closeArchive(){document.getElementById('archive-panel').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
  
  function renderToc(items,onItemClick){
    var list=document.getElementById('toc-list');
    list.innerHTML='';
    items.forEach(function(item){
      var div=document.createElement('div');
      div.className='toc-item';
      div.textContent=item.label;
      div.onclick=function(){onItemClick(item);closeToc();};
      list.appendChild(div);
    });
  }
  
  // ──────────────────────────────────────────────────────────────
  // ZÁLOŽKY
  // ──────────────────────────────────────────────────────────────
  function renderBookmarks(){
    var list=document.getElementById('bookmarks-list');
    if(!bookmarks.length){list.innerHTML='<div class="bm-section">Žádné záložky</div>';return;}
    list.innerHTML='';
    bookmarks.forEach(function(bm,i){
      var item=document.createElement('div');
      item.className='bm-item';
      item.innerHTML='<div class="bm-info"><div class="bm-name">'+escHtml(bm.label)+'</div><div class="bm-meta">'+(bm.date?escHtml(bm.date):escHtml(bm.book))+'</div></div><button class="bm-del">🗑</button>';
      item.querySelector('.bm-del').onclick=function(e){e.stopPropagation();bookmarks.splice(i,1);localStorage.setItem('kladyx-bm',JSON.stringify(bookmarks));renderBookmarks();};
      item.onclick=function(e){
        if(e.target.classList.contains('bm-del'))return;
        if(bm.book!==currentFile.name){toast('⚠ Tato záložka patří jiné knize');return;}
        if(bookType==='epub'&&bm.cfi&&epubBook){
          epubRendition.display(bm.cfi);
          closeBookmarks();
          toast('📌 Přeskočeno na záložku');
        } else if(bookType==='pdf'&&bm.page){
          renderPdfPage(bm.page);
          closeBookmarks();
          toast('📌 Přeskočeno na záložku');
        } else {
          toast('⚠ Záložka nemá pozici');
        }
      };
      list.appendChild(item);
    });
  }

  function saveBookmarkHere(){
    if(!currentFile||!currentFile.name){toast('⚠ Žádná kniha není otevřena');return;}
    var label,cfi=null,page=null;
    if(bookType==='epub'&&epubBook){
      var loc=epubRendition.currentLocation();
      if(!loc||!loc.start){toast('⚠ Nelze zjistit pozici');return;}
      cfi=loc.start.cfi;
      var pct=loc.start.percentage?Math.round(loc.start.percentage*100):0;
      label='📌 '+currentFile.name+' — '+pct+'%';
    } else if(bookType==='pdf'&&pdfDoc){
      page=currentPdfPage;
      label='📌 '+currentFile.name+' — strana '+page+'/'+pdfPages;
    } else {
      toast('⚠ Žádná kniha není otevřena');return;
    }
    var bm={label:label,book:currentFile.name,cfi:cfi,page:page,date:new Date().toLocaleString('cs-CZ')};
    bookmarks.push(bm);
    localStorage.setItem('kladyx-bm',JSON.stringify(bookmarks));
    renderBookmarks();
    toast('✓ Záložka uložena');
  }
  
  function exportBookmarks(){
    if(!bookmarks.length){toast('⚠ Žádné záložky');return;}
    var blob=new Blob([JSON.stringify(bookmarks,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='kladyx-bookmarks.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    toast('📤 Záložky exportovány');
  }
  
  function importBookmarks(){
    document.getElementById('bm-import-file').click();
  }
  
  // ──────────────────────────────────────────────────────────────
  // ULOŽENÍ SOUBORU
  // ──────────────────────────────────────────────────────────────
  function saveCurrentFile(){
    if(!currentFile||!currentFile.data){toast('⛔ Žádná kniha není otevřena');return;}
    var btn=document.getElementById('save-file-btn');
    btn.disabled=true;
    btn.classList.add('saving');
    var title=document.getElementById('book-title').textContent||'kniha';
    var now=new Date().toLocaleDateString('cs-CZ');
    dbSave({
      filename:currentFile.name,
      title:title,
      type:bookType,
      size:currentFile.data.byteLength,
      date:now,
      buffer:currentFile.data
    },function(){
      btn.classList.remove('saving');
      btn.classList.add('saved');
      btn.style.background='rgba(255,60,90,.22)';
      btn.style.borderColor='rgba(255,60,90,.55)';
      btn.style.color='#ff3c5a';
      btn.textContent='✓ ULOŽENO';
      toast('✓ Kniha trvale uložena do paměti telefonu');
      setTimeout(function(){
        btn.disabled=false;
        btn.classList.remove('saved');
        btn.style.background='rgba(0,255,136,.15)';
        btn.style.borderColor='rgba(0,255,136,.4)';
        btn.style.color='#00ff88';
        btn.textContent='💾 ULOŽIT SOUBOR';
      },2500);
    }).catch(function(e){
      btn.disabled=false;
      btn.classList.remove('saving');
      btn.style.background='rgba(0,255,136,.15)';
      btn.style.borderColor='rgba(0,255,136,.4)';
      btn.style.color='#00ff88';
      btn.textContent='💾 ULOŽIT SOUBOR';
      toast('⛔ Chyba uložení: '+e.message);
    });
  }
  
  // ──────────────────────────────────────────────────────────────
  // ARCHIV - AUTOMATICKÉ NAČTENÍ Z GITHUB
  // ──────────────────────────────────────────────────────────────
  function autoLoadHomeBtn(){
    var homeBtn=document.getElementById('home-auto-btn');
    homeBtn.disabled=true;
    homeBtn.style.animation='none';
    homeBtn.textContent='⏳ STAHUJI…';
    openArchive();
    var arcBtn=document.getElementById('auto-load-btn');
    arcBtn.click();
    // Reset home button po dokončení
    var orig=updateLoadProgress;
    updateLoadProgress=function(loaded,failed,total,btn){
      orig(loaded,failed,total,btn);
      if(loaded+failed===total){
        homeBtn.disabled=false;
        homeBtn.style.animation='githubPulse 2s ease-in-out infinite';
        homeBtn.textContent='🔄 AUTO STÁHNOUT Z GITHUB';
        updateLoadProgress=orig;
      }
    };
  }

  function autoLoadGithubBooks(){
    var btn=document.getElementById('auto-load-btn');
    btn.disabled=true;
    btn.classList.add('loading');
    btn.textContent='⏳ NAČÍTÁM SEZNAM…';

    var apiUrl='https://api.github.com/repos/Kladyx/books-readme.md/git/trees/main?recursive=1';

    function tryLoad(src,isProxy){
      var x=new XMLHttpRequest();
      x.open('GET',src,true);
      x.responseType='json';
      x.onload=function(){
        var data=x.response;
        if(x.status===200&&data&&data.tree){
          var files=data.tree.filter(function(f){
            return f.type==='blob'&&/\.(epub|pdf)$/i.test(f.path);
          });
          if(!files.length){
            toast('⚠ Žádné epub/pdf soubory nenalezeny');
            btn.disabled=false;btn.classList.remove('loading');
            btn.textContent='🔄 AUTO NAČÍST Z GITHUB';
            return;
          }
          var books=files.map(function(f){
            return {
              url:'https://raw.githubusercontent.com/Kladyx/books-readme.md/main/'+f.path,
              title:f.path.replace(/\.(epub|pdf)$/i,'').replace(/_/g,' ')
            };
          });
          toast('📚 Nalezeno knih: '+books.length);
          loadBooksFromList(books,btn);
        } else {
          toast('⛔ Chyba načtení seznamu: HTTP '+x.status);
          btn.disabled=false;btn.classList.remove('loading');
          btn.textContent='🔄 AUTO NAČÍST Z GITHUB';
        }
      };
      x.onerror=function(){
        if(!isProxy){
          btn.textContent='⏳ Proxy…';
          tryLoad('https://corsproxy.io/?url='+encodeURIComponent(apiUrl),true);
        } else {
          toast('⛔ Nelze načíst seznam knih');
          btn.disabled=false;btn.classList.remove('loading');
          btn.textContent='🔄 AUTO NAČÍST Z GITHUB';
        }
      };
      x.send();
    }

    tryLoad(apiUrl,false);
  }
  
  function loadBooksFromList(books,btn){
    if(!books.length){
      toast('⚠ Žádné knihy k načtení');
      btn.disabled=false;
      btn.classList.remove('loading');
      btn.textContent='🔄 AUTO NAČÍST Z GITHUB';
      return;
    }
    
    var loaded=0;
    var failed=0;
    
    books.forEach(function(bookInfo){
      var url=bookInfo.url||'';
      var ext=url.match(/\.pdf(\?|$)/i)?'pdf':'epub';
      var fname=url.split('/').pop().split('?')[0]||('kniha.'+ext);
      
      function tryLoadBook(src,isProxy){
        var x=new XMLHttpRequest();
        x.open('GET',src,true);
        x.responseType='arraybuffer';
        x.onload=function(){
          if(x.status===200){
            var title=bookInfo.title||fname;
            var now=new Date().toLocaleDateString('cs-CZ');
            dbSave({
              filename:fname,
              title:title,
              type:ext,
              size:x.response.byteLength,
              date:now,
              buffer:x.response
            },function(){
              loaded++;
              updateLoadProgress(loaded,failed,books.length,btn);
            }).catch(function(e){
              failed++;
              updateLoadProgress(loaded,failed,books.length,btn);
            });
          } else {
            failed++;
            updateLoadProgress(loaded,failed,books.length,btn);
          }
        };
        x.onerror=function(){
          if(!isProxy){
            tryLoadBook('https://corsproxy.io/?url='+encodeURIComponent(src),true);
          } else {
            failed++;
            updateLoadProgress(loaded,failed,books.length,btn);
          }
        };
        x.send();
      }
      
      tryLoadBook(url,false);
    });
  }
  
  function updateLoadProgress(loaded,failed,total,btn){
    if(loaded+failed===total){
      btn.disabled=false;
      btn.classList.remove('loading');
      btn.textContent='🔄 AUTO NAČÍST Z GITHUB';
      renderArchive();
      toast('✓ Načteno: '+loaded+', Chyb: '+failed);
    } else {
      btn.textContent='⏳ '+loaded+'/'+total;
    }
  }
  
  function renderArchive(){
    var list=document.getElementById('arc-list');
    dbGetAll(function(books){
      var countEl=document.getElementById('arc-count');
      if(countEl)countEl.textContent='POČET KNIH V ARCHIVU: '+books.length;
      if(!books.length){list.innerHTML='<div class="arc-empty">Archiv je prázdný<br><br>Otevři knihu a klikni 💾 ULOŽIT SOUBOR<br>(nastavení ⚙️)</div>';return;}
      list.innerHTML='';
      books.forEach(function(bk){
        var item=document.createElement('div');item.className='arc-item';
        var icon=bk.type==='epub'?'📖':'📄';
        var sizeMB=((bk.size||0)/1048576).toFixed(1);
        item.innerHTML='<div class="arc-icon">'+icon+'</div><div class="arc-info"><div class="arc-name">'+escHtml(bk.title)+'</div><div class="arc-meta">'+escHtml(bk.filename)+' · '+sizeMB+' MB · '+escHtml(bk.date)+'</div></div><button class="arc-del" title="Smazat z archivu">🗑</button>';
        item.querySelector('.arc-del').onclick=function(e){e.stopPropagation();if(!confirm('Smazat z paměti telefonu?\n\n'+bk.title))return;dbDelete(bk.filename,function(){renderArchive();toast('🗑 Smazáno z archivu');});};
        item.onclick=function(){openFromArchive(bk);};
        list.appendChild(item);
      });
    });
  }
  
  function openFromArchive(bk){
    if(!bk.buffer){toast('⚠ Data nejsou v paměti');return;}
    closeArchive();
    var fakeFile={name:bk.filename};
    if(bk.type==='epub')loadEpub(fakeFile,bk.buffer);
    else loadPdf(fakeFile,bk.buffer);
  }
  
  // ──────────────────────────────────────────────────────────────
  // NAČÍTÁNÍ Z GITHUB URL
  // ──────────────────────────────────────────────────────────────
  function loadFromGithub(){
    var url=(document.getElementById('github-url-input').value||'').trim();
    if(!url){toast('⚠ Zadej GitHub URL nebo raw URL');return;}
    url=url.replace('https://github.com/','https://raw.githubusercontent.com/').replace('/blob/','/')
           .replace('https://raw.githubusercontent.com/raw/','https://raw.githubusercontent.com/');
    var ext=url.match(/\.pdf(\?|$)/i)?'pdf':'epub';
    var fname=url.split('/').pop().split('?')[0]||('kniha.'+ext);
    toast('📥 Stahuji z GitHub…');
    function tryLoad(src,isProxy){
      var x=new XMLHttpRequest();
      x.open('GET',src,true);
      x.responseType='arraybuffer';
      x.onload=function(){
        if(x.status===200){
          var ff={name:fname};
          if(ext==='epub')loadEpub(ff,x.response);
          else loadPdf(ff,x.response);
          document.getElementById('github-url-input').value='';
        } else {
          toast('⛔ Chyba stahování: HTTP '+x.status+(isProxy?' (proxy)':''));
        }
      };
      x.onerror=function(){
        if(!isProxy){
          toast('⚠ CORS chyba — zkouším proxy…');
          tryLoad('https://corsproxy.io/?url='+encodeURIComponent(url),true);
        } else {
          toast('⛔ Nelze načíst soubor. Zkontroluj URL a opakuj.');
        }
      };
      x.send();
    }
    tryLoad(url,false);
  }
  
  // ──────────────────────────────────────────────────────────────
  // NASTAVENÍ
  // ──────────────────────────────────────────────────────────────
  function loadSettings(){
    var saved=localStorage.getItem('kladyx-settings');
    if(saved){settings=JSON.parse(saved);}
    else if(window.innerWidth<768){settings.fs=150;}
    document.getElementById('font-size-slider').value=settings.fs;
    document.getElementById('line-height-slider').value=settings.lh;
    document.querySelectorAll('.ff-btn').forEach(function(b){b.classList.remove('active');if(b.dataset.font===settings.font)b.classList.add('active');});
    document.querySelectorAll('.theme-btn').forEach(function(b){b.classList.remove('active');if(b.dataset.theme===settings.theme)b.classList.add('active');});
    applySettings();
  }
  
  function applySettings(){
    localStorage.setItem('kladyx-settings',JSON.stringify(settings));
    var root=document.documentElement;
    var fs=settings.fs;
    var lh=settings.lh;
    document.getElementById('fs-val').textContent=fs+'%';
    document.getElementById('lh-val').textContent=lh;
    
    if(bookType==='epub'&&epubRendition){
      epubRendition.themes.fontSize((fs/100)*16+'px');
      epubRendition.themes.lineHeight(lh);
      epubRendition.themes.font(settings.font);
    }
    
    var bgColor,textColor;
    if(settings.theme==='dark'){bgColor='#050810';textColor='#dde4ff';}
    else if(settings.theme==='sepia'){bgColor='#1a1208';textColor='#d4b896';}
    else {bgColor='#f0ede8';textColor='#1a1208';}
    
    root.style.setProperty('--bg',bgColor);
    root.style.setProperty('--light',textColor);
    if(bookType==='epub'&&epubRendition){
      epubRendition.themes.backgroundColor(bgColor);
      epubRendition.themes.textColor(textColor);
    }
  }
  
  // ──────────────────────────────────────────────────────────────
  // DATABÁZE (IndexedDB)
  // ──────────────────────────────────────────────────────────────
  var DB;
  var dbReady=new Promise(function(resolve){
    var req=indexedDB.open('KLADYX',1);
    req.onerror=function(){console.error('DB error');resolve(false);};
    req.onsuccess=function(){DB=req.result;resolve(true);};
    req.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains('books')){
        db.createObjectStore('books',{keyPath:'filename'});
      }
    };
  });
  
  function dbSave(book,cb){
    dbReady.then(function(){
      var tx=DB.transaction('books','readwrite');
      var store=tx.objectStore('books');
      var req=store.put(book);
      req.onsuccess=function(){cb();};
      req.onerror=function(){throw new Error('Uložení selhalo');};
    });
  }
  
  function dbGetAll(cb){
    dbReady.then(function(){
      var tx=DB.transaction('books','readonly');
      var store=tx.objectStore('books');
      var req=store.getAll();
      req.onsuccess=function(){cb(req.result);};
    });
  }
  
  function dbDelete(filename,cb){
    dbReady.then(function(){
      var tx=DB.transaction('books','readwrite');
      var store=tx.objectStore('books');
      var req=store.delete(filename);
      req.onsuccess=function(){cb();};
    });
  }
  
  function showReaderScreen(){
    document.getElementById('upload-screen').classList.add('hidden');
    document.getElementById('reader-screen').classList.add('active');
    document.getElementById('tap-prev').style.display='block';
    document.getElementById('tap-next').style.display='block';
  }
  
  function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  
</script>
