<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Čtečka - ARCHIV KNIH</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050810;
      color: #dde4ff;
      font-family: "Courier New", monospace;
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0,212,255,0.2);
    }
    
    .title {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #00d4ff;
      text-shadow: 0 0 15px rgba(0,212,255,0.3);
    }
    
    .home-btn {
      padding: 8px 16px;
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.3);
      color: #00d4ff;
      font-family: "Courier New", monospace;
      font-size: 0.75rem;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .home-btn:hover {
      background: rgba(0,212,255,0.2);
      box-shadow: 0 0 8px rgba(0,212,255,0.3);
    }
    
    .section {
      margin-bottom: 32px;
    }
    
    .section-title {
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: #5a6488;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(0,212,255,0.1);
    }
    
    .load-section {
      background: rgba(0,212,255,0.05);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }
    
    .btn {
      padding: 12px 20px;
      border: 1px solid rgba(0,212,255,0.3);
      background: rgba(0,212,255,0.08);
      color: #dde4ff;
      font-family: "Courier New", monospace;
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s;
      width: 100%;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 10px;
    }
    
    .btn:hover {
      background: rgba(0,212,255,0.15);
      box-shadow: 0 0 8px rgba(0,212,255,0.2);
    }
    
    .btn-red {
      border-color: rgba(255,60,90,0.4);
      background: rgba(255,60,90,0.12);
      color: #ff3c5a;
    }
    
    .btn-red:hover {
      background: rgba(255,60,90,0.2);
      box-shadow: 0 0 8px rgba(255,60,90,0.3);
    }
    
    .btn-green {
      border-color: rgba(0,255,120,0.4);
      background: rgba(0,255,120,0.12);
      color: #00ff78;
    }
    
    .btn-green:hover {
      background: rgba(0,255,120,0.2);
      box-shadow: 0 0 8px rgba(0,255,120,0.3);
    }
    
    .loading {
      color: #00d4ff;
      font-size: 0.8rem;
      margin-top: 8px;
      animation: blink 1s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .error-msg {
      background: rgba(255,60,90,0.15);
      border: 1px solid rgba(255,60,90,0.4);
      color: #ff3c5a;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-top: 8px;
      letter-spacing: 1px;
    }
    
    .success-msg {
      background: rgba(0,255,120,0.15);
      border: 1px solid rgba(0,255,120,0.4);
      color: #00ff78;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-top: 8px;
      letter-spacing: 1px;
      animation: pulse 0.5s;
    }
    
    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .archive-list {
      background: rgba(0,212,255,0.03);
      border: 1px solid rgba(0,212,255,0.1);
      border-radius: 6px;
      padding: 16px;
      max-height: 400px;
      overflow-y: auto;
    }
    
    .archive-item {
      padding: 10px;
      border-bottom: 1px solid rgba(0,212,255,0.1);
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    
    .archive-item:last-child {
      border-bottom: none;
    }
    
    .archive-name {
      flex: 1;
      color: #dde4ff;
      word-break: break-all;
    }
    
    .archive-size {
      color: #5a6488;
      font-size: 0.75rem;
      white-space: nowrap;
    }
    
    .archive-empty {
      text-align: center;
      color: #5a6488;
      padding: 30px 20px;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }
    
    .book-list {
      background: rgba(0,212,255,0.03);
      border: 1px solid rgba(0,212,255,0.1);
      border-radius: 6px;
      padding: 12px;
      max-height: 300px;
      overflow-y: auto;
    }
    
    .book-item {
      padding: 8px;
      border-bottom: 1px solid rgba(0,212,255,0.1);
      font-size: 0.75rem;
      color: #dde4ff;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .book-item:hover {
      background: rgba(0,212,255,0.08);
      color: #00d4ff;
    }
    
    .book-item:last-child {
      border-bottom: none;
    }
    
    .book-name {
      flex: 1;
      word-break: break-all;
    }
    
    .book-action {
      padding: 4px 10px;
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.3);
      color: #00d4ff;
      font-size: 0.7rem;
      cursor: pointer;
      border-radius: 2px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    
    .book-action:hover {
      background: rgba(0,212,255,0.2);
    }
    
    .info-text {
      color: #5a6488;
      font-size: 0.75rem;
      letter-spacing: 1px;
      line-height: 1.6;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="title">📚 ARCHIV KNIH</div>
  <button class="home-btn" onclick="goHome()">HOME</button>
</div>

<div class="section">
  <div class="section-title">📥 NAČÍST KNIHY Z GITHUB</div>
  <div class="load-section">
    <button class="btn" onclick="loadAllBooksFromGithub()" id="load-btn">⚙️ AUTO NAČÍST - Stáhnout všechny knihy</button>
    <div id="load-status"></div>
    <div id="books-count" class="info-text" style="margin-top: 12px; display: none;"></div>
  </div>
</div>

<div class="section">
  <div class="section-title">📖 DOSTUPNÉ KNIHY</div>
  <div id="books-list" class="book-list">
    <div style="text-align: center; color: #5a6488; padding: 20px; font-size: 0.8rem;">
      Klikni "AUTO NAČÍST" aby se knihy načetly...
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">💾 ULOŽENÉ V ARCHIVU</div>
  <div id="archive-list" class="archive-list">
    <div class="archive-empty">Archiv je prázdný</div>
  </div>
</div>

<script>
const GITHUB_OWNER = 'kladyx';
const GITHUB_REPO = 'books-readme';
const GITHUB_BRANCH = 'main';

let allBooks = [];
let archivedBooks = [];

// Načíst archiv z localStorage
function loadArchive() {
  try {
    const stored = localStorage.getItem('kladyx_book_archive');
    archivedBooks = stored ? JSON.parse(stored) : [];
    renderArchive();
  } catch(e) {
    console.error('Chyba při načítání archivu:', e);
  }
}

// Uložit archiv do localStorage
function saveArchive() {
  try {
    localStorage.setItem('kladyx_book_archive', JSON.stringify(archivedBooks));
    renderArchive();
  } catch(e) {
    console.error('Chyba při ukládání archivu:', e);
  }
}

// Načíst seznam všech souborů z GitHub repo
async function loadAllBooksFromGithub() {
  const btnEl = document.getElementById('load-btn');
  const statusEl = document.getElementById('load-status');
  
  btnEl.disabled = true;
  btnEl.style.opacity = '0.5';
  statusEl.innerHTML = '<div class="loading">⏳ Načítám seznam knih z GitHubu...</div>';
  
  try {
    // GitHub API endpoint pro seznam souborů
    const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/`;
    
    const response = await fetch(apiUrl, {
      headers: {
        'Accept': 'application/vnd.github.v3+json'
      }
    });
    
    if (!response.ok) {
      throw new Error(`GitHub API chyba: ${response.status}`);
    }
    
    const files = await response.json();
    
    // Filtrovat pouze PDF soubory
    allBooks = files
      .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.pdf'))
      .map(f => ({
        name: f.name,
        size: f.size,
        downloadUrl: f.download_url
      }))
      .sort((a, b) => a.name.localeCompare(b.name));
    
    if (allBooks.length === 0) {
      throw new Error('V GitHubu nebyly nalezeny žádné PDF soubory');
    }
    
    statusEl.innerHTML = `<div class="success-msg">✅ Načteno ${allBooks.length} knih</div>`;
    document.getElementById('books-count').style.display = 'block';
    document.getElementById('books-count').textContent = `Dostupných knih: ${allBooks.length}`;
    
    renderBooks();
    btnEl.disabled = false;
    btnEl.style.opacity = '1';
    
  } catch(err) {
    console.error('Chyba:', err);
    statusEl.innerHTML = `<div class="error-msg">❌ ${err.message}</div>`;
    btnEl.disabled = false;
    btnEl.style.opacity = '1';
  }
}

// Render seznam dostupných knih
function renderBooks() {
  const listEl = document.getElementById('books-list');
  
  if (allBooks.length === 0) {
    listEl.innerHTML = '<div style="text-align: center; color: #5a6488; padding: 20px;">Nejsou dostupné knihy</div>';
    return;
  }
  
  let html = '';
  allBooks.forEach(book => {
    const sizeMB = (book.size / (1024*1024)).toFixed(1);
    const isArchived = archivedBooks.some(b => b.name === book.name);
    html += `
      <div class="book-item">
        <span class="book-name">📄 ${book.name}</span>
        <span class="book-action" onclick="saveBook('${book.name}', '${book.downloadUrl}')" style="background: ${isArchived ? 'rgba(0,255,120,0.1); border-color: rgba(0,255,120,0.3); color: #00ff78;' : 'rgba(255,60,90,0.1); border-color: rgba(255,60,90,0.3); color: #ff3c5a;'}">
          ${isArchived ? '✅ ULOŽENO' : '💾 ULOŽIT'}
        </span>
      </div>
    `;
  });
  listEl.innerHTML = html;
}

// Uložit jednotlivou knihu do archivu
async function saveBook(name, url) {
  const alreadySaved = archivedBooks.find(b => b.name === name);
  
  if (alreadySaved) {
    // Odebrat z archivu
    archivedBooks = archivedBooks.filter(b => b.name !== name);
    saveArchive();
    renderBooks();
    return;
  }
  
  // Stáhnout knihu
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`Chyba stažení: ${response.status}`);
    
    const blob = await response.blob();
    
    // Uložit do archivu
    const reader = new FileReader();
    reader.onload = (e) => {
      archivedBooks.push({
        name: name,
        data: e.target.result,
        savedAt: new Date().toISOString(),
        size: blob.size
      });
      saveArchive();
      renderBooks();
    };
    reader.readAsDataURL(blob);
    
  } catch(err) {
    console.error('Chyba při stahování knihy:', err);
    alert('Chyba: Nelze stáhnout knihu ' + name);
  }
}

// Render seznam uložených knih
function renderArchive() {
  const archiveEl = document.getElementById('archive-list');
  
  if (archivedBooks.length === 0) {
    archiveEl.innerHTML = '<div class="archive-empty">Archiv je prázdný</div>';
    return;
  }
  
  let html = '';
  archivedBooks.forEach(book => {
    const sizeMB = (book.size / (1024*1024)).toFixed(1);
    const date = new Date(book.savedAt).toLocaleDateString('cs-CZ');
    html += `
      <div class="archive-item">
        <div>
          <div class="archive-name">📚 ${book.name}</div>
          <div class="archive-size">${sizeMB} MB • Uloženo: ${date}</div>
        </div>
      </div>
    `;
  });
  archiveEl.innerHTML = html;
}

// HOME - vrátit se do hlavní aplikace
function goHome() {
  window.parent.postMessage({ action: 'goHome' }, '*');
}

// Inicializace
window.addEventListener('load', () => {
  loadArchive();
});
</script>

</body>
</html>
