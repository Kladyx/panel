<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KladyxSpeed v1.2Kl</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    font-family:'Times New Roman', Times, serif;
    background: linear-gradient(135deg, #0a0a1a, #1a0a2a);
    color:#fff;
    overflow-x:hidden;
  }
  .wrap {
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px 60px;
    text-align:center;
  }
  .title {
    font-size:2.4rem; font-weight:900;
    background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: rainbow 6s linear infinite;
    letter-spacing:.05em;
  }
  @keyframes rainbow {
    0% { background-position:0% 50%; }
    100% { background-position:300% 50%; }
  }
  .version { color:rgba(255,255,255,.4); font-size:.9rem; margin-bottom:24px; }

  .gauge-wrap { position:relative; width:260px; height:260px; margin:10px auto 20px; }
  .gauge-ring {
    width:260px; height:260px; border-radius:50%;
    border:6px solid;
    border-image: linear-gradient(135deg, #ff00ff, #00ffff, #ffff00, #ff00ff) 1;
    animation: borderPulse 4s linear infinite;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 30px rgba(255,0,255,.25), 0 0 50px rgba(0,255,255,.15);
  }
  @keyframes borderPulse {
    0%   { border-image-source: linear-gradient(0deg,   #ff00ff, #00ffff, #ffff00, #ff00ff); }
    25%  { border-image-source: linear-gradient(90deg,  #ff00ff, #00ffff, #ffff00, #ff00ff); }
    50%  { border-image-source: linear-gradient(180deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
    75%  { border-image-source: linear-gradient(270deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
    100% { border-image-source: linear-gradient(360deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
  }
  .gauge-inner { text-align:center; }
  .gauge-value {
    font-size:3.2rem; font-weight:900; line-height:1;
    text-shadow: 0 0 20px rgba(0,255,255,.6);
  }
  .gauge-unit { font-size:1rem; color:rgba(255,255,255,.6); margin-top:4px; }
  .gauge-label { font-size:1.1rem; color:#00ffff; margin-top:8px; letter-spacing:.1em; }

  .status {
    font-size:1.1rem; min-height:1.6em; margin:8px 0 20px;
    color:#ffff66;
  }

  .btn {
    font-family:'Times New Roman', Times, serif;
    font-size:1.3rem; font-weight:bold;
    padding:14px 40px; border-radius:30px;
    border:2px solid #ff00ff;
    background: linear-gradient(135deg, rgba(255,0,255,.2), rgba(0,255,255,.2));
    color:#fff; cursor:pointer;
    box-shadow: 0 0 20px rgba(255,0,255,.4);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity:.5; }

  .btn-row {
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    margin-top:12px;
  }
  .btn-sm {
    font-family:inherit; font-size:.85rem; font-weight:600;
    padding:8px 16px; border-radius:8px;
    background: rgba(0,245,255,.1);
    border:1px solid rgba(0,245,255,.35);
    color: rgba(0,245,255,.85); cursor:pointer;
    transition: all .15s ease;
  }
  .btn-sm:hover { background: rgba(0,245,255,.2); }
  .btn-sm:active { transform: scale(0.95); }
  .btn-sm:disabled { opacity:.4; cursor:not-allowed; }

  .archive {
    display:none; margin-top:24px; width:100%; max-width:480px;
    text-align:left;
  }
  .archive.show { display:block; }
  .archive h3 {
    font-size:1rem; color:rgba(255,255,255,.75);
    margin:0 0 10px; text-align:center; letter-spacing:.05em;
  }
  .archive-item {
    background: rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);
    border-radius:8px; padding:8px 10px; margin-bottom:6px;
    display:flex; align-items:center; gap:8px;
    font-size:.78rem; flex-wrap:wrap;
  }
  .archive-item .date { color:rgba(255,255,255,.55); flex-basis:100%; font-size:.72rem; }
  .archive-item .stat-grp { display:flex; gap:10px; flex:1; flex-wrap:wrap; }
  .archive-item .stat { color:rgba(0,245,255,.85); font-weight:600; }
  .archive-item .stat .lbl { color:rgba(255,255,255,.5); font-weight:400; font-size:.7rem; margin-right:3px; }
  .archive-item .del {
    background: rgba(255,80,80,.15);
    border:1px solid rgba(255,80,80,.35);
    color: rgba(255,80,80,.9); cursor:pointer;
    border-radius:5px; padding:4px 10px; font-size:.7rem;
  }
  .archive-item .del:hover { background: rgba(255,80,80,.3); }
  .archive-clear {
    display:block; margin:12px auto 0;
    background: rgba(255,80,80,.15);
    border:1px solid rgba(255,80,80,.35);
    color: rgba(255,80,80,.95);
    padding:8px 18px; border-radius:8px; cursor:pointer;
    font-size:.8rem;
  }
  .archive-clear:hover { background: rgba(255,80,80,.25); }
  .archive-empty {
    color: rgba(255,255,255,.45);
    font-style: italic; text-align:center;
    padding:14px;
  }

  .results {
    display:flex; gap:16px; flex-wrap:wrap; justify-content:center;
    margin-top:30px; width:100%; max-width:420px;
  }
  .card {
    flex:1; min-width:110px;
    background: rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px; padding:14px 8px;
  }
  .card .icon { font-size:1.6rem; }
  .card .val { font-size:1.5rem; font-weight:900; margin-top:4px; text-shadow:0 0 10px rgba(0,255,255,.4); }
  .card .lbl { font-size:.85rem; color:rgba(255,255,255,.5); margin-top:2px; }

  .footer { margin-top:30px; font-size:.8rem; color:rgba(255,255,255,.3); }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">KLADYXSPEED</div>
  <div class="version">v1.4 Kl</div>

  <div class="gauge-wrap">
    <div class="gauge-ring">
      <div class="gauge-inner">
        <div class="gauge-value" id="gaugeValue">--</div>
        <div class="gauge-unit">Mbit/s</div>
        <div class="gauge-label" id="gaugeLabel">PŘIPRAVENO</div>
      </div>
    </div>
  </div>

  <div class="status" id="status">Stiskni START pro test rychlosti</div>

  <button class="btn" id="startBtn" onclick="runTest()">▶ START</button>

  <div class="btn-row">
    <button class="btn-sm" id="resetBtn">🗑 RESET</button>
    <button class="btn-sm" id="archiveBtn">📋 ARCHIV</button>
  </div>

  <div class="results">
    <div class="card">
      <div class="icon">🏓</div>
      <div class="val" id="pingVal">--</div>
      <div class="lbl">Ping (ms)</div>
    </div>
    <div class="card">
      <div class="icon">⬇️</div>
      <div class="val" id="downVal">--</div>
      <div class="lbl">Download Mbit/s</div>
    </div>
    <div class="card">
      <div class="icon">⬆️</div>
      <div class="val" id="upVal">--</div>
      <div class="lbl">Upload Mbit/s</div>
    </div>
  </div>

  <div class="archive" id="archive">
    <h3>📋 Archiv výsledků</h3>
    <div id="archiveList"></div>
    <button class="archive-clear" id="clearArchiveBtn">🗑 Smazat vše</button>
  </div>

  <div class="footer">měřeno přes Cloudflare speed servery</div>
</div>

<script type="module">
import SpeedTest from 'https://cdn.jsdelivr.net/npm/@cloudflare/speedtest@1/+esm';

const gaugeValue = document.getElementById('gaugeValue');
const gaugeLabel = document.getElementById('gaugeLabel');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const pingVal = document.getElementById('pingVal');
const downVal = document.getElementById('downVal');
const upVal = document.getElementById('upVal');

function setGauge(val, label) {
  gaugeValue.textContent = val;
  gaugeLabel.textContent = label;
}

// === IFRAME-SAFE LOCALSTORAGE ===
// Apka v iframe ma blokovany window.localStorage, pouzij parent
function getStorage(){try{var s=window.parent.localStorage;s.getItem('__test__');return s;}catch(e){return localStorage;}}

const STORAGE_KEY = 'kladyx_speedtest_archive';

// === RESET ===
function resetResults() {
  pingVal.textContent = '--';
  downVal.textContent = '--';
  upVal.textContent = '--';
  setGauge('--', 'PŘIPRAVENO');
  statusEl.textContent = 'Stiskni START pro test rychlosti';
}

// === ARCHIV ===
function loadArchive() {
  try {
    const raw = getStorage().getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) {
    console.warn('Archive load error:', e);
    return [];
  }
}

function saveArchive(arr) {
  try {
    getStorage().setItem(STORAGE_KEY, JSON.stringify(arr));
  } catch(e) {
    console.warn('Archive save error:', e);
  }
}

function addToArchive(ping, downMbps, upMbps) {
  if (!ping && !downMbps && !upMbps) return; // nic neukladat pri prazdnem testu
  const arr = loadArchive();
  arr.unshift({
    id: Date.now(),
    ts: Date.now(),
    ping: ping ? Math.round(ping) : null,
    down: downMbps ? parseFloat(downMbps.toFixed(1)) : null,
    up: upMbps ? parseFloat(upMbps.toFixed(1)) : null
  });
  // Limit na 100 zaznamu
  if (arr.length > 100) arr.length = 100;
  saveArchive(arr);
  // Pokud je archiv otevreny, refresh
  if (document.getElementById('archive').classList.contains('show')) {
    renderArchive();
  }
}

function formatDate(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderArchive() {
  const list = document.getElementById('archiveList');
  const arr = loadArchive();
  if (arr.length === 0) {
    list.innerHTML = '<div class="archive-empty">Žádné výsledky zatím</div>';
    return;
  }
  list.innerHTML = arr.map(it => `
    <div class="archive-item" data-id="${it.id}">
      <div class="date">${formatDate(it.ts)}</div>
      <div class="stat-grp">
        <span class="stat"><span class="lbl">🏓</span>${it.ping != null ? it.ping + ' ms' : '—'}</span>
        <span class="stat"><span class="lbl">⬇️</span>${it.down != null ? it.down + ' Mbps' : '—'}</span>
        <span class="stat"><span class="lbl">⬆️</span>${it.up != null ? it.up + ' Mbps' : '—'}</span>
      </div>
      <button class="del" data-id="${it.id}">×</button>
    </div>
  `).join('');
  // Pripojit eventy na del tlacitka
  list.querySelectorAll('.del').forEach(btn => {
    btn.onclick = function() {
      const id = parseInt(this.getAttribute('data-id'));
      const arr2 = loadArchive().filter(x => x.id !== id);
      saveArchive(arr2);
      renderArchive();
    };
  });
}

function toggleArchive() {
  const arch = document.getElementById('archive');
  arch.classList.toggle('show');
  if (arch.classList.contains('show')) {
    renderArchive();
  }
}

function clearArchive() {
  if (confirm('Opravdu chceš smazat všechny výsledky z archivu?')) {
    saveArchive([]);
    renderArchive();
  }
}

// Pripojit eventy na tlacitka
document.getElementById('resetBtn').onclick = resetResults;
document.getElementById('archiveBtn').onclick = toggleArchive;
document.getElementById('clearArchiveBtn').onclick = clearArchive;

window.runTest = function() {
  startBtn.disabled = true;
  pingVal.textContent = '--';
  downVal.textContent = '--';
  upVal.textContent = '--';
  setGauge('--', 'SPOUŠTÍM');
  statusEl.textContent = 'Spouštím Cloudflare engine...';

  const st = new SpeedTest({
    autoStart: false,
    // Vypneme packetLoss (vyžaduje vlastní TURN server)
    // Toto je oficiální výchozí sada měření MÍNUS packetLoss
    measurements: [
      { type: 'latency', numPackets: 1 },
      { type: 'download', bytes: 1e5, count: 1, bypassMinDuration: true },
      { type: 'latency', numPackets: 20 },
      { type: 'download', bytes: 1e5, count: 9 },
      { type: 'download', bytes: 1e6, count: 8 },
      { type: 'upload', bytes: 1e5, count: 8 },
      { type: 'upload', bytes: 1e6, count: 6 },
      { type: 'download', bytes: 1e7, count: 6 },
      { type: 'upload', bytes: 1e7, count: 4 },
      { type: 'download', bytes: 2.5e7, count: 4 },
      { type: 'upload', bytes: 2.5e7, count: 4 },
      { type: 'download', bytes: 1e8, count: 3 },
      { type: 'upload', bytes: 5e7, count: 3 }
    ]
  });

  st.onResultsChange = (info) => {
    try {
      const results = st.results;
      const type = info && info.type;

      // Latency (ping)
      const lat = results.getUnloadedLatency();
      if (lat && lat > 0) {
        pingVal.textContent = Math.round(lat);
      }

      // Download bandwidth (bps)
      const down = results.getDownloadBandwidth();
      if (down && down > 0) {
        const mbps = down / 1e6;
        downVal.textContent = mbps.toFixed(1);
        if (type === 'download') {
          setGauge(mbps.toFixed(1), 'DOWNLOAD');
          statusEl.textContent = 'Měřím download (' + mbps.toFixed(1) + ' Mbit/s)...';
        }
      }

      // Upload bandwidth (bps)
      const up = results.getUploadBandwidth();
      if (up && up > 0) {
        const mbps = up / 1e6;
        upVal.textContent = mbps.toFixed(1);
        if (type === 'upload') {
          setGauge(mbps.toFixed(1), 'UPLOAD');
          statusEl.textContent = 'Měřím upload (' + mbps.toFixed(1) + ' Mbit/s)...';
        }
      }

      // Status text podle aktuálního měření
      if (type === 'latency' && lat) {
        setGauge(Math.round(lat), 'PING (ms)');
        statusEl.textContent = 'Měřím ping (' + Math.round(lat) + ' ms)...';
      }
    } catch (e) {
      console.warn('onResultsChange error:', e);
    }
  };

  st.onFinish = (results) => {
    try {
      const lat = results.getUnloadedLatency();
      const down = results.getDownloadBandwidth();
      const up = results.getUploadBandwidth();

      if (lat) pingVal.textContent = Math.round(lat);
      if (down) downVal.textContent = (down / 1e6).toFixed(1);
      if (up) upVal.textContent = (up / 1e6).toFixed(1);

      if (down) setGauge((down / 1e6).toFixed(1), 'DOWNLOAD');
      statusEl.textContent = '✅ Test dokončen';

      // Uložit do archivu
      addToArchive(lat, down ? down / 1e6 : null, up ? up / 1e6 : null);

      console.log('SpeedTest hotov:', {
        ping_ms: lat,
        download_bps: down,
        upload_bps: up,
        download_mbps: down ? (down / 1e6).toFixed(2) : null,
        upload_mbps: up ? (up / 1e6).toFixed(2) : null,
        summary: results.getSummary()
      });
    } catch (e) {
      console.error('onFinish error:', e);
      statusEl.textContent = '❌ Chyba při zpracování: ' + e.message;
    }
    startBtn.disabled = false;
  };

  st.onError = (err) => {
    console.error('SpeedTest error:', err);
    statusEl.textContent = '❌ Chyba: ' + (err && (err.message || err.toString()) || 'neznámá chyba');
    startBtn.disabled = false;
  };

  st.play();
};
</script>
</body>
</html>
