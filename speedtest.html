<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KladyxSpeed v1.3Kl</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    font-family:'Times New Roman', Times, serif;
    background: linear-gradient(135deg, #0a0a1a, #1a0a2a);
    color:#fff;
    overflow-x:hidden;
  }
  .wrap {
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px 60px;
    text-align:center;
  }
  .title {
    font-size:2.4rem; font-weight:900;
    background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: rainbow 6s linear infinite;
    letter-spacing:.05em;
  }
  @keyframes rainbow {
    0% { background-position:0% 50%; }
    100% { background-position:300% 50%; }
  }
  .version { color:rgba(255,255,255,.4); font-size:.9rem; margin-bottom:24px; }

  .gauge-wrap { position:relative; width:260px; height:260px; margin:10px auto 20px; }
  .gauge-ring {
    width:260px; height:260px; border-radius:50%;
    border:6px solid;
    border-image: linear-gradient(135deg, #ff00ff, #00ffff, #ffff00, #ff00ff) 1;
    animation: borderPulse 4s linear infinite;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 30px rgba(255,0,255,.25), 0 0 50px rgba(0,255,255,.15);
  }
  @keyframes borderPulse {
    0%   { border-image-source: linear-gradient(0deg,   #ff00ff, #00ffff, #ffff00, #ff00ff); }
    25%  { border-image-source: linear-gradient(90deg,  #ff00ff, #00ffff, #ffff00, #ff00ff); }
    50%  { border-image-source: linear-gradient(180deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
    75%  { border-image-source: linear-gradient(270deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
    100% { border-image-source: linear-gradient(360deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
  }
  .gauge-inner { text-align:center; }
  .gauge-value {
    font-size:3.2rem; font-weight:900; line-height:1;
    text-shadow: 0 0 20px rgba(0,255,255,.6);
  }
  .gauge-unit { font-size:1rem; color:rgba(255,255,255,.6); margin-top:4px; }
  .gauge-label { font-size:1.1rem; color:#00ffff; margin-top:8px; letter-spacing:.1em; }

  .status {
    font-size:1.1rem; min-height:1.6em; margin:8px 0 20px;
    color:#ffff66;
  }

  .btn {
    font-family:'Times New Roman', Times, serif;
    font-size:1.3rem; font-weight:bold;
    padding:14px 40px; border-radius:30px;
    border:2px solid #ff00ff;
    background: linear-gradient(135deg, rgba(255,0,255,.2), rgba(0,255,255,.2));
    color:#fff; cursor:pointer;
    box-shadow: 0 0 20px rgba(255,0,255,.4);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity:.5; }

  .results {
    display:flex; gap:16px; flex-wrap:wrap; justify-content:center;
    margin-top:30px; width:100%; max-width:420px;
  }
  .card {
    flex:1; min-width:110px;
    background: rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px; padding:14px 8px;
  }
  .card .icon { font-size:1.6rem; }
  .card .val { font-size:1.5rem; font-weight:900; margin-top:4px; text-shadow:0 0 10px rgba(0,255,255,.4); }
  .card .lbl { font-size:.85rem; color:rgba(255,255,255,.5); margin-top:2px; }

  .footer { margin-top:30px; font-size:.8rem; color:rgba(255,255,255,.3); }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">KLADYXSPEED</div>
  <div class="version">v1.3 Kl</div>

  <div class="gauge-wrap">
    <div class="gauge-ring">
      <div class="gauge-inner">
        <div class="gauge-value" id="gaugeValue">--</div>
        <div class="gauge-unit">Mbit/s</div>
        <div class="gauge-label" id="gaugeLabel">PŘIPRAVENO</div>
      </div>
    </div>
  </div>

  <div class="status" id="status">Stiskni START pro test rychlosti</div>

  <button class="btn" id="startBtn" onclick="runTest()">▶ START</button>

  <div class="results">
    <div class="card">
      <div class="icon">🏓</div>
      <div class="val" id="pingVal">--</div>
      <div class="lbl">Ping (ms)</div>
    </div>
    <div class="card">
      <div class="icon">⬇️</div>
      <div class="val" id="downVal">--</div>
      <div class="lbl">Download Mbit/s</div>
    </div>
    <div class="card">
      <div class="icon">⬆️</div>
      <div class="val" id="upVal">--</div>
      <div class="lbl">Upload Mbit/s</div>
    </div>
  </div>

  <div class="footer">měřeno přes Cloudflare speed servery</div>
</div>

<script>
const PING_URL = 'https://speed.cloudflare.com/__down?bytes=0';
const DOWN_URL = 'https://speed.cloudflare.com/__down?bytes=';
const UP_URL   = 'https://speed.cloudflare.com/__up';

const gaugeValue = document.getElementById('gaugeValue');
const gaugeLabel = document.getElementById('gaugeLabel');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const pingVal = document.getElementById('pingVal');
const downVal = document.getElementById('downVal');
const upVal = document.getElementById('upVal');

function setGauge(val, label) {
  gaugeValue.textContent = val;
  gaugeLabel.textContent = label;
}

async function measurePing(samples = 4) {
  let times = [];
  for (let i = 0; i < samples; i++) {
    const t0 = performance.now();
    try {
      await fetch(PING_URL + '&_=' + Math.random(), { cache: 'no-store' });
    } catch (e) {}
    const t1 = performance.now();
    times.push(t1 - t0);
  }
  times.sort((a,b)=>a-b);
  return times[0]; // nejlepší (nejnižší) latence
}

async function measureDownload() {
  // PARALELNÍ download - 8 streamů × 25 MB = zaplníme linku
  // Vyřadíme prvních 500ms (TCP slowstart) z měření
  const PARALLEL = 8;
  const CHUNK_SIZE = 25 * 1024 * 1024; // 25 MB na stream
  const WARMUP_MS = 500; // vyřadit prvních 500ms
  const TEST_MS = 8000; // měříme 8 sekund

  statusEl.textContent = 'Měřím download (' + PARALLEL + ' paralelních streamů)...';

  let totalBytes = 0;
  let measuredBytes = 0;
  let testActive = true;
  const startTime = performance.now();
  let warmupDone = false;

  // Funkce na jeden stream
  async function streamDownload() {
    while (testActive) {
      const url = DOWN_URL + CHUNK_SIZE + '&_=' + Math.random();
      try {
        const resp = await fetch(url, { cache: 'no-store' });
        const reader = resp.body.getReader();
        while (testActive) {
          const { done, value } = await reader.read();
          if (done) break;
          totalBytes += value.length;
          if (warmupDone) measuredBytes += value.length;
        }
      } catch (e) {
        // konec při abort
      }
    }
  }

  // Spustíme 8 streamů paralelně
  const streams = [];
  for (let i = 0; i < PARALLEL; i++) {
    streams.push(streamDownload());
  }

  // Po 500ms začneme měřit "měřené" bajty
  const warmupTimer = setTimeout(() => {
    warmupDone = true;
    measuredBytes = 0; // reset
  }, WARMUP_MS);

  // Live update průběhu během 8 sekund
  const measureStart = startTime + WARMUP_MS;
  const updateTimer = setInterval(() => {
    if (warmupDone) {
      const elapsed = (performance.now() - measureStart) / 1000;
      if (elapsed > 0) {
        const mbps = (measuredBytes * 8) / elapsed / 1e6;
        downVal.textContent = mbps.toFixed(1);
        setGauge(mbps.toFixed(1), 'DOWNLOAD');
      }
    }
  }, 200);

  // Počkat na konec testu
  await new Promise(r => setTimeout(r, TEST_MS));
  testActive = false;
  clearInterval(updateTimer);
  clearTimeout(warmupTimer);

  // Finální výpočet
  const totalTime = (TEST_MS - WARMUP_MS) / 1000;
  const finalMbps = (measuredBytes * 8) / totalTime / 1e6;

  // Počkat až všechny streamy doběhnou
  try { await Promise.race([Promise.all(streams), new Promise(r => setTimeout(r, 1000))]); } catch(e){}

  downVal.textContent = finalMbps.toFixed(1);
  setGauge(finalMbps.toFixed(1), 'DOWNLOAD');
  return finalMbps;
}

async function measureUpload() {
  // Upload měření přes XMLHttpRequest s xhr.upload.onprogress
  // (fetch() neumí monitorovat upload progress - tohle je jediná spolehlivá cesta)
  // 4 paralelní streamy, každý nahrává 25 MB ve smyčce
  const PARALLEL = 4;
  const CHUNK_SIZE = 25 * 1024 * 1024; // 25 MB
  const WARMUP_MS = 1000; // upload má pomalejší slowstart
  const TEST_MS = 10000; // 10 sekund

  statusEl.textContent = 'Měřím upload (' + PARALLEL + ' paralelních streamů)...';

  // Vyrobíme jeden chunk dat
  const data = new Uint8Array(CHUNK_SIZE);
  for (let i = 0; i < CHUNK_SIZE; i += 4096) data[i] = Math.random() * 255;

  let totalUploaded = 0; // celkem nahráno bajtů (všemi streamy dohromady)
  let warmupBytes = 0; // bajty před warmup
  let testActive = true;
  let warmupDone = false;
  const testStartTime = performance.now();
  let measureStartTime = 0;
  const activeXhrs = [];

  function streamUpload() {
    return new Promise((resolve) => {
      function nextChunk() {
        if (!testActive) { resolve(); return; }
        const xhr = new XMLHttpRequest();
        activeXhrs.push(xhr);
        let lastLoaded = 0;
        xhr.upload.onprogress = (e) => {
          const delta = e.loaded - lastLoaded;
          lastLoaded = e.loaded;
          totalUploaded += delta;
        };
        xhr.onload = () => {
          const idx = activeXhrs.indexOf(xhr);
          if (idx >= 0) activeXhrs.splice(idx, 1);
          if (testActive) nextChunk();
          else resolve();
        };
        xhr.onerror = () => {
          console.warn('Upload XHR error');
          const idx = activeXhrs.indexOf(xhr);
          if (idx >= 0) activeXhrs.splice(idx, 1);
          if (testActive) {
            setTimeout(nextChunk, 100); // retry
          } else resolve();
        };
        xhr.onabort = () => {
          const idx = activeXhrs.indexOf(xhr);
          if (idx >= 0) activeXhrs.splice(idx, 1);
          resolve();
        };
        try {
          xhr.open('POST', UP_URL, true);
          xhr.send(data);
        } catch (e) {
          console.warn('Upload send fail:', e);
          if (testActive) setTimeout(nextChunk, 100);
          else resolve();
        }
      }
      nextChunk();
    });
  }

  // Spustíme 4 paralelní streamy
  const streamPromises = [];
  for (let i = 0; i < PARALLEL; i++) {
    streamPromises.push(streamUpload());
  }

  // Po 1 sekundě warmup ukončíme, resetneme čítače
  const warmupTimer = setTimeout(() => {
    warmupBytes = totalUploaded;
    warmupDone = true;
    measureStartTime = performance.now();
  }, WARMUP_MS);

  // Live update každých 200 ms
  const updateTimer = setInterval(() => {
    if (warmupDone) {
      const elapsed = (performance.now() - measureStartTime) / 1000;
      const measuredBytes = totalUploaded - warmupBytes;
      if (elapsed > 0.1) {
        const mbps = (measuredBytes * 8) / elapsed / 1e6;
        upVal.textContent = mbps.toFixed(1);
        setGauge(mbps.toFixed(1), 'UPLOAD');
      }
    }
  }, 200);

  // Čekej do konce testu
  await new Promise(r => setTimeout(r, TEST_MS));
  testActive = false;
  clearInterval(updateTimer);
  clearTimeout(warmupTimer);

  // Zruš všechny běžící XHR
  activeXhrs.forEach(xhr => { try { xhr.abort(); } catch(e){} });

  // Počkat až všechny streamy doběhnou
  try {
    await Promise.race([
      Promise.all(streamPromises),
      new Promise(r => setTimeout(r, 2000))
    ]);
  } catch(e) {}

  // Finální výpočet
  let finalMbps = 0;
  if (warmupDone) {
    const elapsed = (performance.now() - measureStartTime) / 1000;
    const measuredBytes = totalUploaded - warmupBytes;
    if (elapsed > 0) finalMbps = (measuredBytes * 8) / elapsed / 1e6;
  } else {
    // Warmup nedoběhl - použij celkový čas
    const elapsed = (performance.now() - testStartTime) / 1000;
    if (elapsed > 0) finalMbps = (totalUploaded * 8) / elapsed / 1e6;
  }

  upVal.textContent = finalMbps.toFixed(1);
  setGauge(finalMbps.toFixed(1), 'UPLOAD');
  return finalMbps;
}

async function runTest() {
  startBtn.disabled = true;
  pingVal.textContent = '--';
  downVal.textContent = '--';
  upVal.textContent = '--';
  setGauge('--', 'PŘIPRAVUJI');
  statusEl.textContent = 'Měřím ping...';

  try {
    const ping = await measurePing();
    pingVal.textContent = ping.toFixed(0);
    setGauge(ping.toFixed(0), 'PING (ms)');

    statusEl.textContent = 'Měřím download rychlost...';
    await measureDownload();

    statusEl.textContent = 'Měřím upload rychlost...';
    await measureUpload();

    statusEl.textContent = '✅ Test dokončen';
    setGauge(downVal.textContent, 'DOWNLOAD');
  } catch (e) {
    statusEl.textContent = '❌ Chyba: ' + e.message;
  }

  startBtn.disabled = false;
}
</script>
</body>
</html>
