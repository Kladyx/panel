<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="version" content="2.7Kl">
<title>KladyxHome - Smart Home Control</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

body {
  background: radial-gradient(ellipse at top, #0d1b3d 0%, #050818 60%, #000000 100%);
  color: #fff;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  padding: 20px;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.container { max-width: 600px; margin: 0 auto; position: relative; z-index: 1; }

h1 {
  text-align: center;
  margin-bottom: 8px;
  font-size: 32px;
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  color: #00d4ff;
  letter-spacing: 6px;
  text-shadow:
    0 0 10px rgba(0, 212, 255, 0.8),
    0 0 20px rgba(0, 212, 255, 0.6),
    0 0 40px rgba(0, 212, 255, 0.4);
  animation: title-glow 3s ease-in-out infinite;
}

@keyframes title-glow {
  0%, 100% { text-shadow: 0 0 10px rgba(0, 212, 255, 0.8), 0 0 20px rgba(0, 212, 255, 0.6), 0 0 40px rgba(0, 212, 255, 0.4); }
  50% { text-shadow: 0 0 15px rgba(0, 212, 255, 1), 0 0 30px rgba(0, 212, 255, 0.8), 0 0 60px rgba(0, 212, 255, 0.5); }
}

.subtitle {
  text-align: center;
  margin-bottom: 8px;
  font-size: 11px;
  color: #4a7a8a;
  letter-spacing: 4px;
  font-family: 'Orbitron', sans-serif;
}

.version-badge {
  text-align: center;
  margin-bottom: 30px;
  font-size: 12px;
  color: #00ff41;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  letter-spacing: 3px;
  text-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
  display: inline-block;
  padding: 4px 14px;
  border: 1px solid rgba(0, 255, 65, 0.4);
  border-radius: 20px;
  background: rgba(0, 255, 65, 0.05);
  margin-left: 50%;
  transform: translateX(-50%);
}

.device {
  background: linear-gradient(135deg, rgba(22, 33, 62, 0.85) 0%, rgba(15, 25, 50, 0.85) 100%);
  backdrop-filter: blur(8px);
  border: 2px solid #0f3460;
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 22px;
  box-shadow: 0 4px 20px rgba(0, 212, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
}

.device::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.8), transparent);
  animation: scan 4s linear infinite;
}

@keyframes scan {
  0% { left: -100%; }
  100% { left: 100%; }
}

.device.on {
  border-color: #00ff41;
  box-shadow:
    0 4px 30px rgba(0, 255, 65, 0.4),
    inset 0 1px 0 rgba(0, 255, 65, 0.2);
  animation: device-pulse-on 2.5s ease-in-out infinite;
}

.device.off {
  border-color: #ff3344;
  box-shadow:
    0 4px 25px rgba(255, 51, 68, 0.3),
    inset 0 1px 0 rgba(255, 51, 68, 0.15);
  animation: device-pulse-off 2.5s ease-in-out infinite;
}

.device.unknown { border-color: #555; opacity: 0.7; }

@keyframes device-pulse-on {
  0%, 100% { box-shadow: 0 4px 25px rgba(0, 255, 65, 0.35), inset 0 1px 0 rgba(0, 255, 65, 0.2); }
  50% { box-shadow: 0 4px 40px rgba(0, 255, 65, 0.7), inset 0 1px 0 rgba(0, 255, 65, 0.3); }
}

@keyframes device-pulse-off {
  0%, 100% { box-shadow: 0 4px 20px rgba(255, 51, 68, 0.25), inset 0 1px 0 rgba(255, 51, 68, 0.15); }
  50% { box-shadow: 0 4px 30px rgba(255, 51, 68, 0.5), inset 0 1px 0 rgba(255, 51, 68, 0.25); }
}

.device-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  position: relative;
  z-index: 1;
}

.device-name {
  font-size: 17px;
  font-weight: 700;
  font-family: 'Orbitron', sans-serif;
  color: #00d4ff;
  letter-spacing: 1.5px;
  text-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
}

.device-status {
  font-size: 11px;
  padding: 5px 14px;
  border-radius: 20px;
  background: rgba(50, 50, 50, 0.6);
  color: #999;
  letter-spacing: 2px;
  font-weight: 700;
  font-family: 'Orbitron', sans-serif;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.device.on .device-status {
  background: linear-gradient(135deg, #00ff41 0%, #00cc33 100%);
  color: #000;
  border-color: #00ff41;
  box-shadow: 0 0 12px rgba(0, 255, 65, 0.6);
}

.device.off .device-status {
  background: linear-gradient(135deg, #ff3344 0%, #cc2233 100%);
  color: #fff;
  border-color: #ff3344;
  box-shadow: 0 0 12px rgba(255, 51, 68, 0.5);
}

.buttons { display: flex; gap: 12px; position: relative; z-index: 1; }

.btn {
  flex: 1;
  padding: 15px 16px;
  border: 2px solid;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-family: 'Orbitron', sans-serif;
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: left 0.5s ease;
}

.btn:hover::before { left: 100%; }

.btn-on {
  background: linear-gradient(135deg, rgba(0, 80, 30, 0.6) 0%, rgba(0, 50, 20, 0.6) 100%);
  color: #00ff41;
  border-color: #00ff41;
  text-shadow: 0 0 6px rgba(0, 255, 65, 0.6);
}

.btn-on.active {
  background: linear-gradient(135deg, #00ff41 0%, #00cc33 100%);
  color: #000;
  text-shadow: none;
  animation: btn-pulse-on 1.8s ease-in-out infinite;
}

.btn-on:hover {
  background: linear-gradient(135deg, #00cc33 0%, #009922 100%);
  color: #000;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0, 255, 65, 0.4);
}

.btn-off {
  background: linear-gradient(135deg, rgba(80, 20, 30, 0.6) 0%, rgba(50, 15, 20, 0.6) 100%);
  color: #ff3344;
  border-color: #ff3344;
  text-shadow: 0 0 6px rgba(255, 51, 68, 0.6);
}

.btn-off.active {
  background: linear-gradient(135deg, #ff3344 0%, #cc2233 100%);
  color: #fff;
  text-shadow: none;
  animation: btn-pulse-off 1.8s ease-in-out infinite;
}

.btn-off:hover {
  background: linear-gradient(135deg, #cc2233 0%, #991122 100%);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 51, 68, 0.4);
}

.btn:active { transform: translateY(0) scale(0.97); }

@keyframes btn-pulse-on {
  0%, 100% { box-shadow: 0 0 12px rgba(0, 255, 65, 0.6); }
  50% { box-shadow: 0 0 25px rgba(0, 255, 65, 1); }
}

@keyframes btn-pulse-off {
  0%, 100% { box-shadow: 0 0 12px rgba(255, 51, 68, 0.6); }
  50% { box-shadow: 0 0 25px rgba(255, 51, 68, 1); }
}

.footer {
  text-align: center;
  margin-top: 25px;
  font-size: 10px;
  color: #3a5060;
  letter-spacing: 3px;
  font-family: 'Orbitron', sans-serif;
}

#debug {
  margin-top: 18px;
  padding: 14px;
  background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(0, 100, 150, 0.05) 100%);
  border: 1px solid rgba(0, 212, 255, 0.4);
  border-radius: 8px;
  font-size: 13px;
  color: #00d4ff;
  text-align: center;
  min-height: 20px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
  font-family: 'Orbitron', sans-serif;
}

#debug.ok {
  color: #00ff41;
  background: linear-gradient(135deg, rgba(0, 255, 65, 0.1) 0%, rgba(0, 100, 30, 0.05) 100%);
  border-color: rgba(0, 255, 65, 0.5);
  text-shadow: 0 0 8px rgba(0, 255, 65, 0.7);
}

#debug.err {
  color: #ff3344;
  background: linear-gradient(135deg, rgba(255, 51, 68, 0.1) 0%, rgba(100, 20, 30, 0.05) 100%);
  border-color: rgba(255, 51, 68, 0.5);
  text-shadow: 0 0 8px rgba(255, 51, 68, 0.7);
}
</style>
</head>
<body>
<div class="container">
<h1>KLADYX HOME</h1>
<div class="subtitle">SMART HOME CONTROL</div>
<div class="version-badge">v2.12Kl</div>

<div class="device unknown" id="dev-p115">
  <div class="device-header">
    <div class="device-name">DJ Studio (P115)</div>
    <div class="device-status" id="status-p115">...</div>
  </div>
  <div class="buttons">
    <button class="btn btn-on" id="btn-on-p115">Zapni Studio</button>
    <button class="btn btn-off" id="btn-off-p115">Vypni Studio</button>
  </div>
</div>

<div class="device unknown" id="dev-p100">
  <div class="device-header">
    <div class="device-name">Lavova Lampa (P100)</div>
    <div class="device-status" id="status-p100">...</div>
  </div>
  <div class="buttons">
    <button class="btn btn-on" id="btn-on-p100">Zapni Lampu</button>
    <button class="btn btn-off" id="btn-off-p100">Vypni Lampu</button>
  </div>
</div>



<div class="device unknown" id="dev-p110">
  <div class="device-header">
    <div class="device-name">System rpi 4 (P110)</div>
    <div class="device-status" id="status-p110">...</div>
  </div>
  <div class="buttons" style="display:none;">
    <button class="btn btn-on" id="btn-on-p110">Zapni</button>
    <button class="btn btn-off" id="btn-off-p110">Vypni</button>
  </div>
</div>

<div class="device-card" id="dev-ir">
  <div class="device-header">
    <div class="device-name">IR Dálkový ovladač (Tuya)</div>
    <div class="device-status">TUYA APP</div>
  </div>
  <div class="buttons">
    <button class="btn btn-on" onclick="window.location.href='tuyaSmart://'">📡 OTEVŘÍT TUYA</button>
  </div>
</div>

<div class="device-card">
  <div class="device-header">
    <div class="device-name">WiFi TP-Link</div>
    <div class="device-status">TAPO APP</div>
  </div>
  <div class="buttons">
    <button class="btn btn-on" onclick="window.location.href='intent:#Intent;package=com.tplink.iot;end'">🔌 OTEVŘÍT TAPO</button>
  </div>
</div>

<div id="debug">Pripojuji k Firebase...</div>

<div style="margin:16px auto;max-width:400px;padding:0 16px;">
  <button id="btn-restart-bridge" onclick="restartBridge()" style="
    width:100%;padding:14px;border-radius:10px;
    background:rgba(255,140,0,.1);border:1.5px solid rgba(255,140,0,.4);
    color:#ff8c00;font-family:'Orbitron',monospace;font-size:.6rem;
    letter-spacing:.15em;cursor:pointer;font-weight:700;">
    🔄 RESTART TAPO BRIDGE
  </button>
</div>

<div class="footer">KLADYXHOME v2.12Kl - FIREBASE REAL-TIME</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
var cfg = {
  apiKey: "AIzaSyDmAf2CZILbYKR72XYd3iCj3pQgnqFYTp8",
  authDomain: "kladyxland.firebaseapp.com",
  projectId: "kladyxland",
  databaseURL: "https://kladyxland-default-rtdb.europe-west1.firebasedatabase.app",
  appId: "1:178078059030:web:8d8a0271b23a7aca2b4337"
};

var dbg = document.getElementById('debug');
function log(msg, type) {
  if (dbg) {
    dbg.textContent = msg;
    dbg.className = type || '';
  }
  if (window.console) console.log('[KladyxHome]', msg);
}

try {
  firebase.initializeApp(cfg);
  var db = firebase.database();
  log('Firebase OK - cekam na data...');

  function setupDevice(node, suffix) {
    var devEl = document.getElementById('dev-' + suffix);
    var statEl = document.getElementById('status-' + suffix);
    var btnOn = document.getElementById('btn-on-' + suffix);
    var btnOff = document.getElementById('btn-off-' + suffix);

    db.ref(node).on('value', function(snap) {
      var d = snap.val();
      if (!d) {
        devEl.className = 'device unknown';
        statEl.textContent = 'OFFLINE';
        btnOn.classList.remove('active');
        btnOff.classList.remove('active');
        return;
      }
      var age = d.lastSeen ? Date.now() - d.lastSeen : 999999;
      if (age > 150000) {
        devEl.className = 'device unknown';
        statEl.textContent = 'BRIDGE OFFLINE';
        btnOn.classList.remove('active');
        btnOff.classList.remove('active');
        return;
      }
      if (d.on === true) {
        devEl.className = 'device on';
        statEl.textContent = 'ZAPNUTO';
        btnOn.classList.add('active');
        btnOff.classList.remove('active');
      } else {
        devEl.className = 'device off';
        statEl.textContent = 'VYPNUTO';
        btnOn.classList.remove('active');
        btnOff.classList.add('active');
      }
      log('Pripojeno OK', 'ok');
    }, function(err) {
      log('Chyba cteni ' + node + ': ' + (err.message || err), 'err');
    });

    function addTap(el, fn) {
      el.addEventListener('touchstart', function(e) { e.preventDefault(); fn(); }, {passive: false});
      el.addEventListener('click', fn);
    }
    addTap(btnOn, function() { sendCmd(node, 'on'); });
    addTap(btnOff, function() { sendCmd(node, 'off'); });
  }

  function sendCmd(node, cmd) {
    log('Odesilam ' + cmd.toUpperCase() + ' na ' + node + '...');
    db.ref(node + '/command').set(cmd)
      .then(function() { log('Prikaz ' + cmd.toUpperCase() + ' OK', 'ok'); })
      .catch(function(e) { log('Chyba: ' + (e.message || e), 'err'); });
  }

  setupDevice('tapoDb', 'p115');
  setupDevice('tapoDbP100', 'p100');
  setupDevice('tapoDbP110', 'p110');

} catch(e) {
  log('FATAL: ' + (e.message || e), 'err');
}

  function restartBridge() {
    var btn = document.getElementById('btn-restart-bridge');
    btn.textContent = '⏳ RESTARTUJI...';
    btn.style.pointerEvents = 'none';
    db.ref('tapoCmd/restart').set(Date.now())
      .then(function() {
        btn.textContent = '✓ PŘÍKAZ ODESLÁN';
        setTimeout(function() {
          btn.textContent = '🔄 RESTART TAPO BRIDGE';
          btn.style.pointerEvents = '';
        }, 5000);
      })
      .catch(function() {
        btn.textContent = '✗ CHYBA';
        setTimeout(function() {
          btn.textContent = '🔄 RESTART TAPO BRIDGE';
          btn.style.pointerEvents = '';
        }, 3000);
      });
  }

</script>
</body>
</html>
