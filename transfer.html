<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KladyxTransfer v1.0Kl</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    font-family:'Times New Roman', Times, serif;
    background: linear-gradient(135deg, #0a0a1a, #1a0a2a);
    color:#fff;
    overflow-x:hidden;
  }
  .wrap {
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px 60px;
    text-align:center;
  }
  .title {
    font-size:2.2rem; font-weight:900;
    background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: rainbow 6s linear infinite;
    letter-spacing:.05em;
  }
  @keyframes rainbow {
    0% { background-position:0% 50%; }
    100% { background-position:300% 50%; }
  }
  .version { color:rgba(255,255,255,.4); font-size:.9rem; margin-bottom:24px; }

  .box {
    width:100%; max-width:420px;
    border:4px solid;
    border-image: linear-gradient(135deg, #ff00ff, #00ffff, #ffff00, #ff00ff) 1;
    animation: borderPulse 4s linear infinite;
    border-radius:16px;
    padding:28px 20px;
    background: rgba(255,255,255,.04);
    box-shadow: 0 0 30px rgba(255,0,255,.2);
  }
  @keyframes borderPulse {
    0%   { border-image-source: linear-gradient(0deg,   #ff00ff, #00ffff, #ffff00, #ff00ff); }
    25%  { border-image-source: linear-gradient(90deg,  #ff00ff, #00ffff, #ffff00, #ff00ff); }
    50%  { border-image-source: linear-gradient(180deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
    75%  { border-image-source: linear-gradient(270deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
    100% { border-image-source: linear-gradient(360deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
  }

  .icon { font-size:3.5rem; margin-bottom:10px; }
  .desc { font-size:1rem; color:rgba(255,255,255,.6); margin-bottom:20px; }

  input[type=file] { display:none; }
  .pickbtn, .sendbtn {
    font-family:'Times New Roman', Times, serif;
    font-size:1.2rem; font-weight:bold;
    padding:12px 30px; border-radius:30px;
    border:2px solid #00ffff;
    background: linear-gradient(135deg, rgba(0,255,255,.15), rgba(255,0,255,.15));
    color:#fff; cursor:pointer;
    box-shadow: 0 0 15px rgba(0,255,255,.3);
    margin:8px;
  }
  .sendbtn { border-color:#00ff66; box-shadow:0 0 15px rgba(0,255,102,.3); }
  .sendbtn:disabled { opacity:.4; }

  .filename {
    margin-top:14px; font-size:.95rem; color:#ffff66;
    word-break:break-all; min-height:1.4em;
  }

  .progress-wrap {
    width:100%; height:22px; border-radius:11px;
    background:rgba(255,255,255,.1);
    overflow:hidden; margin-top:18px;
    border:1px solid rgba(255,255,255,.15);
    display:none;
  }
  .progress-bar {
    height:100%; width:0%;
    background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00);
    transition: width .2s ease;
  }
  .progress-pct { font-size:.85rem; margin-top:6px; color:rgba(255,255,255,.7); }

  .status { font-size:1rem; margin-top:18px; min-height:1.6em; color:#00ffff; }
  .footer { margin-top:30px; font-size:.8rem; color:rgba(255,255,255,.3); }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">KLADYXTRANSFER</div>
  <div class="version">v1.0 Kl</div>

  <div class="box">
    <div class="icon">📤</div>
    <div class="desc">Vyber soubor na mobilu - objeví se na PC ve složce <b>prijate</b></div>

    <label class="pickbtn" for="fileInput">📁 Vybrat soubor</label>
    <input type="file" id="fileInput" onchange="onFileSelected()">
    <div class="filename" id="fileName">Žádný soubor nevybrán</div>

    <div>
      <button class="sendbtn" id="sendBtn" onclick="sendFile()" disabled>🚀 Odeslat na PC</button>
    </div>

    <div class="progress-wrap" id="progWrap">
      <div class="progress-bar" id="progBar"></div>
    </div>
    <div class="progress-pct" id="progPct"></div>

    <div class="status" id="status"></div>
  </div>

  <div class="footer">Firebase Storage · zxnext/transfer</div>
</div>

<script>
var FC = {
  storageBucket: "kladyxland.firebasestorage.app"
};
var selectedFile = null;

function onFileSelected() {
  var input = document.getElementById('fileInput');
  var f = input.files[0];
  selectedFile = f;
  var nameEl = document.getElementById('fileName');
  var btn = document.getElementById('sendBtn');
  if (f) {
    var sizeMB = (f.size / 1e6).toFixed(2);
    nameEl.textContent = f.name + ' (' + sizeMB + ' MB)';
    btn.disabled = false;
  } else {
    nameEl.textContent = 'Žádný soubor nevybrán';
    btn.disabled = true;
  }
  document.getElementById('status').textContent = '';
}

function sendFile() {
  if (!selectedFile) return;
  var btn = document.getElementById('sendBtn');
  btn.disabled = true;

  var progWrap = document.getElementById('progWrap');
  var progBar = document.getElementById('progBar');
  var progPct = document.getElementById('progPct');
  var status = document.getElementById('status');

  progWrap.style.display = 'block';
  progBar.style.width = '0%';
  progPct.textContent = '0%';
  status.textContent = 'Nahrávám...';

  // bezpečný název souboru (bez diakritiky/mezer)
  var safeName = Date.now() + '_' + selectedFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  var path = 'zxnext/transfer/' + safeName;
  var url = 'https://firebasestorage.googleapis.com/v0/b/' + FC.storageBucket + '/o?uploadType=media&name=' + encodeURIComponent(path);

  var xhr = new XMLHttpRequest();
  xhr.open('POST', url);
  xhr.setRequestHeader('Content-Type', selectedFile.type || 'application/octet-stream');

  xhr.upload.onprogress = function(e) {
    if (e.lengthComputable) {
      var pct = Math.round((e.loaded / e.total) * 100);
      progBar.style.width = pct + '%';
      progPct.textContent = pct + '%';
    }
  };

  xhr.onload = function() {
    if (xhr.status >= 200 && xhr.status < 300) {
      progBar.style.width = '100%';
      progPct.textContent = '100%';
      status.textContent = '✅ Odesláno! Za chvíli se objeví na PC.';
    } else {
      status.textContent = '❌ Chyba při odesílání (' + xhr.status + ')';
    }
    btn.disabled = false;
  };

  xhr.onerror = function() {
    status.textContent = '❌ Chyba sítě při odesílání';
    btn.disabled = false;
  };

  xhr.send(selectedFile);
}
</script>
</body>
</html>
