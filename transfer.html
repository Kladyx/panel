<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KladyxTransfer v1.3Kl</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    font-family:'Times New Roman', Times, serif;
    background: linear-gradient(135deg, #0a0a1a, #1a0a2a);
    color:#fff;
    overflow-x:hidden;
  }
  .wrap {
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px 60px;
    text-align:center;
  }
  .title {
    font-size:2.2rem; font-weight:900;
    background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: rainbow 6s linear infinite;
    letter-spacing:.05em;
  }
  @keyframes rainbow {
    0% { background-position:0% 50%; }
    100% { background-position:300% 50%; }
  }
  .version { color:rgba(255,255,255,.4); font-size:.9rem; margin-bottom:24px; }

  .box {
    width:100%; max-width:420px;
    border:4px solid;
    border-image: linear-gradient(135deg, #ff00ff, #00ffff, #ffff00, #ff00ff) 1;
    animation: borderPulse 4s linear infinite;
    border-radius:16px;
    padding:28px 20px;
    background: rgba(255,255,255,.04);
    box-shadow: 0 0 30px rgba(255,0,255,.2);
  }
  @keyframes borderPulse {
    0%   { border-image-source: linear-gradient(0deg,   #ff00ff, #00ffff, #ffff00, #ff00ff); }
    25%  { border-image-source: linear-gradient(90deg,  #ff00ff, #00ffff, #ffff00, #ff00ff); }
    50%  { border-image-source: linear-gradient(180deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
    75%  { border-image-source: linear-gradient(270deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
    100% { border-image-source: linear-gradient(360deg, #ff00ff, #00ffff, #ffff00, #ff00ff); }
  }

  .icon { font-size:3.5rem; margin-bottom:10px; }
  .desc { font-size:1rem; color:rgba(255,255,255,.6); margin-bottom:6px; }
  .desc2 { font-size:.8rem; color:rgba(255,255,255,.4); margin-bottom:20px; }

  input[type=file] { display:none; }
  .pickbtn, .sendbtn {
    font-family:'Times New Roman', Times, serif;
    font-size:1.2rem; font-weight:bold;
    padding:12px 30px; border-radius:30px;
    border:2px solid #00ffff;
    background: linear-gradient(135deg, rgba(0,255,255,.15), rgba(255,0,255,.15));
    color:#fff; cursor:pointer;
    box-shadow: 0 0 15px rgba(0,255,255,.3);
    margin:8px;
  }
  .sendbtn { border-color:#00ff66; box-shadow:0 0 15px rgba(0,255,102,.3); }
  .sendbtn:disabled { opacity:.4; }

  .filename {
    margin-top:14px; font-size:.95rem; color:#ffff66;
    word-break:break-all; min-height:1.4em;
  }

  .status { font-size:1rem; margin-top:18px; min-height:2.4em; color:#00ffff; }
  .footer { margin-top:30px; font-size:.8rem; color:rgba(255,255,255,.3); }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">KLADYXTRANSFER</div>
  <div class="version">v1.3 Kl</div>

  <div class="box">
    <div class="icon">📤</div>
    <div class="desc">Vyber soubor na mobilu - objeví se na PC ve složce <b>prijate</b></div>
    <div class="desc2">Max. velikost cca 4 MB (foto, dokument, krátký text)</div>

    <label class="pickbtn" for="fileInput">📁 Vybrat soubor</label>
    <input type="file" id="fileInput" onchange="onFileSelected()">
    <div class="filename" id="fileName">Žádný soubor nevybrán</div>

    <div>
      <button class="sendbtn" id="sendBtn" onclick="sendFile()" disabled>🚀 Odeslat na PC</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <div class="footer">přes Firebase Realtime Database</div>
</div>

<script>
var DB_BASE = 'https://kladyxland-default-rtdb.europe-west1.firebasedatabase.app/nextsync/transfer';
var MAX_SIZE = 4 * 1024 * 1024; // 4 MB
var selectedFile = null;

function onFileSelected() {
  var input = document.getElementById('fileInput');
  var f = input.files[0];
  selectedFile = f;
  var nameEl = document.getElementById('fileName');
  var btn = document.getElementById('sendBtn');
  var status = document.getElementById('status');
  status.textContent = '';
  if (f) {
    var sizeMB = (f.size / 1e6).toFixed(2);
    nameEl.textContent = f.name + ' (' + sizeMB + ' MB)';
    if (f.size > MAX_SIZE) {
      status.textContent = '⚠️ Soubor je příliš velký (max 4 MB)';
      btn.disabled = true;
    } else {
      btn.disabled = false;
    }
  } else {
    nameEl.textContent = 'Žádný soubor nevybrán';
    btn.disabled = true;
  }
}

function sendFile() {
  if (!selectedFile) return;
  var btn = document.getElementById('sendBtn');
  var status = document.getElementById('status');
  btn.disabled = true;
  status.textContent = '📤 Čtu soubor...';

  var reader = new FileReader();
  reader.onload = function(e) {
    // e.target.result = "data:image/jpeg;base64,XXXXX"
    var dataUrl = e.target.result;
    var base64 = dataUrl.split(',')[1];

    var safeName = String(Date.now()) + '_' + selectedFile.name.replace(/[^a-zA-Z0-9_-]/g, '_');
    var payload = {
      name: selectedFile.name,
      type: selectedFile.type || 'application/octet-stream',
      data: base64,
      ts: Date.now()
    };

    status.textContent = '📡 Odesílám do databáze...';

    var url = DB_BASE + '/' + encodeURIComponent(safeName) + '.json';
    var xhr = new XMLHttpRequest();
    xhr.open('PUT', url);
    xhr.setRequestHeader('Content-Type', 'application/json');

    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        status.textContent = '✅ Odesláno! Za chvíli (do 10s) se objeví na PC ve složce prijate.';
      } else {
        status.textContent = '❌ Chyba při odesílání (' + xhr.status + '): ' + xhr.responseText;
      }
      btn.disabled = false;
    };

    xhr.onerror = function() {
      status.textContent = '❌ Chyba sítě při odesílání';
      btn.disabled = false;
    };

    xhr.send(JSON.stringify(payload));
  };

  reader.onerror = function() {
    status.textContent = '❌ Chyba při čtení souboru';
    btn.disabled = false;
  };

  reader.readAsDataURL(selectedFile);
}
</script>
</body>
</html>
